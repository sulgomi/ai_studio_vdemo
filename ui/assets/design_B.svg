<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540" role="img" aria-label="함께쌓기 카드 디자인 B안: 타이포와 지분 칸">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F9FC"/>
      <stop offset="1" stop-color="#EEF2F7"/>
    </linearGradient>
    <linearGradient id="chipB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3E8EF"/>
      <stop offset="1" stop-color="#B8C2CF"/>
    </linearGradient>
  </defs>

  <!-- 카드 배경 -->
  <rect x="0" y="0" width="856" height="540" rx="36" fill="url(#bgB)"/>
  <rect x="1" y="1" width="854" height="538" rx="35" fill="none" stroke="#D5DCE6" stroke-width="2"/>

  <!-- 접촉식 칩 -->
  <g>
    <rect x="64" y="72" width="84" height="64" rx="11" fill="url(#chipB)" stroke="#8A96A6" stroke-width="1.5"/>
    <path d="M64 93H92M64 115H92M120 93H148M120 115H148M92 72V136M120 72V136M92 104H120" fill="none" stroke="#6B7787" stroke-width="2"/>
  </g>
  <!-- 비접촉 아이콘 -->
  <g fill="none" stroke="#1F3A5F" stroke-width="4" stroke-linecap="round">
    <path d="M176 90Q183 104 176 118"/>
    <path d="M187 83Q197 104 187 125"/>
    <path d="M198 76Q211 104 198 132"/>
  </g>

  <!-- 발급사 자리표시 -->
  <text x="792" y="100" text-anchor="end" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#3E4C5E">ISSUER</text>

  <!-- 큰 타이포 -->
  <text x="58" y="292" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="122" font-weight="800" fill="#1F3A5F">함께</text>
  <text x="58" y="420" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="122" font-weight="800" fill="#1F3A5F">쌓기</text>
  <rect x="64" y="462" width="72" height="8" rx="4" fill="#F2C94C"/>

  <!-- 다섯 명의 지분 칸: 각 열은 한 사람, 같은 바닥 위에 쌓임 -->
  <g>
    <!-- 열 1 -->
    <rect x="556" y="380" width="24" height="24" rx="5" fill="#1F3A5F"/>
    <rect x="556" y="350" width="24" height="24" rx="5" fill="#1F3A5F"/>
    <rect x="556" y="320" width="24" height="24" rx="5" fill="#F2C94C"/>
    <!-- 열 2 -->
    <rect x="600" y="380" width="24" height="24" rx="5" fill="#3FA796"/>
    <rect x="600" y="350" width="24" height="24" rx="5" fill="#3FA796"/>
    <rect x="600" y="320" width="24" height="24" rx="5" fill="#3FA796"/>
    <rect x="600" y="290" width="24" height="24" rx="5" fill="#F2C94C"/>
    <!-- 열 3 -->
    <rect x="644" y="380" width="24" height="24" rx="5" fill="#1F3A5F"/>
    <rect x="644" y="350" width="24" height="24" rx="5" fill="#1F3A5F"/>
    <rect x="644" y="320" width="24" height="24" rx="5" fill="#1F3A5F"/>
    <rect x="644" y="290" width="24" height="24" rx="5" fill="#1F3A5F"/>
    <rect x="644" y="260" width="24" height="24" rx="5" fill="#F2C94C"/>
    <!-- 열 4 -->
    <rect x="688" y="380" width="24" height="24" rx="5" fill="#3FA796"/>
    <rect x="688" y="350" width="24" height="24" rx="5" fill="#3FA796"/>
    <rect x="688" y="320" width="24" height="24" rx="5" fill="#3FA796"/>
    <rect x="688" y="290" width="24" height="24" rx="5" fill="#F2C94C"/>
    <!-- 열 5 -->
    <rect x="732" y="380" width="24" height="24" rx="5" fill="#1F3A5F"/>
    <rect x="732" y="350" width="24" height="24" rx="5" fill="#1F3A5F"/>
    <rect x="732" y="320" width="24" height="24" rx="5" fill="#F2C94C"/>
    <!-- 함께 쓰는 바닥 -->
    <rect x="548" y="414" width="216" height="6" rx="3" fill="#3FA796"/>
  </g>

  <!-- 카드 이름 -->
  <text x="792" y="476" text-anchor="end" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="24" font-weight="700" fill="#1F3A5F">함께쌓기 카드</text>
</svg>
