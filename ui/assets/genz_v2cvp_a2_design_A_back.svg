<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
<defs>
<clipPath id="c"><rect width="360" height="560" rx="28"/></clipPath>
<filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 0.11  0 0 0 0 0.12  0 0 0 0 0.14  0 0 0 0.09 0"/></filter>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#1C1F24" stop-opacity=".05"/></linearGradient>
<linearGradient id="mag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2e35"/><stop offset="1" stop-color="#1C1F24"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="360" height="560" fill="#F4F1EA"/>
<rect width="360" height="560" filter="url(#grain)"/>
<rect width="360" height="560" fill="url(#sheen)"/>
<rect x="0" y="40" width="360" height="52" fill="url(#mag)"/>
<rect x="1" y="1" width="358" height="558" rx="27" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2"/>
</g>
<rect x=".5" y=".5" width="359" height="559" rx="27.5" fill="none" stroke="#1C1F24" stroke-opacity=".18"/>
<g fill="#1C1F24" font-size="8" letter-spacing="1.6" font-family="Space Mono, Menlo, monospace">
<!-- signature -->
<text x="32" y="122" fill-opacity=".6">SIGNATURE</text>
<rect x="32" y="128" width="210" height="30" fill="#fff" stroke="#1C1F24" stroke-opacity=".25"/>
<rect x="250" y="128" width="78" height="30" fill="#fff" stroke="#1C1F24" stroke-opacity=".25"/>
<text x="289" y="147" text-anchor="middle" font-size="9" letter-spacing="2" fill-opacity=".45">CVC 000</text>
<text x="32" y="176" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="7.5" letter-spacing="0" fill-opacity=".6">카드 뒷면에 본인 서명이 없으면 사용이 제한될 수 있습니다.</text>
<!-- number -->
<text x="32" y="222" fill-opacity=".6">CARD NO.</text>
<text x="32" y="246" font-size="17" letter-spacing="3" fill-opacity=".8">0000 0000 0000 0000</text>
<text x="32" y="276" fill-opacity=".6">VALID THRU</text><text x="130" y="276" fill-opacity=".8">MM/YY</text>

</g>
<!-- conditions -->
<rect x="32" y="304" width="296" height="1" fill="#1C1F24" fill-opacity=".3"/>
<g fill="#1C1F24" font-size="9">
<text x="32" y="324" font-weight="700">이용 조건</text>
<text x="32" y="343" fill-opacity=".8">첫 이용 보상 · 영역별 1회</text>
<text x="32" y="365" fill-opacity=".8">실적 조건 완화 · 정상 납부 개월 기준</text>
<text x="32" y="387" fill-opacity=".8">한도·실적 세부 기준 · 뒷면 표 참고</text>
</g>
<g stroke="#1C1F24" stroke-opacity=".15"><path d="M32 351H328M32 373H328"/></g>
<circle cx="38" cy="413" r="4" fill="#C6F45A" stroke="#1C1F24" stroke-width="1"/>
<text x="50" y="416.5" font-size="9" font-weight="700" fill="#1C1F24">조건은 뒷면 표를 확인하세요.</text>
<!-- footer -->
<g fill="#1C1F24" font-size="7.5" letter-spacing="1.4" font-family="Space Mono, Menlo, monospace" fill-opacity=".65">
<text x="32" y="474">CUSTOMER CENTER 0000-0000</text>
<text x="32" y="490">[ISSUER]</text>
<text x="328" y="490" text-anchor="end">NETWORK</text>
</g>
<g transform="translate(32 512)" fill="#1C1F24"><rect x="0" y="9" width="9" height="9" rx="3"/><rect x="12" y="0" width="9" height="18" rx="3"/><text x="30" y="16" font-size="14" font-weight="800">디딤</text></g>
</svg>
