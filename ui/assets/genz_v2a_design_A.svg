<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>
    <!-- 무광 종이 결 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.10  0 0 0 0 0.12  0 0 0 0.09 0"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.40  0 0 0 0 0.32  0 0 0 0.05 0"/>
    </filter>
    <!-- 무광: 아주 넓고 약한 빛 -->
    <radialGradient id="sheen" cx="0.22" cy="0.12" r="0.95">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#6E6450" stop-opacity="0.07"/>
    </radialGradient>
    <!-- 금색 칩 -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D29A"/>
      <stop offset="0.45" stop-color="#C9A55C"/>
      <stop offset="0.7" stop-color="#E2C686"/>
      <stop offset="1" stop-color="#A8843F"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E6E31"/>
      <stop offset="1" stop-color="#7A5D27"/>
    </linearGradient>
    <linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="0" y1="170" x2="0" y2="330">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="ledgerMask" maskUnits="userSpaceOnUse" x="0" y="0" width="360" height="560">
      <rect width="360" height="560" fill="url(#fade)"/>
    </mask>
  </defs>

  <g clip-path="url(#card)">
    <!-- 바탕: 종이색 무광 -->
    <rect width="360" height="560" fill="#F5F2EB"/>
    <rect width="360" height="560" filter="url(#fiber)"/>
    <rect width="360" height="560" filter="url(#grain)"/>

    <!-- 장부 줄무늬: 하단부, 가는 먹색 인쇄 -->
    <g mask="url(#ledgerMask)">
    <g stroke="#17191F" stroke-opacity="0.12" stroke-width="0.6">
      <line x1="0" y1="140" x2="360" y2="140"/>
      <line x1="0" y1="162" x2="360" y2="162"/>
      <line x1="0" y1="184" x2="360" y2="184"/>
      <line x1="0" y1="206" x2="360" y2="206"/>
      <line x1="0" y1="228" x2="360" y2="228"/>
      <line x1="0" y1="250" x2="360" y2="250"/>
      <line x1="0" y1="272" x2="360" y2="272"/>
      <line x1="0" y1="294" x2="360" y2="294"/>
      <line x1="0" y1="316" x2="360" y2="316"/>
      <line x1="0" y1="338" x2="360" y2="338"/>
      <line x1="0" y1="360" x2="360" y2="360"/>
      <line x1="0" y1="382" x2="360" y2="382"/>
      <line x1="0" y1="404" x2="360" y2="404"/>
      <line x1="0" y1="426" x2="360" y2="426"/>
      <line x1="0" y1="448" x2="360" y2="448"/>
      <line x1="0" y1="470" x2="360" y2="470"/>
      <line x1="0" y1="492" x2="360" y2="492"/>
      <line x1="0" y1="514" x2="360" y2="514"/>
      <line x1="0" y1="536" x2="360" y2="536"/>
    </g>
    <!-- 장부 왼쪽 여백선(두 줄) -->
    <g stroke="#17191F" stroke-opacity="0.16" stroke-width="0.6">
      <line x1="30" y1="0" x2="30" y2="560"/>
      <line x1="33" y1="0" x2="33" y2="560"/>
    </g>
    </g>
    <!-- 코랄 한 줄: 줄무늬 중 하나만 -->
    <line x1="33" y1="426" x2="360" y2="426" stroke="#FF7A59" stroke-width="1.6"/>

    <!-- 무광 빛 -->
    <rect width="360" height="560" fill="url(#sheen)"/>
  </g>

  <!-- 발급사 -->
  <text x="36" y="54" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#17191F">[ISSUER]</text>

  <!-- 비접촉 마크 -->
  <g transform="translate(316,50)" fill="none" stroke="#17191F" stroke-width="1.5" stroke-linecap="round" opacity="0.82">
    <path d="M-12 -6 A 9 9 0 0 1 -12 6"/>
    <path d="M-7 -10 A 14 14 0 0 1 -7 10"/>
    <path d="M-2 -14 A 19 19 0 0 1 -2 14"/>
    <path d="M3 -18 A 24 24 0 0 1 3 18"/>
  </g>

  <!-- 금색 칩 (세로형 배치) -->
  <g transform="translate(36,96)">
    <rect x="0.5" y="1" width="42" height="54" rx="7" fill="#17191F" opacity="0.10"/>
    <rect x="0" y="0" width="42" height="54" rx="7" fill="url(#gold)"/>
    <g fill="none" stroke="url(#goldLine)" stroke-width="0.9" opacity="0.75">
      <path d="M14 0 V17 M28 0 V17 M14 54 V37 M28 54 V37"/>
      <path d="M0 18 H11 M42 18 H31 M0 36 H11 M42 36 H31"/>
      <rect x="11" y="17" width="20" height="20" rx="3"/>
    </g>
    <rect x="0" y="0" width="42" height="54" rx="7" fill="none" stroke="#7A5D27" stroke-opacity="0.5" stroke-width="0.6"/>
  </g>

  <!-- 로고 락업: 심볼 + 구독노트 (줄 위에 앉음) -->
  <g transform="translate(46,389)">
    <!-- 심볼: 모서리 접힌 먹색 메모지, 장부 두 줄은 종이색으로 비워 두고 한 줄만 코랄 -->
    <path d="M4 0 H21 L30 9 V26 A4 4 0 0 1 26 30 H4 A4 4 0 0 1 0 26 V4 A4 4 0 0 1 4 0 Z" fill="#17191F"/>
    <path d="M21 0 V6 A3 3 0 0 0 24 9 H30 Z" fill="#B9BEC6"/>
    <rect x="6" y="11" width="13" height="2" fill="#F5F2EB"/>
    <rect x="6" y="17" width="18" height="2" fill="#F5F2EB"/>
    <rect x="6" y="23" width="18" height="2.4" fill="#FF7A59"/>
  </g>
  <text x="86" y="419" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#17191F">구독노트</text>

  <!-- 카드 종류 / 네트워크 자리표시 -->
  <text x="36" y="522" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" font-weight="600" letter-spacing="2.4" fill="#17191F" opacity="0.85">CREDIT</text>
  <g transform="translate(250,500)">
    <rect x="0" y="0" width="74" height="30" rx="5" fill="none" stroke="#17191F" stroke-opacity="0.45" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="37" y="19" text-anchor="middle" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.4" fill="#17191F" opacity="0.6">NETWORK</text>
  </g>

  <!-- 시안 코드 -->
  <text x="324" y="478" text-anchor="end" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#17191F" opacity="0.4">MEMO</text>

  <!-- 가장자리 한 줄: 카드 단면 -->
  <rect x="0.6" y="0.6" width="358.8" height="558.8" rx="27.4" fill="none" stroke="#17191F" stroke-opacity="0.22" stroke-width="1.2"/>
  <rect x="2" y="2" width="356" height="556" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="0.8"/>
</svg>
