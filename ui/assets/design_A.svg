<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540" role="img" aria-label="함께쌓기 카드 디자인 A안: 모임 블록 탑">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F3A5F"/>
      <stop offset="1" stop-color="#152A45"/>
    </linearGradient>
    <linearGradient id="chipA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBD38A"/>
      <stop offset="1" stop-color="#C9A84A"/>
    </linearGradient>
    <pattern id="gridA" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 카드 배경 -->
  <rect x="0" y="0" width="856" height="540" rx="36" fill="url(#bgA)"/>
  <rect x="0" y="0" width="856" height="540" rx="36" fill="url(#gridA)"/>

  <!-- 발급사 자리표시 -->
  <text x="64" y="84" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#D6E0EE">ISSUER</text>

  <!-- 접촉식 칩 -->
  <g>
    <rect x="64" y="186" width="96" height="72" rx="12" fill="url(#chipA)"/>
    <path d="M64 210H96M64 234H96M128 210H160M128 234H160M96 186V258M128 186V258M96 222H128" fill="none" stroke="#8C6F24" stroke-width="2"/>
  </g>
  <!-- 비접촉 아이콘 -->
  <g fill="none" stroke="#F5F7FA" stroke-width="4" stroke-linecap="round">
    <path d="M190 206Q198 222 190 238"/>
    <path d="M202 198Q214 222 202 246"/>
    <path d="M214 190Q230 222 214 254"/>
  </g>

  <!-- 모임이 함께 쌓는 블록 탑 -->
  <g>
    <!-- 다음 달 채울 빈 칸 -->
    <rect x="566" y="186" width="90" height="56" rx="8" fill="none" stroke="#F2C94C" stroke-width="3" stroke-dasharray="10 8"/>
    <!-- 3단 -->
    <rect x="566" y="248" width="90" height="56" rx="8" fill="#F2C94C"/>
    <!-- 2단 -->
    <rect x="518" y="310" width="90" height="56" rx="8" fill="#3FA796"/>
    <rect x="614" y="310" width="90" height="56" rx="8" fill="#F5F7FA"/>
    <!-- 1단 -->
    <rect x="470" y="372" width="90" height="56" rx="8" fill="#F5F7FA"/>
    <rect x="566" y="372" width="90" height="56" rx="8" fill="#3FA796"/>
    <rect x="662" y="372" width="90" height="56" rx="8" fill="#F2C94C"/>
  </g>

  <!-- 구성원 다섯 명과 각자 옮기는 화살표 -->
  <g fill="#F5F7FA">
    <circle cx="486" cy="482" r="13"/>
    <circle cx="552" cy="482" r="13" fill="#3FA796"/>
    <circle cx="618" cy="482" r="13" fill="#F2C94C"/>
    <circle cx="684" cy="482" r="13" fill="#3FA796"/>
    <circle cx="750" cy="482" r="13"/>
  </g>
  <g fill="none" stroke="#D6E0EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M486 462V440M480 446L486 440L492 446"/>
    <path d="M552 462V440M546 446L552 440L558 446"/>
    <path d="M618 462V440M612 446L618 440L624 446"/>
    <path d="M684 462V440M678 446L684 440L690 446"/>
    <path d="M750 462V440M744 446L750 440L756 446"/>
  </g>

  <!-- 카드 이름 -->
  <text x="64" y="474" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">함께쌓기 카드</text>
  <text x="64" y="414" font-family="'Noto Sans KR','Apple SD Gothic Neo',sans-serif" font-size="18" font-weight="500" letter-spacing="1" fill="#D6E0EE">내 몫을 한 칸씩, 함께</text>
</svg>
