<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.31  0 0 0 0 0.25  0 0 0 -1.25 0.72" />
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.22 0.3" numOctaves="2" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0 0.29  0 0 0 -3 1.55" />
    </filter>
    <radialGradient id="light" cx="0.78" cy="0.12" r="1.05">
      <stop offset="0" stop-color="#FFFDF7" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#F4F1EA" stop-opacity="0"/>
      <stop offset="1" stop-color="#C9C2B2" stop-opacity="0.22"/>
    </radialGradient>
    <pattern id="sig" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#FBFAF6"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#16181D" stroke-opacity="0.08" stroke-width="2"/>
    </pattern>
  </defs>

  <g clip-path="url(#card)">
    <rect width="360" height="560" fill="#F4F1EA"/>
    <rect width="360" height="560" filter="url(#fibre)" opacity="0.22"/>
    <rect width="360" height="560" filter="url(#grain)" opacity="0.6"/>
    <rect width="360" height="560" fill="url(#light)"/>
  </g>
  <rect x="0.6" y="0.6" width="358.8" height="558.8" rx="27.4" fill="none" stroke="#D8D2C4" stroke-width="1.2"/>

  <g font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#16181D">
    <!-- small lockup -->
    <g transform="translate(46 54)">
      <circle r="12" fill="#16181D"/>
      <g fill="#F4F1EA">
        <circle cx="-2.6" cy="-2.6" r="1.4"/><circle cx="2.6" cy="-2.6" r="1.4"/>
        <circle cx="-2.6" cy="2.6" r="1.4"/><circle cx="2.6" cy="2.6" r="1.4"/>
      </g>
      <g stroke="#FFB547" stroke-width="1.1" stroke-linecap="round"><path d="M -2.6 -1.8 V 1.8"/><path d="M 2.6 -1.8 V 1.8"/></g>
    </g>
    <text x="66" y="59.5" font-size="14" font-weight="800">첫단추</text>
    <text x="326" y="59" font-size="9" font-weight="600" letter-spacing="1.2" text-anchor="end">[ISSUER]</text>

    <!-- card data placeholders -->
    <text x="34" y="108" font-size="7.5" font-weight="600" letter-spacing="1.4" opacity="0.55">CARD NUMBER</text>
    <text x="34" y="128" font-size="15" font-weight="500" letter-spacing="2.2">XXXX XXXX XXXX XXXX</text>

    <text x="34" y="158" font-size="7.5" font-weight="600" letter-spacing="1.4" opacity="0.55">VALID THRU</text>
    <text x="34" y="175" font-size="13" font-weight="500" letter-spacing="1.6">MM/YY</text>
    <text x="140" y="158" font-size="7.5" font-weight="600" letter-spacing="1.4" opacity="0.55">CVC</text>
    <text x="140" y="175" font-size="13" font-weight="500" letter-spacing="1.6">XXX</text>

    <text x="34" y="205" font-size="7.5" font-weight="600" letter-spacing="1.4" opacity="0.55">CARDHOLDER</text>
    <text x="34" y="221" font-size="11" font-weight="600" letter-spacing="1.4">[NAME]</text>

    <!-- signature panel -->
    <rect x="34" y="242" width="292" height="40" rx="3" fill="url(#sig)" stroke="#16181D" stroke-opacity="0.2" stroke-width="0.6"/>
    <text x="34" y="292" font-size="7.5" letter-spacing="0.6" opacity="0.6">AUTHORIZED SIGNATURE · 본인 서명</text>

    <!-- rule block -->
    <line x1="34" y1="318" x2="326" y2="318" stroke="#16181D" stroke-width="0.6"/>
    <text x="34" y="340" font-size="11" font-weight="700">이 카드의 규칙</text>
    <g transform="translate(34 352)" fill="none" stroke="#16181D" stroke-width="0.8">
      <rect x="0.0" y="0" width="40" height="5" rx="1"/>
      <rect x="50.4" y="0" width="40" height="5" rx="1"/>
      <rect x="100.8" y="0" width="40" height="5" rx="1"/>
      <rect x="151.2" y="0" width="40" height="5" rx="1"/>
      <rect x="201.6" y="0" width="40" height="5" rx="1"/>
      <rect x="252.0" y="0" width="40" height="5" rx="1"/>
    </g>
    <g font-size="9.5" font-weight="500">
      <text x="34" y="378">여섯 칸은 발급 후 여섯 달의 연습 구간입니다.</text>
      <text x="34" y="393">연습 구간이 지나면 전월실적 조건이 풀립니다.</text>
      <text x="34" y="408">연체가 생기면 연습 구간으로 돌아옵니다.</text>
      <text x="34" y="423">한도와 남은 조건은 앱에서 확인하세요.</text>
    </g>
    <line x1="34" y1="440" x2="326" y2="440" stroke="#16181D" stroke-width="0.6"/>

    <!-- fine print -->
    <g font-size="7.5" opacity="0.7">
      <text x="34" y="458">이 카드는 [ISSUER]의 소유이며 양도·대여할 수 없습니다.</text>
      <text x="34" y="470">분실·도난 시 바로 신고해 주세요. 서명 후 사용할 수 있습니다.</text>
    </g>
    <text x="34" y="492" font-size="8.5" font-weight="600">고객센터 [TEL]</text>
    <text x="180" y="492" font-size="8.5" font-weight="600">분실신고 [TEL]</text>

    <!-- bottom -->
    <text x="34" y="528" font-size="8" font-weight="700" letter-spacing="2">CREDIT · DAWN</text>
    <g transform="translate(270 510)">
      <rect x="0" y="0" width="56" height="22" rx="4" fill="none" stroke="#16181D" stroke-width="0.9" stroke-dasharray="2 2"/>
      <text x="28" y="14" font-size="7" font-weight="600" letter-spacing="1" text-anchor="middle">NETWORK</text>
    </g>
  </g>
</svg>
