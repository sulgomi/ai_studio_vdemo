<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>
    <pattern id="minor" width="12" height="12" patternUnits="userSpaceOnUse" x="0" y="8">
      <path d="M12 0V12M0 12H12" fill="none" stroke="#8A8F98" stroke-width="0.5" opacity="0.22"/>
    </pattern>
    <pattern id="hatch" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V4" stroke="#8A8F98" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.39  0 0 0 0 0.33  0 0 0 0.9 -0.32"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="5"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.52  0 0 0 0 0.45  0 0 0 0.6 -0.22"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="sheen" cx="0.72" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22252C"/>
      <stop offset="0.5" stop-color="#15171C"/>
      <stop offset="1" stop-color="#1B1D23"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="360" height="560" fill="#F3F0E8"/>
    <rect width="360" height="560" fill="#F3F0E8" filter="url(#fiber)" opacity="0.18"/>
    <rect width="360" height="560" fill="url(#minor)"/>
    <rect width="360" height="560" fill="#F3F0E8" filter="url(#paper)" opacity="0.55"/>
    <rect width="360" height="560" fill="url(#sheen)"/>
    <!-- 마그네틱 띠 -->
    <rect x="0" y="44" width="360" height="48" fill="url(#stripe)"/>
  </g>

  <!-- 서명란 (인쇄 띠) + CVC -->
  <text x="36" y="120" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="6.5" font-weight="600" letter-spacing="1.4" fill="#8A8F98">AUTHORIZED SIGNATURE · 서명</text>
  <g transform="translate(36 126)">
    <rect width="236" height="34" fill="#FBFAF6"/>
    <rect width="236" height="34" fill="url(#hatch)"/>
    <rect x="198" y="0" width="38" height="34" fill="#FBFAF6"/>
    <path d="M198 0V34" stroke="#8A8F98" stroke-opacity="0.5" stroke-width="0.6"/>
    <text x="217" y="21.5" text-anchor="middle" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5" fill="#15171C">•••</text>
  </g>
  <text x="280" y="137" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="6.5" font-weight="600" letter-spacing="1.4" fill="#8A8F98">CVC</text>

  <!-- 카드 정보 자리표시 -->
  <g font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#15171C">
    <text x="36" y="200" font-size="6.5" font-weight="600" letter-spacing="1.4" fill="#8A8F98">CARD NUMBER</text>
    <g fill="#15171C"><circle cx="38" cy="214" r="2"/><circle cx="47" cy="214" r="2"/><circle cx="56" cy="214" r="2"/><circle cx="65" cy="214" r="2"/><circle cx="86" cy="214" r="2"/><circle cx="95" cy="214" r="2"/><circle cx="104" cy="214" r="2"/><circle cx="113" cy="214" r="2"/><circle cx="134" cy="214" r="2"/><circle cx="143" cy="214" r="2"/><circle cx="152" cy="214" r="2"/><circle cx="161" cy="214" r="2"/><circle cx="182" cy="214" r="2"/><circle cx="191" cy="214" r="2"/><circle cx="200" cy="214" r="2"/><circle cx="209" cy="214" r="2"/></g>
    <text x="36" y="250" font-size="6.5" font-weight="600" letter-spacing="1.4" fill="#8A8F98">VALID THRU</text>
    <text x="36" y="266" font-size="12" font-weight="500" letter-spacing="2">MM / YY</text>
    <text x="144" y="250" font-size="6.5" font-weight="600" letter-spacing="1.4" fill="#8A8F98">CARDHOLDER</text>
    <text x="144" y="266" font-size="12" font-weight="500" letter-spacing="1.6">[NAME]</text>
  </g>

  <!-- 구분선 -->
  <path d="M36 300.5H324" stroke="#15171C" stroke-opacity="0.7" stroke-width="0.8"/>

  <!-- 조건 안내 한 줄 -->
  <g transform="translate(36 318)">
    <rect x="0" y="0" width="8" height="8" fill="#9EEBC8"/>
    <rect x="0" y="0" width="8" height="8" fill="none" stroke="#15171C" stroke-width="0.8"/>
    <text x="16" y="7.6" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="9.5" font-weight="600" fill="#15171C">첫 12개월 연습 구간과 졸업 조건, 한도는 꾸준 앱에서 확인하세요.</text>
  </g>

  <!-- 보안·이용 문구 -->
  <g font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="7.5" font-weight="400" fill="#4A4E56">
    <text x="36" y="356">이 카드는 서명한 본인만 사용할 수 있으며, 타인에게 양도하거나 빌려줄 수 없습니다.</text>
    <text x="36" y="370">분실·도난 시 즉시 고객센터나 앱에서 사용 정지를 신청해 주세요.</text>
    <text x="36" y="384">이 카드는 [ISSUER]의 자산이며, 요청 시 반납해야 합니다.</text>
  </g>

  <!-- 고객센터 -->
  <g font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" fill="#15171C">
    <text x="36" y="424" font-size="6.5" font-weight="600" letter-spacing="1.4" fill="#8A8F98">고객센터</text>
    <text x="36" y="440" font-size="10" font-weight="600" letter-spacing="0.6">[CUSTOMER CENTER]</text>
    <text x="180" y="424" font-size="6.5" font-weight="600" letter-spacing="1.4" fill="#8A8F98">분실 신고 · 24시간</text>
    <text x="180" y="440" font-size="10" font-weight="600" letter-spacing="0.6">[LOST CARD LINE]</text>
  </g>

  <!-- 하단: 발급사 / 네트워크 -->
  <g transform="translate(36 492)">
    <g fill="none" stroke="#15171C" stroke-width="0.5">
      <rect x="0" y="-2" width="5" height="36"/>
      <path d="M0 1H5M0 4H5M0 7H5M0 10H5M0 13H5M0 16H5M0 19H5M0 22H5M0 25H5M0 28H5M0 31H5"/>
    </g>
    <rect x="0.4" y="-1.6" width="4.2" height="2.6" fill="#9EEBC8"/>
    <text x="13" y="14" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="13" font-weight="700" fill="#15171C">꾸준</text>
    <text x="13" y="30" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="8" font-weight="600" letter-spacing="1.4" fill="#8A8F98">[ISSUER] CREDIT</text>
  </g>
  <g transform="translate(260 492)">
    <rect x="0" y="0" width="64" height="32" rx="5" fill="none" stroke="#15171C" stroke-opacity="0.8" stroke-width="0.9"/>
    <text x="32" y="19.5" text-anchor="middle" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="8" font-weight="600" letter-spacing="1.2" fill="#15171C">NETWORK</text>
  </g>

  <rect x="0.6" y="0.6" width="358.8" height="558.8" rx="27.4" fill="none" stroke="#8A8F98" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="2" y="2" width="356" height="556" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="0.8"/>
</svg>
