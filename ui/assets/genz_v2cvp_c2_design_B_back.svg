<text font-size="7.5" fill="#1B1D22" opacity=".7"><tspan x="28" y="440">이 카드는 [ISSUER]가 발급하며 서명한 본인만 사용할 수 있습니다.</tspan><tspan x="28" y="452">분실·도난 시 즉시 고객센터에 신고해 주세요. 습득 시 [ISSUER]로 반환 바랍니다.</tspan></text>
