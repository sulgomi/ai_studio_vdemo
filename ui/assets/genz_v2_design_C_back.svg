<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>
    <linearGradient id="base" x1="0.82" y1="0" x2="0.38" y2="1">
      <stop offset="0" stop-color="#1F2A4D"/>
      <stop offset="0.45" stop-color="#1A2138"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse" x="9" y="10">
      <path d="M18 0 V18 M0 18 H18" fill="none" stroke="#8A8F98" stroke-width="0.4"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="360" height="560" fill="url(#gridFade)"/></mask>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.88  0 0 0 0 0.95  0 0 0 0.55 -0.18"/>
    </filter>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0C4CA" stop-opacity="0.4"/>
      <stop offset="0.25" stop-color="#C0C4CA" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>
    <!-- 자기띠 -->
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0C0D10"/>
      <stop offset="0.5" stop-color="#1A1C21"/>
      <stop offset="1" stop-color="#0E0F12"/>
    </linearGradient>
    <!-- 서명란: 종이아이보리 -->
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V5" stroke="#C0C4CA" stroke-width="0.6"/>
    </pattern>
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4F5DE"/>
      <stop offset="0.4" stop-color="#9EEBC8"/>
      <stop offset="1" stop-color="#86D9B4"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="360" height="560" fill="url(#base)"/>
    <g mask="url(#gridMask)" opacity="0.22"><rect width="360" height="560" fill="url(#grid)"/></g>
    <rect width="360" height="560" filter="url(#grain)" opacity="0.10"/>

    <!-- 자기띠: 세로 카드의 긴 변을 따라 -->
    <rect x="270" y="0" width="54" height="560" fill="url(#stripe)"/>
    <rect x="270" y="0" width="0.6" height="560" fill="#3A4256" opacity="0.6"/>
    <rect x="284" y="0" width="10" height="560" fill="#fff" opacity="0.025"/>
    <rect x="323.4" y="0" width="0.6" height="560" fill="#3A4256" opacity="0.6"/>
  </g>

  <g font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <!-- 상단 락업(소형) + 발급사 -->
    <g transform="translate(32 40)">
      <g transform="translate(0 1)" stroke-linecap="round">
        <rect x="0" y="0" width="7" height="2.6" rx="0.8" fill="url(#foil)"/>
        <path d="M0.4 5.3 H4.5 M0.4 9.3 H4.5 M0.4 13.3 H7 M0.4 17.3 H4.5" stroke="#9EEBC8" stroke-width="0.8" opacity="0.8"/>
      </g>
      <text x="13" y="17" font-size="17" font-weight="700" fill="url(#foil)">꾸준</text>
    </g>
    <text x="238" y="55" text-anchor="end" font-size="9" font-weight="600" letter-spacing="2.4" fill="#C0C4CA" opacity="0.8">CREDIT</text>

    <!-- 카드 정보 자리표시 -->
    <g transform="translate(32 104)">
      <text x="0" y="0" font-size="7" font-weight="500" letter-spacing="1.4" fill="#8A8F98">CARD NUMBER</text>
      <text x="0" y="20" font-size="14" font-weight="500" letter-spacing="1.6" fill="#E4E6EA" font-family="SF Mono, Menlo, JetBrains Mono, monospace">XXXX XXXX XXXX XXXX</text>

      <text x="0" y="52" font-size="7" font-weight="500" letter-spacing="1.4" fill="#8A8F98">VALID THRU</text>
      <text x="0" y="68" font-size="12" font-weight="500" letter-spacing="1.4" fill="#E4E6EA" font-family="SF Mono, Menlo, JetBrains Mono, monospace">MM/YY</text>

      <text x="96" y="52" font-size="7" font-weight="500" letter-spacing="1.4" fill="#8A8F98">CVC</text>
      <text x="96" y="68" font-size="12" font-weight="500" letter-spacing="1.4" fill="#E4E6EA" font-family="SF Mono, Menlo, JetBrains Mono, monospace">XXX</text>

      <text x="0" y="100" font-size="7" font-weight="500" letter-spacing="1.4" fill="#8A8F98">CARDHOLDER</text>
      <text x="0" y="116" font-size="11" font-weight="600" letter-spacing="1.6" fill="#E4E6EA">CARDHOLDER NAME</text>
    </g>

    <!-- 서명란 -->
    <g transform="translate(32 248)">
      <text x="0" y="0" font-size="7" font-weight="500" letter-spacing="1.4" fill="#8A8F98">AUTHORIZED SIGNATURE · 서명</text>
      <rect x="0" y="8" width="206" height="36" rx="3" fill="#F3F0E8"/>
      <rect x="0" y="8" width="206" height="36" rx="3" fill="url(#hatch)" opacity="0.55"/>
      <text x="198" y="40" text-anchor="end" font-size="6" font-weight="500" letter-spacing="1" fill="#8A8F98">NOT VALID UNLESS SIGNED</text>
    </g>

    <!-- 조건 안내 한 줄 -->
    <g transform="translate(32 324)">
      <text x="0" y="0" font-size="8.6" font-weight="600" fill="#9EEBC8">첫 12개월 연습 구간과 졸업 조건, 한도는</text>
      <text x="0" y="13" font-size="8.6" font-weight="600" fill="#9EEBC8">꾸준 앱에서 확인할 수 있습니다.</text>
    </g>

    <!-- 보안·이용 문구 -->
    <g transform="translate(32 368)" font-size="7" font-weight="400" fill="#A9AEB6">
      <text x="0" y="0">이 카드는 서명한 본인만 사용할 수 있으며</text>
      <text x="0" y="11">다른 사람에게 빌려주거나 넘길 수 없습니다.</text>
      <text x="0" y="22">잃어버리거나 도난당한 경우 바로 신고해 주세요.</text>
      <text x="0" y="33">신고 전 부정 사용 책임은 약관에 따릅니다.</text>
    </g>

    <!-- 고객센터 -->
    <g transform="translate(32 434)">
      <path d="M0 0 H206" stroke="#8A8F98" stroke-width="0.5" opacity="0.5"/>
      <text x="0" y="17" font-size="7" font-weight="500" letter-spacing="0.6" fill="#8A8F98">고객센터</text>
      <text x="206" y="17" text-anchor="end" font-size="8" font-weight="600" letter-spacing="0.8" fill="#E4E6EA">[CS NUMBER]</text>
      <text x="0" y="32" font-size="7" font-weight="500" letter-spacing="0.6" fill="#8A8F98">분실·도난 신고 (24시간)</text>
      <text x="206" y="32" text-anchor="end" font-size="8" font-weight="600" letter-spacing="0.8" fill="#E4E6EA">[LOST NUMBER]</text>
      <text x="0" y="47" font-size="7" font-weight="500" letter-spacing="0.6" fill="#8A8F98">발급사</text>
      <text x="206" y="47" text-anchor="end" font-size="8" font-weight="600" letter-spacing="0.8" fill="#E4E6EA">[ISSUER]</text>
    </g>

    <!-- 하단 -->
    <text x="32" y="522" font-size="7" font-weight="500" letter-spacing="2" fill="#8A8F98" opacity="0.75">NIGHT</text>
    <g transform="translate(168 500)">
      <rect x="0.5" y="0.5" width="69" height="27" rx="6" fill="none" stroke="#8A8F98" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
      <text x="35" y="18" text-anchor="middle" font-size="7.5" font-weight="600" letter-spacing="1.6" fill="#C0C4CA" opacity="0.8">NETWORK</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="359" height="559" rx="27.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</svg>
