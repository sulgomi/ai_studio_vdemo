<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>
    <!-- rising fill: lime at the bottom, warming to coral just under the line -->
    <linearGradient id="rise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C8F04A"/>
      <stop offset="0.45" stop-color="#CFEC4E"/>
      <stop offset="0.78" stop-color="#F2B866"/>
      <stop offset="1" stop-color="#FF8A6B"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#EFEBE2"/>
    </linearGradient>
    <!-- soft lateral falloff so the print reads as ink on a curved-light surface -->
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16181D" stop-opacity="0.06"/>
      <stop offset="0.25" stop-color="#16181D" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <!-- satin sheen -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.30" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="0.54" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="0.66" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- gold chip -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D29A"/>
      <stop offset="0.45" stop-color="#C9A55A"/>
      <stop offset="0.7" stop-color="#E4C985"/>
      <stop offset="1" stop-color="#A9863F"/>
    </linearGradient>
    <pattern id="screen" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#16181D" opacity="0.045"/>
    </pattern>
    <!-- matte print grain -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.09  0 0 0 0 0.11  0 0 0 0.10 0"/>
    </filter>
    <filter id="emb" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <g clip-path="url(#card)">
    <!-- body -->
    <rect width="360" height="560" fill="url(#cream)"/>
    <!-- rising colour, stops just below the line -->
    <rect x="0" y="201" width="360" height="359" fill="url(#rise)"/>
    <rect x="0" y="201" width="360" height="359" fill="url(#screen)"/>
    <!-- grain over everything printed -->
    <rect width="360" height="560" filter="url(#grain)"/>
    <rect width="360" height="560" fill="url(#side)"/>
    <rect width="360" height="560" fill="url(#sheen)"/>

    <!-- the one line: edge to edge, debossed ink -->
    <rect x="0" y="197" width="360" height="1.2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="0" y="195" width="360" height="2.4" fill="#16181D"/>

    <!-- top row: issuer + variant engraving -->
    <text x="30" y="46" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#16181D">[ISSUER]</text>
    <text x="330" y="46" text-anchor="end" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="8" font-weight="500" letter-spacing="2" fill="#16181D" opacity="0.45">GAUGE</text>

    <!-- chip (gold) -->
    <g transform="translate(30 82)">
      <rect width="46" height="36" rx="7" fill="url(#gold)"/>
      <rect x="0.5" y="0.5" width="45" height="35" rx="6.5" fill="none" stroke="#8C6E30" stroke-opacity="0.55"/>
      <g fill="none" stroke="#8C6E30" stroke-opacity="0.6" stroke-width="0.8">
        <path d="M0 12 H15 M0 24 H15 M31 12 H46 M31 24 H46"/>
        <rect x="15" y="8" width="16" height="20" rx="3.5"/>
        <path d="M23 0 V8 M23 28 V36"/>
      </g>
      <rect x="2" y="2" width="42" height="9" rx="4" fill="#FFFFFF" opacity="0.18"/>
    </g>

    <!-- contactless, sitting right on top of the line -->
    <g transform="translate(316 170)" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round">
      <path d="M-14 -7 A9 9 0 0 1 -14 7"/>
      <path d="M-8 -12 A15 15 0 0 1 -8 12"/>
      <path d="M-2 -17 A21 21 0 0 1 -2 17"/>
    </g>

    <!-- logo lockup: symbol + 킵라인, in ink on the colour -->
    <g transform="translate(30 418)">
      <!-- symbol: a tube filled up to, never past, its line -->
      <rect x="5" y="0" width="22" height="36" rx="11" fill="none" stroke="#16181D" stroke-width="2.4"/>
      <path d="M9.5 15.5 H22.5 V25 A6.5 6.5 0 0 1 9.5 25 Z" fill="#16181D"/>
      <rect x="0" y="9.6" width="32" height="2.4" fill="#16181D"/>
      <text x="44" y="29" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.6" fill="#16181D">킵라인</text>
    </g>

    <!-- small type label + network placeholder -->
    <text x="30" y="522" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.6" fill="#16181D" opacity="0.75">CREDIT</text>
    <g transform="translate(330 522)">
      <rect x="-62" y="-14" width="62" height="20" rx="10" fill="none" stroke="#16181D" stroke-opacity="0.35" stroke-width="0.8" stroke-dasharray="2 2"/>
      <text x="-31" y="-0.5" text-anchor="middle" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="7.5" font-weight="700" letter-spacing="1.6" fill="#16181D" opacity="0.7">NETWORK</text>
    </g>
  </g>

  <!-- coral painted edge + top-edge highlight -->
  <rect x="1.1" y="1.1" width="357.8" height="557.8" rx="26.9" fill="none" stroke="#FF8A6B" stroke-width="2.2"/>
  <rect x="3.5" y="3.5" width="353" height="553" rx="24.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8"/>
</svg>
