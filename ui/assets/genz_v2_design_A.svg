<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>
    <!-- paper fibre: fine grain + longer fibres, desaturated, very low contrast -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.31  0 0 0 0 0.25  0 0 0 -1.25 0.72" />
    </filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.22 0.3" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0 0.29  0 0 0 -3 1.55" />
    </filter>
    <!-- soft morning falloff, no gloss -->
    <radialGradient id="light" cx="0.22" cy="0.12" r="1.05">
      <stop offset="0" stop-color="#FFFDF7" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#F4F1EA" stop-opacity="0"/>
      <stop offset="1" stop-color="#C9C2B2" stop-opacity="0.22"/>
    </radialGradient>
    <!-- gold chip -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9D29A"/>
      <stop offset="0.35" stop-color="#CDAE66"/>
      <stop offset="0.62" stop-color="#F1DEA8"/>
      <stop offset="1" stop-color="#B38F45"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8F7034"/>
      <stop offset="1" stop-color="#6E5427"/>
    </linearGradient>
    <!-- button face: ink with a faint rim so it reads as a pressed mark -->
    <radialGradient id="btn" cx="0.42" cy="0.38" r="0.7">
      <stop offset="0" stop-color="#262930"/>
      <stop offset="1" stop-color="#16181D"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="360" height="560" fill="#F4F1EA"/>
    <rect width="360" height="560" filter="url(#fibre)" opacity="0.22"/>
    <rect width="360" height="560" filter="url(#grain)" opacity="0.6"/>
    <rect width="360" height="560" fill="url(#light)"/>
  </g>
  <!-- card edge: thin core line, slightly darker than face -->
  <rect x="0.6" y="0.6" width="358.8" height="558.8" rx="27.4" fill="none" stroke="#D8D2C4" stroke-width="1.2"/>
  <rect x="2" y="2" width="356" height="556" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="0.8"/>

  <g font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <!-- issuer -->
    <text x="36" y="56" font-size="11" font-weight="600" letter-spacing="1.6" fill="#16181D">[ISSUER]</text>

    <!-- contactless (tap first: top right, where it meets the terminal) -->
    <g transform="translate(312 50)" fill="none" stroke="#16181D" stroke-width="2" stroke-linecap="round">
      <path d="M -10 -7 A 9 9 0 0 1 -10 7"/>
      <path d="M -4 -11 A 14 14 0 0 1 -4 11"/>
      <path d="M 2 -15 A 19 19 0 0 1 2 15"/>
    </g>

    <!-- gold chip, portrait -->
    <g transform="translate(36 92)">
      <rect x="0" y="0" width="44" height="56" rx="7" fill="url(#goldEdge)"/>
      <rect x="0.8" y="0.6" width="42.4" height="54.6" rx="6.4" fill="url(#gold)"/>
      <g fill="none" stroke="#9A7A3C" stroke-width="0.9" opacity="0.85">
        <path d="M 14 0.6 V 18 H 0.8"/>
        <path d="M 30 0.6 V 18 H 43.2"/>
        <path d="M 14 55.2 V 38 H 0.8"/>
        <path d="M 30 55.2 V 38 H 43.2"/>
        <path d="M 0.8 28 H 12"/>
        <path d="M 43.2 28 H 32"/>
        <rect x="12" y="18" width="20" height="20" rx="3"/>
      </g>
      <rect x="1.5" y="1.2" width="41" height="12" rx="5" fill="#FFF6DA" opacity="0.18"/>
    </g>

    <!-- logo lockup: four-hole button, debossed ink print -->
    <g transform="translate(76 352)">
            <circle r="40" fill="#16181D"/>
      <circle r="33.5" fill="none" stroke="#F4F1EA" stroke-opacity="0.16" stroke-width="1"/>
      <g fill="#F4F1EA">
        <circle cx="-8.5" cy="-8.5" r="4.2"/>
        <circle cx="8.5" cy="-8.5" r="4.2"/>
        <circle cx="-8.5" cy="8.5" r="4.2"/>
        <circle cx="8.5" cy="8.5" r="4.2"/>
      </g>
      <!-- one thread, the first stitch -->
      <g stroke="#FFB547" stroke-width="3.4" stroke-linecap="round"><path d="M -8.5 -6 V 6"/><path d="M 8.5 -6 V 6"/></g>
    </g>
    <text x="36" y="444" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#16181D">첫단추</text>

    <!-- six-cell scale: six months after issue -->
    <g transform="translate(36 476)" fill="none" stroke="#16181D" stroke-width="0.9">
      <rect x="0"     y="0" width="43" height="6" rx="1"/>
      <rect x="49"    y="0" width="43" height="6" rx="1"/>
      <rect x="98"    y="0" width="43" height="6" rx="1"/>
      <rect x="147"   y="0" width="43" height="6" rx="1"/>
      <rect x="196"   y="0" width="43" height="6" rx="1"/>
      <rect x="245"   y="0" width="43" height="6" rx="1"/>
    </g>

    <!-- bottom row -->
    <text x="36" y="526" font-size="10" font-weight="700" letter-spacing="2.4" fill="#16181D">CREDIT</text>
    <g transform="translate(260 508)">
      <rect x="0" y="0" width="64" height="24" rx="4" fill="none" stroke="#16181D" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="32" y="15.5" font-size="8" font-weight="600" letter-spacing="1.2" text-anchor="middle" fill="#16181D">NETWORK</text>
    </g>

    <!-- edge engraving -->
    <text transform="translate(334 232) rotate(90)" font-size="7" letter-spacing="2" fill="#16181D" opacity="0.45">DAWN · 01</text>
  </g>
</svg>
