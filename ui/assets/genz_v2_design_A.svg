<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>
    <pattern id="minor" width="12" height="12" patternUnits="userSpaceOnUse" x="0" y="8">
      <path d="M12 0V12M0 12H12" fill="none" stroke="#8A8F98" stroke-width="0.5" opacity="0.32"/>
    </pattern>
    <pattern id="major" width="60" height="60" patternUnits="userSpaceOnUse" x="0" y="8">
      <path d="M60 0V60M0 60H60" fill="none" stroke="#8A8F98" stroke-width="0.7" opacity="0.38"/>
    </pattern>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.39  0 0 0 0 0.33  0 0 0 0.9 -0.32" result="speck"/>
      <feComposite in="speck" in2="SourceGraphic" operator="in"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="3" result="f"/>
      <feColorMatrix in="f" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.52  0 0 0 0 0.45  0 0 0 0.6 -0.22"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <radialGradient id="sheen" cx="0.28" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.7" stop-color="#6E6450" stop-opacity="0"/>
      <stop offset="1" stop-color="#6E6450" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6CF94"/>
      <stop offset="0.45" stop-color="#C9A55F"/>
      <stop offset="0.75" stop-color="#DDBF7E"/>
      <stop offset="1" stop-color="#A9853F"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C6C2E"/>
      <stop offset="1" stop-color="#6F5422"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <!-- 무광 종이아이보리 바탕 -->
    <rect width="360" height="560" fill="#F3F0E8"/>
    <rect width="360" height="560" fill="#F3F0E8" filter="url(#fiber)" opacity="0.18"/>
    <!-- 옅은 모눈 (연필회색 인쇄) -->
    <rect width="360" height="560" fill="url(#minor)"/>
    <rect width="360" height="560" fill="url(#major)"/>
    <rect width="360" height="560" fill="#F3F0E8" filter="url(#paper)" opacity="0.55"/>
    <!-- 무광 확산광 -->
    <rect width="360" height="560" fill="url(#sheen)"/>
    <rect width="360" height="560" fill="url(#shade)"/>
  </g>

  <!-- 발급사 자리표시 -->
  <text x="36" y="55" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#15171C">[ISSUER]</text>

  <!-- 비접촉 마크 -->
  <g transform="translate(316 47)" fill="none" stroke="#15171C" stroke-width="1.6" stroke-linecap="round">
    <path d="M-9 -6 A9 9 0 0 1 -9 6" transform="translate(4 0)"/>
    <path d="M-9 -10 A14 14 0 0 1 -9 10" transform="translate(9 0)"/>
    <path d="M-9 -14 A19 19 0 0 1 -9 14" transform="translate(14 0)"/>
  </g>

  <!-- 금색 칩 -->
  <g transform="translate(36 104)">
    <rect x="0" y="0" width="48" height="60" rx="8" fill="url(#gold)"/>
    <rect x="0.5" y="0.5" width="47" height="59" rx="7.5" fill="none" stroke="#7E6128" stroke-opacity="0.55"/>
    <g fill="none" stroke="url(#goldLine)" stroke-width="0.9" stroke-opacity="0.75">
      <path d="M16 0V18M32 0V18M16 42V60M32 42V60"/>
      <path d="M0 22H14M34 22H48M0 38H14M34 38H48"/>
      <rect x="14" y="18" width="20" height="24" rx="4"/>
      <path d="M24 18V42"/>
    </g>
    <rect x="1" y="1" width="46" height="20" rx="7" fill="#FFFFFF" opacity="0.12"/>
  </g>

  <!-- 로고 락업: 열두 칸 눈금 + 세로 꾸준 -->
  <g transform="translate(36 320)">
    <g fill="none" stroke="#15171C" stroke-width="1.1">
      <rect x="0" y="0" width="12" height="144"/>
      <path d="M0 12H12M0 24H12M0 36H12M0 48H12M0 60H12M0 72H12M0 84H12M0 96H12M0 108H12M0 120H12M0 132H12"/>
    </g>
    <rect x="0.55" y="0.55" width="10.9" height="10.9" fill="#9EEBC8"/>
    <rect x="0" y="0" width="12" height="12" fill="none" stroke="#15171C" stroke-width="1.1"/>
    <text x="24" y="61" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="66" font-weight="700" letter-spacing="0" fill="#15171C">꾸</text>
    <text x="24" y="139" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="66" font-weight="700" fill="#15171C">준</text>
  </g>

  <!-- 카드 종류 / 네트워크 자리표시 -->
  <text x="36" y="516" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" font-weight="600" letter-spacing="2.4" fill="#15171C">CREDIT</text>
  <g transform="translate(260 492)">
    <rect x="0" y="0" width="64" height="32" rx="5" fill="none" stroke="#15171C" stroke-opacity="0.8" stroke-width="0.9"/>
    <text x="32" y="19.5" text-anchor="middle" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="8" font-weight="600" letter-spacing="1.2" fill="#15171C">NETWORK</text>
  </g>

  <!-- 모서리 각인: 시안 코드 -->
  <text transform="translate(331 404) rotate(90)" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="7" font-weight="500" letter-spacing="2.2" fill="#8A8F98">GRID</text>

  <!-- 옆면 한 줄 (가장자리) -->
  <rect x="0.6" y="0.6" width="358.8" height="558.8" rx="27.4" fill="none" stroke="#8A8F98" stroke-opacity="0.55" stroke-width="1"/>
  <rect x="2" y="2" width="356" height="556" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="0.8"/>
</svg>
