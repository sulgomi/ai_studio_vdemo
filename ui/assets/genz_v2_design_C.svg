<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>

    <!-- 밤남색 → 먹잉크, 위에서 아래로 -->
    <linearGradient id="base" x1="0.18" y1="0" x2="0.62" y2="1">
      <stop offset="0" stop-color="#232F55"/>
      <stop offset="0.38" stop-color="#1F2A4D"/>
      <stop offset="0.78" stop-color="#181D2C"/>
      <stop offset="1" stop-color="#15171C"/>
    </linearGradient>

    <!-- 스탠드 불빛: 왼쪽 위에서 들어오는 아주 약한 빛 -->
    <radialGradient id="lamp" cx="0.12" cy="0.06" r="0.75">
      <stop offset="0" stop-color="#3A4A7A" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#2A3760" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#1F2A4D" stop-opacity="0"/>
    </radialGradient>

    <!-- 모눈: 스팟 UV 유광 인쇄 느낌으로 아주 옅게 -->
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse" x="9" y="10">
      <path d="M18 0 V18 M0 18 H18" fill="none" stroke="#8A8F98" stroke-width="0.4"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.45"/>
      <stop offset="0.9" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="360" height="560" fill="url(#gridFade)"/></mask>

    <!-- 무광 소프트터치 질감 -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.88  0 0 0 0 0.95  0 0 0 0.55 -0.18"/>
    </filter>

    <!-- 가장자리 빛: 위쪽 모서리만 살짝 밝게 -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C0C4CA" stop-opacity="0.45"/>
      <stop offset="0.25" stop-color="#C0C4CA" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.35"/>
    </linearGradient>

    <!-- 흑연 칩 -->
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6068"/>
      <stop offset="0.45" stop-color="#3E434B"/>
      <stop offset="1" stop-color="#2B2F36"/>
    </linearGradient>
    <linearGradient id="chipSheen" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- 민트 박(호일) -->
    <linearGradient id="foil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4F5DE"/>
      <stop offset="0.35" stop-color="#9EEBC8"/>
      <stop offset="0.7" stop-color="#86D9B4"/>
      <stop offset="1" stop-color="#A9EFCF"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="360" height="560" fill="url(#base)"/>
    <rect width="360" height="560" fill="url(#lamp)"/>
    <g mask="url(#gridMask)" opacity="0.26">
      <rect width="360" height="560" fill="url(#grid)"/>
    </g>
    <rect width="360" height="560" filter="url(#grain)" opacity="0.10"/>

    <!-- 옆면 각인: 오른쪽 가장자리 열두 눈금 (레이저 각인), 첫 눈금만 민트 -->
    <g transform="translate(0 150)" stroke-linecap="round">
      <path d="M338 0 H349" stroke="#9EEBC8" stroke-width="1.2" opacity="0.9"/>
      <path d="M343 20 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M343 40 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M340 60 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M343 80 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M343 100 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M340 120 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M343 140 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M343 160 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M340 180 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M343 200 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
      <path d="M343 220 H349" stroke="#8A8F98" stroke-width="0.7" opacity="0.45"/>
    </g>
  </g>

  <!-- 상단: 발급사 -->
  <text x="36" y="52" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="11" font-weight="600" letter-spacing="2.2" fill="#C0C4CA" opacity="0.85">[ISSUER]</text>

  <!-- 칩 (세로 방향, 흑연) -->
  <g transform="translate(36 92)">
    <rect x="0" y="0" width="42" height="54" rx="7" fill="url(#chip)"/>
    <rect x="0.5" y="0.5" width="41" height="53" rx="6.5" fill="none" stroke="#7A8089" stroke-width="0.8" opacity="0.7"/>
    <g fill="none" stroke="#23262C" stroke-width="1" opacity="0.9">
      <path d="M0 18 H13 M29 18 H42 M0 36 H13 M29 36 H42"/>
      <rect x="13" y="12" width="16" height="30" rx="4"/>
      <path d="M21 0 V12 M21 42 V54"/>
    </g>
    <rect x="0" y="0" width="42" height="54" rx="7" fill="url(#chipSheen)"/>
  </g>

  <!-- 비접촉: 민트 선 (세로 카드 기준 위쪽을 향함) -->
  <g transform="translate(110 132)" fill="none" stroke="#9EEBC8" stroke-linecap="round">
    <path d="M-5 0 A5 5 0 0 1 5 0" stroke-width="1.6"/>
    <path d="M-10.5 0 A10.5 10.5 0 0 1 10.5 0" stroke-width="1.6" opacity="0.8"/>
    <path d="M-16 0 A16 16 0 0 1 16 0" stroke-width="1.6" opacity="0.6"/>
  </g>

  <!-- 로고 락업: 열두 칸 눈금 + 꾸/준 세로 -->
  <g transform="translate(36 330)">
    <!-- 심볼: 열두 줄 눈금, 첫 줄만 채운 칸 -->
    <g transform="translate(0 5)" stroke-linecap="round">
      <rect x="0" y="0" width="14" height="5" rx="1.5" fill="url(#foil)"/>
      <path d="M0.6 10.5 H9" stroke="#9EEBC8" stroke-width="1.3" opacity="0.7"/>
      <path d="M0.6 18.5 H9" stroke="#9EEBC8" stroke-width="1.3" opacity="0.7"/>
      <path d="M0.6 26.5 H14" stroke="#9EEBC8" stroke-width="1.3" opacity="0.9"/>
      <path d="M0.6 34.5 H9" stroke="#9EEBC8" stroke-width="1.3" opacity="0.7"/>
      <path d="M0.6 42.5 H9" stroke="#9EEBC8" stroke-width="1.3" opacity="0.7"/>
      <path d="M0.6 50.5 H14" stroke="#9EEBC8" stroke-width="1.3" opacity="0.9"/>
      <path d="M0.6 58.5 H9" stroke="#9EEBC8" stroke-width="1.3" opacity="0.7"/>
      <path d="M0.6 66.5 H9" stroke="#9EEBC8" stroke-width="1.3" opacity="0.7"/>
      <path d="M0.6 74.5 H14" stroke="#9EEBC8" stroke-width="1.3" opacity="0.9"/>
      <path d="M0.6 82.5 H9" stroke="#9EEBC8" stroke-width="1.3" opacity="0.7"/>
      <path d="M0.6 90.5 H9" stroke="#9EEBC8" stroke-width="1.3" opacity="0.7"/>
    </g>
    <!-- 워드마크 -->
    <g font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-weight="700" font-size="46">
      <g fill="#0B0D12" opacity="0.55" transform="translate(0.4 0.9)">
        <text x="28" y="42">꾸</text>
        <text x="28" y="94">준</text>
      </g>
      <g fill="url(#foil)">
        <text x="28" y="42">꾸</text>
        <text x="28" y="94">준</text>
      </g>
    </g>
  </g>

  <!-- 하단: 카드 종류 / 네트워크 자리표시 -->
  <text x="36" y="510" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#C0C4CA" opacity="0.8">CREDIT</text>
  <text x="36" y="524" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#8A8F98" opacity="0.7">NIGHT</text>

  <g transform="translate(246 494)">
    <rect x="0.5" y="0.5" width="77" height="31" rx="7" fill="none" stroke="#8A8F98" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <text x="39" y="20" text-anchor="middle" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="8.5" font-weight="600" letter-spacing="1.8" fill="#C0C4CA" opacity="0.8">NETWORK</text>
  </g>

  <!-- 외곽 테두리: 위는 빛, 아래는 그늘 -->
  <rect x="0.5" y="0.5" width="359" height="559" rx="27.5" fill="none" stroke="url(#rim)" stroke-width="1"/>
</svg>
