<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <clipPath id="card"><rect x="0" y="0" width="360" height="560" rx="28"/></clipPath>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F4EE"/>
      <stop offset="1" stop-color="#EFEBE2"/>
    </linearGradient>
    <linearGradient id="rise" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#C8F04A"/>
      <stop offset="1" stop-color="#D6E853"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2D33"/>
      <stop offset="0.5" stop-color="#16181D"/>
      <stop offset="1" stop-color="#22252B"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.32" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.64" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sig" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#FBFAF6"/>
      <rect width="3" height="6" fill="#F1EEE6"/>
    </pattern>
    <pattern id="screen" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#16181D" opacity="0.045"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.09  0 0 0 0 0.09  0 0 0 0 0.11  0 0 0 0.10 0"/>
    </filter>
  </defs>

  <g clip-path="url(#card)" font-family="Pretendard Variable, Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect width="360" height="560" fill="url(#cream)"/>
    <!-- a low band of lime at the foot: the back of the same fill -->
    <rect x="0" y="508" width="360" height="52" fill="url(#rise)"/>
    <rect x="0" y="508" width="360" height="52" fill="url(#screen)"/>
    <rect x="0" y="503" width="360" height="1.6" fill="#16181D"/>
    <rect width="360" height="560" filter="url(#grain)"/>
    <rect width="360" height="560" fill="url(#sheen)"/>

    <!-- magnetic stripe -->
    <rect x="0" y="38" width="360" height="52" fill="url(#stripe)"/>
    <rect x="0" y="38" width="360" height="0.8" fill="#FFFFFF" opacity="0.12"/>

    <!-- signature panel + CVC -->
    <text x="30" y="120" font-size="7" font-weight="600" letter-spacing="1.4" fill="#16181D" opacity="0.55">AUTHORIZED SIGNATURE · 서명</text>
    <rect x="30" y="127" width="232" height="34" rx="3" fill="url(#sig)"/>
    <rect x="30.4" y="127.4" width="231.2" height="33.2" rx="2.8" fill="none" stroke="#16181D" stroke-opacity="0.18" stroke-width="0.8"/>
    <rect x="270" y="127" width="60" height="34" rx="3" fill="#FFFFFF"/>
    <rect x="270.4" y="127.4" width="59.2" height="33.2" rx="2.8" fill="none" stroke="#16181D" stroke-opacity="0.18" stroke-width="0.8"/>
    <text x="300" y="148.5" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="2" fill="#16181D" font-style="italic">[CVC]</text>
    <text x="30" y="174" font-size="6.6" fill="#16181D" opacity="0.55">본인이 서명한 카드만 사용할 수 있습니다. 서명이 없는 카드는 사용할 수 없습니다.</text>

    <!-- card data placeholders -->
    <text x="30" y="214" font-size="7" font-weight="600" letter-spacing="1.4" fill="#16181D" opacity="0.55">CARD NUMBER</text>
    <text x="30" y="238" font-size="17" font-weight="600" letter-spacing="2.2" fill="#16181D">[CARD NUMBER]</text>

    <g transform="translate(30 268)">
      <text x="0" y="0" font-size="7" font-weight="600" letter-spacing="1.4" fill="#16181D" opacity="0.55">VALID THRU</text>
      <text x="0" y="20" font-size="13" font-weight="600" letter-spacing="1.6" fill="#16181D">[MM/YY]</text>
      <text x="110" y="0" font-size="7" font-weight="600" letter-spacing="1.4" fill="#16181D" opacity="0.55">CARDHOLDER</text>
      <text x="110" y="20" font-size="13" font-weight="600" letter-spacing="1.6" fill="#16181D">[NAME]</text>
    </g>

    <!-- rule: one sentence, set between two hairlines -->
    <rect x="30" y="318" width="300" height="0.8" fill="#16181D" opacity="0.35"/>
    <g transform="translate(30 342)">
      <g transform="translate(0 -11) scale(0.5)">
        <rect x="5" y="0" width="22" height="36" rx="11" fill="#C8F04A" stroke="#16181D" stroke-width="2.6"/>
        <path d="M9.5 15.5 H22.5 V25 A6.5 6.5 0 0 1 9.5 25 Z" fill="#16181D"/>
        <rect x="0" y="9.6" width="32" height="2.6" fill="#16181D"/>
      </g>
      <text x="26" y="0" font-size="10.5" font-weight="700" fill="#16181D">예산선 안에서 쓴 달은</text>
      <text x="26" y="16" font-size="10.5" font-weight="700" fill="#16181D">다음 달 1위 영역 적립이 더해집니다.</text>
      <text x="26" y="34" font-size="8" fill="#16181D" opacity="0.65">예산선 설정, 1위 영역 배정, 한도와 세부 조건은</text>
      <text x="26" y="46" font-size="8" fill="#16181D" opacity="0.65">킵라인 앱에서 확인하세요.</text>
    </g>
    <rect x="30" y="404" width="300" height="0.8" fill="#16181D" opacity="0.35"/>

    <!-- service + legal -->
    <g font-size="7.2" fill="#16181D">
      <text x="30" y="428" opacity="0.55" font-weight="600" letter-spacing="1.2">고객센터</text>
      <text x="80" y="428" font-weight="600">[ISSUER] [0000-0000]</text>
      <text x="30" y="443" opacity="0.55" font-weight="600" letter-spacing="1.2">분실·도난</text>
      <text x="80" y="443" font-weight="600">[0000-0000] · 24시간</text>
      <text x="30" y="466" opacity="0.6">이 카드는 [ISSUER]의 재산이며, 습득하신 분은 가까운 영업점이나</text>
      <text x="30" y="477" opacity="0.6">고객센터로 돌려주시기 바랍니다. 타인에게 양도·대여할 수 없습니다.</text>
    </g>

    <!-- foot band: small marks -->
    <text x="30" y="538" font-size="8.5" font-weight="800" fill="#16181D">킵라인</text>
    <text x="68" y="538" font-size="7" font-weight="600" letter-spacing="2" fill="#16181D" opacity="0.7">CREDIT · GAUGE</text>
    <text x="330" y="538" text-anchor="end" font-size="7" font-weight="700" letter-spacing="1.6" fill="#16181D" opacity="0.7">NETWORK</text>
  </g>

  <rect x="1.1" y="1.1" width="357.8" height="557.8" rx="26.9" fill="none" stroke="#FF8A6B" stroke-width="2.2"/>
  <rect x="3.5" y="3.5" width="353" height="553" rx="24.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="0.8"/>
</svg>
