<title>AI Studio 프로젝트 허브</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 상단 제목 + 가로 탭 → 섹션별 표/카드. 읽고 스캔하는 PM 문서형 */
:root{--bg:#f3f5f7;--surface:#fff;--surface2:#eaeef2;--line:#d5dbe2;--ink:#12202e;--mute:#5b6b7b;--accent:#0b6e66;--accent-ink:#fff;--accent-soft:#d6efec;--warn:#b45309;--warn-soft:#fdecd2;--bad:#b4233a;--bad-soft:#fbdde2;--ok:#17794a;--ok-soft:#d8f1e3;--font:'IBM Plex Sans KR','Noto Sans KR',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e161e;--surface:#16212c;--surface2:#1d2b38;--line:#2c3d4d;--ink:#e6edf3;--mute:#90a2b3;--accent:#4fd1c1;--accent-ink:#06211e;--accent-soft:#143a38;--warn:#f2b45a;--warn-soft:#3a2c12;--bad:#ff8196;--bad-soft:#40191f;--ok:#5fd493;--ok-soft:#133323;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e161e;--surface:#16212c;--surface2:#1d2b38;--line:#2c3d4d;--ink:#e6edf3;--mute:#90a2b3;--accent:#4fd1c1;--accent-ink:#06211e;--accent-soft:#143a38;--warn:#f2b45a;--warn-soft:#3a2c12;--bad:#ff8196;--bad-soft:#40191f;--ok:#5fd493;--ok-soft:#133323;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.6 var(--font);padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px;letter-spacing:-.01em}h2{font-size:17px;margin:22px 0 8px}h3{font-size:14px;margin:18px 0 6px}
.sub{color:var(--mute);font-size:13px}
.tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:4px}
.tabs button{border:0;background:none;color:var(--mute);font:600 13px var(--font);padding:9px 11px;cursor:pointer;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--accent);border-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
section{display:none}section.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-size:11.5px;color:var(--mute);position:sticky;top:0}
td.k{font-weight:600;white-space:nowrap}tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font:500 11px var(--mono);padding:1px 7px;border-radius:99px;background:var(--surface2);color:var(--mute);margin:1px 2px 1px 0}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.warn{background:var(--warn-soft);color:var(--warn)}.tag.acc{background:var(--accent-soft);color:var(--accent)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
ul{margin:4px 0;padding-left:18px}li{margin:2px 0}
.note{font-size:12.5px;color:var(--mute)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}
.flow div{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:12.5px}.flow b{display:block;font-size:11px;font-family:var(--mono);color:var(--accent);margin-bottom:2px}
.dec{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:10px 0;overflow:hidden}
.dec>h3{margin:0;padding:10px 14px;background:var(--surface2);font-size:14px}
.dec .b{padding:4px 14px 12px;display:grid;grid-template-columns:90px 1fr;gap:6px 12px}.dec .b>b{color:var(--mute);font-size:12px;padding-top:2px}.dec .b>div{min-width:0}
@media(max-width:560px){.dec .b{grid-template-columns:1fr;gap:0}.dec .b>b{margin-top:6px}}
.who{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pill{font:600 11px var(--mono);padding:2px 8px;border-radius:4px;background:var(--accent);color:var(--accent-ink)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.filter button{font:500 12px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 11px;cursor:pointer}.filter button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ms{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 8px 8px 0;margin:6px 0}

.dg{width:100%;height:auto;display:block}.dg text{font-family:var(--font);fill:var(--ink)}.dg .m{fill:var(--mute)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:6px 0}.lg i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:4px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}

#s-aws{--fg:var(--ink);--mut:var(--mute);--box:var(--surface);--keyl:var(--accent);--key:var(--accent-soft);--ext:var(--warn);--aws:var(--line);--card:var(--surface);--bd:var(--ink);--bn:var(--bg)}
#s-aws figure{margin:6px 0 8px;background:var(--card);border:1px solid var(--aws);border-radius:10px;padding:12px;overflow-x:auto}
#s-aws figure svg{display:block;width:100%;min-width:760px;height:auto;color:var(--fg)}
#s-aws figcaption{font-size:12.5px;color:var(--mut);margin-top:8px}
#s-aws .aws{fill:none;stroke:var(--aws);stroke-width:1.5;stroke-dasharray:6 5}
#s-aws .gl{stroke:var(--aws);stroke-width:1}
#s-aws .box{fill:var(--box);stroke:var(--mute);stroke-width:1.2}
#s-aws .box.key{fill:var(--key);stroke:var(--keyl);stroke-width:1.8}
#s-aws .box.ext{stroke:var(--ext);stroke-dasharray:5 4}
#s-aws svg .t{font-size:13px;font-weight:700;fill:var(--fg)}
#s-aws svg .s{font-size:11px;fill:var(--mut)}
#s-aws svg .lbl{font-size:12px;fill:var(--mut)}
#s-aws .a{fill:none;stroke:currentColor;stroke-width:1.5}
#s-aws .a.dash{stroke-dasharray:4 3}
#s-aws .bd{fill:var(--bd)}
#s-aws .bn{font-size:10.5px;font-weight:700;fill:var(--bn)}
#s-aws ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:8px 22px}
#s-aws ol li{display:flex;gap:10px;align-items:flex-start;font-size:13px;min-width:0;margin:0}
#s-aws ol li div{min-width:0}
#s-aws .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bd);color:var(--bn);font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:2px}
#s-aws .adec{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
#s-aws .adec>div{background:var(--card);border:1px solid var(--aws);border-radius:8px;padding:11px 13px;font-size:13px;min-width:0}
#s-aws .adec b{display:block;margin-bottom:4px}
#s-aws table{min-width:760px}#s-aws td:first-child{white-space:nowrap;font-weight:600}
#s-aws code{font-family:var(--mono);font-size:.9em}
#s-aws p.note{margin:0 0 8px}
</style>

 '<h2>10. 에이전트 선택 + 동적 선행 라우팅</h2>'+ul(['채팅 UI에서 쓸 에이전트를 직접 선택(프리셋: 시장조사만·컨셉까지·검증까지·브랜딩까지·전체·자동). 가드레일은 항상 참여','선택한 에이전트의 의존성(DEPS)을 보고 오케스트레이터가 선행 단계를 런타임에 추가하고 경로(prereq)로 기록, 선행 단계는 결과만 쓰고 대화에는 나오지 않음','시장조사 안에서 일부(예: 트렌드+경쟁)만 고르면 그 범위만 실행','한계: 지금은 의존성 규칙이 코드(DEPS 표)로 고정. 완전한 LLM 라우팅은 Bedrock 연결 후 검증 필요'])+
 '<h2>11. 실제 LLM 컨셉 에이전트 테스트(Claude를 컨셉 에이전트로 투입)</h2><div class="note">템플릿 대신 Claude 서브에이전트가 컨셉 후보를 직접 설계하고, 엔진의 검증기(스키마·금칙어·새로움·손익·가상 페르소나·행동 손익)가 평가했습니다. Bedrock 모델이 아니라 이 세션의 Claude이므로 운영 모델 성능의 대리 지표는 아닙니다. 표본이 작은 1회 시험입니다.</div>'+tbl(['구분','결과'],[['입력','엔진의 시장조사·시장기회 결과 팩(타깃 투자입문자·1인가구), 제약 4종'],['1차(9안)','스키마·금칙어 위반 0건 / 모든 게이트 통과 5안(투자입문자 5/6, 1인가구 0/3)'],['피드백 1회 후(수정 4안)','투자입문자 1/1, 1인가구 2/3 통과 → 최종 투자입문자 6/6, 1인가구 2/3'],['템플릿 대비','LLM 손익 4.3~12.1만원(템플릿 3.1~4.1)·채택 의향 32~43%(템플릿 우승안 46%). 혜택을 보수적으로 잡아 손익은 높고 채택은 낮은 경향, 피드백 후 혜택을 올려 보정'],['LLM 쪽이 나았던 점','작동 방식·위험이 구체적(혜택 풀 정산, 탈퇴 시 지분 정산 등), 새로움 0.56~0.81']])+'<h3>드러난 한계</h3>'+ul(['<b>검증기는 메커니즘을 보지 못함</b>: 평가가 태그·혜택율·복잡도·연계만 읽어서 서술한 작동 방식의 질을 측정하지 못함. 실제로 이름과 서술이 어긋난 안("잔돈이 주식이 되는 카드"인데 서술은 일반 포인트 적립)을 검증기가 통과시킴','<b>복잡도는 자기 보고</b>: LLM이 적은 cx를 그대로 쓰므로 조작 여지. 0.15만 올려도 채택 의향이 약 3%p 하락해 경계 안이 뒤집힘 → 독립 복잡도 추정 필요','<b>피드백 루프는 작동</b>: 거절 사유와 수치를 받으면 혜택·연회비·전환 지원을 고쳐 통과하나, 어떤 변경이 효과였는지는 검증기 점수로만 알 수 있음','다음 확인: 같은 입력을 여러 번 돌린 분산, 템플릿과 동일 개수의 후보 비교, 사람 전문가의 메커니즘 평가'])+'<div class="note" style="margin-top:6px">재현: poc/llm/make_pack.js → 서브에이전트가 out_*.json 작성 → poc/llm/eval_llm.js</div>'+
 '<h2>12. 브랜딩 시각 자산: 만드는 방식 3가지 비교와 실행 결과</h2><div class="note">요구: 브랜딩 에이전트가 카드 후보 이미지를 만들고 하나를 고르고 영상까지 만들어야 한다. 운영(Bedrock)에서는 이미지·영상 생성 API를 부를 수 있지만 지금은 가안 단계라 세 가지 방식의 비용과 결과를 따져 정했습니다. 가격은 웹 페이지에서 확인한 값이며 Bedrock 공식 요금표로 확인하지 못했고 바뀌었을 수 있습니다.</div>'+tbl(['방식','비용(25초 영상 1편 + 카드 이미지 3안 기준)','결과물의 성격','판단'],[['A. 생성 API 직접 호출(Nova Canvas, Nova Reel, Veo)','이미지 1장 약 0.04~0.08달러, Nova Reel 초당 약 0.08달러(6초 클립 상한, 25초면 클립 5개 이상 이어 붙임, 약 2.4달러), Veo 3.1은 초당 약 0.08~0.40달러이고 Bedrock에 없음(다른 클라우드 호출). 재생성 횟수가 늘면 비용이 비례','사진 같은 질감은 가능. 한글 글자가 깨지기 쉬워 카드 이름과 고지 문구를 안정적으로 넣기 어렵고, 같은 결과를 다시 만들기 어려움','운영 단계의 후보. 카드 질감 시안과 영상 배경 소스에 쓰고 글자는 코드로 얹는 구성이 현실적'],['B. MCP 연결(HeyGen HyperFrames)','계정·크레딧 조건은 확인하지 못함','사용자의 HeyGen 계정에 호스팅 프로젝트가 생김. CLI 에이전트에서는 제작·렌더 도구가 막혀 있어 이 세션에서는 쓸 수 없음','실행하지 않음. 외부 계정에 부작용이 생기고 데이터가 밖으로 나가므로 고객 환경 정책 확인 후 검토'],['C. Claude가 코드로 제작(SVG, HTML 모션, 프레임 캡처, ffmpeg)','추가 요금 없이 토큰만 사용. 이번 실행은 디자인 약 10만, 영상 약 13만 토큰(서브에이전트 사용량)','벡터 그래픽과 모션그래픽. 한글 문구와 고지를 정확히 넣고, 대비·비율·금칙어를 코드로 검증하고, 수정이 쉬움. 사진 같은 질감과 3D는 못 만듦','이번 베타에서 채택. 기획 보드와 시안 단계에 충분하고 검증이 가능']])+'<h3>이번 실행에서 실제로 한 것(C안)</h3>'+ul(['카드 앞면 디자인 3안을 Claude(Opus)가 SVG로 직접 작성. 비율 856x540, 텍스트 대비 7.58 이상, 금칙어와 외부 리소스 없음을 코드로 확인하고 A안을 선정','검증기 오류 1건: 대비 계산이 칩 그라데이션까지 배경으로 취급해 A안을 1.11로 판정했고, 같은 실행에서 통과로 잘못 기록했음. 배경만 대상으로 고쳐 8.62로 정정하고 기록에 남김','25초 5씬 모션그래픽을 HTML 애니메이션으로 작성한 뒤 프레임 625장을 고정 캡처해 mp4로 조립. 처음 시도한 실시간 화면 녹화는 시작 시점이 어긋나 폐기','영상 하단에 투자 손실 고지를 마지막 5초 동안 유지하고, 화면 속 금액이 예시임을 표기. 코드로 금칙어와 고지 유무 확인'])+'<div class="note" style="margin-top:6px"><b>한계</b> — 사진 같은 카드 질감, 인쇄 색 재현, 실제 영상 생성 모델의 결과는 확인하지 못했습니다. Bedrock 연결 후 같은 입력으로 A안과 C안을 나란히 비교해야 합니다.</div>'+
'<h2>13. 기획서: 고객 제공 틀 7개 섹션으로 재구성</h2><div class="note">고객이 임의로 넣어 준 초안 틀(요약, 시장 조사, 컨셉과 가치 제안, 재무 타당성, 마케팅, 영상 콘셉트 보드, 일정과 R&amp;R)에 맞춰 기획서 에이전트를 다시 돌렸습니다. 틀의 예시 카드(PERSONA: ONE)가 아니라 우리 파이프라인이 만든 함께쌓기 카드로 채웠습니다.</div>'+tbl(['틀의 항목','채운 방식','비어 있는 것'],[['자사 포트폴리오 분석','공개 카드 34종 대비 새로움 0.82, 최근접 카드 유사도 0.17만 대체 근거로 사용','고객사 라인업·회원·이용 데이터(필요한 입력 목록을 기획서에 명시)'],['수익 모델, BEP','계산식과 필요한 입력 항목만 기재. 월 단위 BEP 시점은 쓰지 않음','고정비, 발급 목표, 획득 비용, 해지율, 충당금률, 수수료율'],['디자인 후보 3안','SVG 3안과 추천안, 성장 그래프로 오인될 위험','인쇄 색 재현'],['영상 콘셉트 보드','5씬 구성과 자막을 실제 영상과 일치시킴','실제 영상 생성 모델 결과'],['일정과 R&amp;R','단계 순서는 틀을 따르고 주차 숫자는 PM 가안으로 표시, 법무·준법팀 추가','고객사 일정']])+'<div class="note" style="margin-top:6px">검증: 섹션 순서, 채택 의향·손익 인용, 허용된 퍼센트, 출처 URL, R&amp;R 누락, BEP 단정 여부를 코드로 확인. 오탐 3종은 검증기를 고쳐 정정했습니다.</div>'+
'<h2>14. 문체 정리(휴머나이저 규칙)와 화면 개편</h2>'+ul(['기획서와 중간 산출물에 규칙 적용: 부정 후 긍정 구문, 줄표, 홍보 어휘, 굵은 라벨 불릿, 한 줄 마무리를 코드로 검사. 중간 산출물에서 3건을 고쳤고 기획서의 내부 변수명 노출 9곳을 업무 용어로 바꿈(의미와 수치는 그대로)','사용자 뷰 추가: 단계 카드, 지금 하는 일 표시줄, 단계별 중간 결과(시그널, 후보 평가, 대화 말풍선, 디자인, 영상)가 호출이 끝나는 순서대로 열림. 개발자 뷰와 한 화면에서 전환','개발자 그래프 개편: 의사결정 마름모(충분성 점검, 게이트, 후보 평가, 후보 선정, 디자인 선정, 기획서 검증), 에이전트 간 이의제기·응답 메시지 선과 횟수, 노드·연결선 클릭 시 해당 대화 표시, 의사결정 기록에서 시점 이동'])+'<div class="note" style="margin-top:6px"><b>확인 불가</b> — 요청에 있던 Taste 스킬은 이 환경에서 찾지 못했습니다. 대신 프론트엔드 디자인·아티팩트 디자인 지침을 적용했습니다. Taste 지침 파일을 받으면 다시 맞춰야 합니다. 사용자 뷰는 기록된 실행의 재생이며 실시간 호출이 아닙니다.</div>'+
'<h2>15. 마케팅 전략 단계 추가와 스킬 연결</h2><div class="note">요구: 브랜딩 에이전트에 실제 카드사가 신규 카드 대고객 마케팅을 짜는 방식의 단계를 넣고 마케팅 스킬을 연결한다. 브랜딩 안의 순서는 이름·채널, 마케팅 전략, 카드 디자인, 홍보 영상입니다.</div>'+tbl(['항목','내용'],[['스킬 연결 방식','마케팅 스킬(campaign-plan)의 SKILL.md 지침(목표·고객·메시지·채널·측정 틀, 주차별 캘린더 규칙)을 입력팩에 실어 에이전트를 호출. 스킬은 실행 코드가 아니라 지침서이고, 카드 상품에 맞게 퍼널을 획득-온보딩-사용-유지로 바꾸고 광고 심의·투자 고지 관점을 더함'],['산출물','4단계 전략, 유형별 대응 4종(일반형, 체리피커, 휴면 위험형, 충성형), 채널 6개, 출시 기준 T-8주~T+12주 캘린더 14행(유보 3행), 준법 확인 7항목, 리스크 3개'],['근거','2026년 자료 4건(캐시백 경쟁 9월, 제휴카드 모집비 구조 10월, 카드사 선택과 집중 10월, 휴면카드 90일 활성화 8월)과 2024년 일반 가이드 1건(틀로만 사용)'],['검증(코드)','스키마, 4단계 완비, 광고 문구 금지어와 수익 암시, 원금 손실 고지, 출처 번호, 준법 확인 표시, 문체. 통과(주의 있음)'],['수치 처리','발급 목표, 활성률, 예산 금액은 근거가 없어 근거 확보 후 설정으로 남김. 30일·60일 측정 시점은 구조 판단'],['처음 실행의 문제','첫 실행에서 2019년·2022년 보도를 근거로 썼음. 발행일을 따지지 않고 검색 결과를 골랐기 때문이며, 2026년 자료로 교체해 마케팅 전략과 기획서 5번 섹션, 부록 F를 다시 작성']])+
'<h2>16. 출처 최신성 점검</h2>'+ul(['트렌드센싱 출처 17건의 발행일을 열어 확인: 14건 확인, 3건은 열람 불가(robots 차단 2건, 기사 아닌 목록 페이지 1건)','18개월을 넘은 출처 8건(2012년 1건, 2018년 2건, 2020년 1건, 2022년 1건, 2023년 3건). 시그널 T1과 T4는 근거가 전부 오래된 자료, T3은 발행일을 확인하지 못함','검증기에 발행일 규칙 추가: 모든 출처가 18개월을 넘으면 경고, 발행일 미확인 출처뿐이면 경고. 입력팩 규칙에도 published와 stale 표시를 요구하도록 추가','경쟁 카드 DB 34종에는 기준일 정보가 없어 경고로 기록. 기준일을 정해 두어야 함','아직 하지 않은 것: 오래된 근거에 기댄 T1, T4를 2026년 자료로 다시 조사하고 그 뒤 단계(소비자 분석 이후)를 다시 도는 일. 비용이 커서 승인 후 진행 권장'])+

S.aws=function(){return "<div class=\"note\">로컬 리허설 구조를 AWS 서비스에 옮겼을 때의 <b>제안 구성</b>입니다. 구현하거나 검증한 것이 아닙니다. 초록 테두리는 중심 부품, 주황 점선은 AWS 밖이거나 근거로 쓰지 못하는 상태입니다. W1에 확인할 것: Bedrock Claude의 웹검색 지원 여부(2025년 5월 글 기준으로만 판단), Nova 웹 그라운딩 가능 모델·리전, Knowledge Bases 필터 연산자와 청크당 속성 한도, 비Claude 모델 목록(제3자 목록 기준).</div><h2>21. Bedrock 기반 에이전트 구성도</h2>\n<figure>\n<svg viewBox=\"0 0 1000 620\" role=\"img\" aria-label=\"Bedrock 기반 에이전트 아키텍처. 브라우저가 Amplify에서 화면을 받고 API Gateway로 실행을 요청하면, Step Functions가 단계 순서와 회수 루프를 관리하며 AgentCore Runtime의 에이전트와 Lambda 검증기를 번갈아 호출한다. 에이전트는 Bedrock 모델과 AgentCore Gateway를 통해 지식 검색과 외부 웹 검색을 쓰고 산출물은 S3, 기록은 DynamoDB에 저장된다.\">\n<defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/></marker></defs>\n<rect class=\"aws\" x=\"156\" y=\"30\" width=\"830\" height=\"490\" rx=\"12\"/>\n<text class=\"lbl\" x=\"172\" y=\"50\">AWS 계정 (서버리스, 외부망 접속)</text>\n<rect class=\"box ext\" x=\"16\" y=\"230\" width=\"100\" height=\"80\" rx=\"8\"/>\n<text class=\"t\" x=\"66.0\" y=\"252\" text-anchor=\"middle\">브라우저</text>\n<text class=\"s\" x=\"66.0\" y=\"270\" text-anchor=\"middle\">사용자 뷰</text>\n<text class=\"s\" x=\"66.0\" y=\"285\" text-anchor=\"middle\">개발자 뷰</text>\n<rect class=\"box\" x=\"180\" y=\"56\" width=\"140\" height=\"64\" rx=\"8\"/>\n<text class=\"t\" x=\"250.0\" y=\"78\" text-anchor=\"middle\">Amplify Hosting</text>\n<text class=\"s\" x=\"250.0\" y=\"96\" text-anchor=\"middle\">HTML · JS · 영상</text>\n<rect class=\"box\" x=\"180\" y=\"160\" width=\"140\" height=\"72\" rx=\"8\"/>\n<text class=\"t\" x=\"250.0\" y=\"182\" text-anchor=\"middle\">API Gateway</text>\n<text class=\"s\" x=\"250.0\" y=\"200\" text-anchor=\"middle\">REST + WebSocket</text>\n<rect class=\"box\" x=\"180\" y=\"272\" width=\"140\" height=\"64\" rx=\"8\"/>\n<text class=\"t\" x=\"250.0\" y=\"294\" text-anchor=\"middle\">Cognito</text>\n<text class=\"s\" x=\"250.0\" y=\"312\" text-anchor=\"middle\">로그인 · 권한</text>\n<rect class=\"box key\" x=\"360\" y=\"160\" width=\"170\" height=\"150\" rx=\"8\"/>\n<text class=\"t\" x=\"445.0\" y=\"182\" text-anchor=\"middle\">Step Functions</text>\n<text class=\"s\" x=\"445.0\" y=\"200\" text-anchor=\"middle\">오케스트레이션 그래프</text>\n<text class=\"s\" x=\"445.0\" y=\"215\" text-anchor=\"middle\">단계 순서 · 회수 루프</text>\n<text class=\"s\" x=\"445.0\" y=\"230\" text-anchor=\"middle\">게이트 · 사람 승인</text>\n<rect class=\"box\" x=\"360\" y=\"350\" width=\"170\" height=\"72\" rx=\"8\"/>\n<text class=\"t\" x=\"445.0\" y=\"372\" text-anchor=\"middle\">Lambda</text>\n<text class=\"s\" x=\"445.0\" y=\"390\" text-anchor=\"middle\">검증기 · 게이트</text>\n<text class=\"s\" x=\"445.0\" y=\"405\" text-anchor=\"middle\">가상 고객 시뮬</text>\n<rect class=\"box\" x=\"360\" y=\"440\" width=\"170\" height=\"64\" rx=\"8\"/>\n<text class=\"t\" x=\"445.0\" y=\"462\" text-anchor=\"middle\">DynamoDB</text>\n<text class=\"s\" x=\"445.0\" y=\"480\" text-anchor=\"middle\">기록 저장소 · 이력</text>\n<rect class=\"box\" x=\"180\" y=\"440\" width=\"140\" height=\"64\" rx=\"8\"/>\n<text class=\"t\" x=\"250.0\" y=\"462\" text-anchor=\"middle\">CloudWatch</text>\n<text class=\"s\" x=\"250.0\" y=\"480\" text-anchor=\"middle\">AgentCore 관측</text>\n<rect class=\"box\" x=\"570\" y=\"44\" width=\"180\" height=\"100\" rx=\"8\"/>\n<text class=\"t\" x=\"660.0\" y=\"66\" text-anchor=\"middle\">Bedrock 모델</text>\n<text class=\"s\" x=\"660.0\" y=\"84\" text-anchor=\"middle\">Claude + 타사 모델</text>\n<text class=\"s\" x=\"660.0\" y=\"99\" text-anchor=\"middle\">단계별 선택</text>\n<text class=\"s\" x=\"660.0\" y=\"114\" text-anchor=\"middle\">Guardrails</text>\n<text class=\"s\" x=\"660.0\" y=\"129\" text-anchor=\"middle\">Nova 웹 그라운딩</text>\n<rect class=\"box key\" x=\"570\" y=\"160\" width=\"180\" height=\"130\" rx=\"8\"/>\n<text class=\"t\" x=\"660.0\" y=\"182\" text-anchor=\"middle\">AgentCore Runtime</text>\n<text class=\"s\" x=\"660.0\" y=\"200\" text-anchor=\"middle\">에이전트 10개</text>\n<text class=\"s\" x=\"660.0\" y=\"215\" text-anchor=\"middle\">세션 격리</text>\n<text class=\"s\" x=\"660.0\" y=\"230\" text-anchor=\"middle\">단계마다 모델 지정</text>\n<rect class=\"box\" x=\"570\" y=\"330\" width=\"180\" height=\"72\" rx=\"8\"/>\n<text class=\"t\" x=\"660.0\" y=\"352\" text-anchor=\"middle\">AgentCore Gateway</text>\n<text class=\"s\" x=\"660.0\" y=\"370\" text-anchor=\"middle\">도구 연결 · 접근 통제</text>\n<rect class=\"box\" x=\"795\" y=\"56\" width=\"185\" height=\"72\" rx=\"8\"/>\n<text class=\"t\" x=\"887.5\" y=\"78\" text-anchor=\"middle\">S3</text>\n<text class=\"s\" x=\"887.5\" y=\"96\" text-anchor=\"middle\">원본 자료 · 산출물 · 영상</text>\n<rect class=\"box\" x=\"795\" y=\"160\" width=\"185\" height=\"88\" rx=\"8\"/>\n<text class=\"t\" x=\"887.5\" y=\"182\" text-anchor=\"middle\">Knowledge Bases</text>\n<text class=\"s\" x=\"887.5\" y=\"200\" text-anchor=\"middle\">+ OpenSearch Serverless</text>\n<text class=\"s\" x=\"887.5\" y=\"215\" text-anchor=\"middle\">출처 검색 · 발행일 필터</text>\n<rect class=\"box ext\" x=\"795\" y=\"540\" width=\"185\" height=\"56\" rx=\"8\"/>\n<text class=\"t\" x=\"887.5\" y=\"562\" text-anchor=\"middle\">외부 검색 API</text>\n<text class=\"s\" x=\"887.5\" y=\"580\" text-anchor=\"middle\">Tavily 등 (외부 서비스)</text>\n<polyline class=\"a\" points=\"116,270 140,270\"/><polyline class=\"a\" points=\"140,88 140,304\"/>\n<polyline class=\"a\" points=\"140,88 180,88\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"160.0\" cy=\"88.0\" r=\"9\"/><text class=\"bn\" x=\"160.0\" y=\"92.0\" text-anchor=\"middle\">1</text>\n<polyline class=\"a\" points=\"140,196 180,196\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"160.0\" cy=\"196.0\" r=\"9\"/><text class=\"bn\" x=\"160.0\" y=\"200.0\" text-anchor=\"middle\">3</text>\n<polyline class=\"a\" points=\"140,304 180,304\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"160.0\" cy=\"304.0\" r=\"9\"/><text class=\"bn\" x=\"160.0\" y=\"308.0\" text-anchor=\"middle\">2</text>\n<polyline class=\"a\" points=\"320,196 360,196\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"340.0\" cy=\"196.0\" r=\"9\"/><text class=\"bn\" x=\"340.0\" y=\"200.0\" text-anchor=\"middle\">4</text>\n<polyline class=\"a\" points=\"530,225 570,225\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"550.0\" cy=\"225.0\" r=\"9\"/><text class=\"bn\" x=\"550.0\" y=\"229.0\" text-anchor=\"middle\">5</text>\n<polyline class=\"a\" points=\"445,310 445,350\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"432\" cy=\"330\" r=\"9\"/><text class=\"bn\" x=\"432\" y=\"334\" text-anchor=\"middle\">6</text>\n<polyline class=\"a dash\" points=\"475,350 475,310\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"488\" cy=\"330\" r=\"9\"/><text class=\"bn\" x=\"488\" y=\"334\" text-anchor=\"middle\">7</text>\n<polyline class=\"a\" points=\"660,160 660,144\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"688\" cy=\"152\" r=\"9\"/><text class=\"bn\" x=\"688\" y=\"156\" text-anchor=\"middle\">8</text>\n<polyline class=\"a\" points=\"660,290 660,330\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"660.0\" cy=\"310.0\" r=\"9\"/><text class=\"bn\" x=\"660.0\" y=\"314.0\" text-anchor=\"middle\">9</text>\n<polyline class=\"a\" points=\"750,366 772,366 772,214 795,214\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"772\" cy=\"290\" r=\"9\"/><text class=\"bn\" x=\"772\" y=\"294\" text-anchor=\"middle\">10</text>\n<polyline class=\"a\" points=\"660,402 660,568 795,568\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"660\" cy=\"480\" r=\"9\"/><text class=\"bn\" x=\"660\" y=\"484\" text-anchor=\"middle\">11</text>\n<polyline class=\"a\" points=\"750,215 765,215 765,92 795,92\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"765\" cy=\"150\" r=\"9\"/><text class=\"bn\" x=\"765\" y=\"154\" text-anchor=\"middle\">12</text>\n<polyline class=\"a\" points=\"887,128 887,160\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"887.0\" cy=\"144.0\" r=\"9\"/><text class=\"bn\" x=\"887.0\" y=\"148.0\" text-anchor=\"middle\">13</text>\n<polyline class=\"a\" points=\"445,422 445,440\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"457\" cy=\"431\" r=\"9\"/><text class=\"bn\" x=\"457\" y=\"435\" text-anchor=\"middle\">14</text>\n<polyline class=\"a\" points=\"360,260 345,260 345,472 360,472\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"345\" cy=\"380\" r=\"9\"/><text class=\"bn\" x=\"345\" y=\"384\" text-anchor=\"middle\">14</text>\n</svg>\n<figcaption>Step Functions가 단계 순서와 반려 시 회수를 쥐고, 단계마다 AgentCore Runtime의 에이전트와 Lambda 검증기를 번갈아 부른다. 도구는 Gateway를 거치고, 모델은 Claude 외 선택지도 열려 있다.</figcaption>\n</figure>\n<h3>화살표 번호</h3>\n<ol><li><span class=\"n\">1</span><div><b>화면 받기</b> 브라우저가 Amplify에서 HTML, JS, 영상 파일을 받는다. 모션은 HTML로 그대로 재생하고 mp4는 S3와 CDN에서 불러 온다.</div></li><li><span class=\"n\">2</span><div><b>로그인</b> Cognito가 사용자와 부서·역할을 확인한다.</div></li><li><span class=\"n\">3</span><div><b>실행 요청</b> REST로 요청을 보내고, 같은 화면이 WebSocket으로 단계별 진행 상황을 받는다. 현재 화면의 중간 호출 보기가 이 연결로 동작한다.</div></li><li><span class=\"n\">4</span><div><b>실행 시작</b> API Gateway가 Step Functions 실행을 시작한다.</div></li><li><span class=\"n\">5</span><div><b>에이전트 호출</b> 단계마다 해당 에이전트를 부른다. 어떤 모델을 쓸지는 단계 정의에 적는다.</div></li><li><span class=\"n\">6</span><div><b>검증 요청</b> 에이전트 결과를 Lambda의 코드 검증기와 게이트(실현가능성, 금칙어, 출처 최신성)에 보낸다.</div></li><li><span class=\"n\">7</span><div><b>통과·반려</b> 반려이면 Step Functions가 지정된 이전 단계로 되돌린다. 회수 횟수 상한도 여기서 센다.</div></li><li><span class=\"n\">8</span><div><b>모델 호출</b> AgentCore Runtime의 에이전트가 Bedrock 모델을 부른다. Claude 외에 Nova, Llama, Mistral 등도 같은 호출 방식으로 단계마다 고를 수 있다. Nova는 nova_grounding 도구로 검색과 출처 인용까지 한 번에 한다(US 리전 한정, 별도 요금). Guardrails가 광고 문구를 1차로 거른다.</div></li><li><span class=\"n\">9</span><div><b>도구 호출</b> 에이전트는 AgentCore Gateway를 통해서만 도구를 쓴다. 어떤 에이전트가 어떤 도구를 쓸 수 있는지 한곳에서 통제한다.</div></li><li><span class=\"n\">10</span><div><b>출처 검색</b> Knowledge Bases가 OpenSearch에서 자료를 찾는다. 발행일과 신뢰도를 메타데이터로 걸러서 오래된 출처를 막는다.</div></li><li><span class=\"n\">11</span><div><b>웹 검색</b> Nova 웹 그라운딩을 못 쓰는 환경(서울 리전 고정 등)이거나 검색 결과를 직접 통제해야 할 때, Tavily 같은 외부 검색 API를 Gateway 뒤에 도구로 둔다. 키 관리와 호출 기록을 이곳에서 한다.</div></li><li><span class=\"n\">12</span><div><b>산출물 저장</b> 에이전트 결과, 기획서, 영상 파일을 S3에 쓴다.</div></li><li><span class=\"n\">13</span><div><b>자료 적재</b> 수집한 공개 자료를 S3에 올리면 Knowledge Bases가 색인한다.</div></li><li><span class=\"n\">14</span><div><b>기록 저장</b> 실행 이력, 회수 이벤트, 결정 기록(현재의 Ledger와 trace)을 DynamoDB에 남긴다.</div></li></ol>\n<h3>이 그림에서 정해야 할 것</h3>\n<div class=\"adec\">\n<div><b>오케스트레이션을 어디에 둘까</b>이 구성은 Step Functions에 둡니다. 회수 상한, 게이트, 사람 승인 대기를 코드 규칙으로 고정할 수 있어 지금의 하네스 철학과 맞습니다. 대안은 에이전트 루프(AgentCore)에 맡기는 것인데, 자율성은 커지지만 결과 재현이 어려워집니다.</div>\n<div><b>웹 검색의 위치</b>두 길이 있습니다. Nova 웹 그라운딩은 Bedrock 안에서 검색과 인용을 함께 처리하지만 US 리전에서만 되고 추가 요금이 붙습니다. Gateway 뒤의 외부 검색 API는 리전 제약이 없고 호출 기록을 직접 통제합니다. 둘을 다 붙여 교차 확인하는 안이 가장 안전하며, 출처 정확도가 모델마다 갈렸던 영역이라 가장 먼저 시험합니다.</div>\n<div><b>두 저장소의 역할</b>DynamoDB는 실행 기록과 이력, Knowledge Bases는 수집 자료 검색용입니다. 둘을 섞지 않는 것이 핵심이며, 자료의 발행일 메타데이터를 필수로 받는 규칙이 오래된 출처 문제를 막습니다.</div>\n<div><b>모델 내부 지식의 위치</b>배경 설명과 검색어 만들기에는 쓰지만 근거로는 쓰지 않습니다. 학습 시점 이후를 모르고 출처 URL이 없기 때문입니다. 검증기에 \"출처 없는 문장은 모델 배경지식이라고 표시한다\"는 규칙을 두는 안을 제안합니다.</div>\n</div>\n<h2>22. 시장 조사 에이전트 한 개의 상세 구조</h2><div class=\"note\">AWS 위에서 시장 조사 에이전트 하나를 만든다고 보고, 자료가 들어와 정리되고 검색되는 길과 에이전트가 질문 한 건을 처리하는 길을 함께 그렸습니다.</div>\n<h3>전체 구조</h3>\n<figure>\n<svg viewBox=\"0 0 1000 580\" role=\"img\" aria-label=\"시장 조사 에이전트 구조. 위 줄은 수집원에서 S3 raw, 정제 Lambda, S3 curated를 거쳐 Knowledge Bases에 색인되는 데이터 파이프라인이고, 발행일이 없는 문서는 격리 큐로 간다. 아래 줄은 요청을 질문으로 나누고 검색하고 충분성을 검사하며 부족하면 재검색하고 종합 후 검증기를 통과하는 에이전트 루프다.\">\n<defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/></marker></defs>\n<text class=\"lbl\" x=\"16\" y=\"48\">② 수집 (일정마다)</text><line class=\"gl\" x1=\"16\" y1=\"54\" x2=\"496\" y2=\"54\"/>\n<text class=\"lbl\" x=\"526\" y=\"48\"> le\">최신성 · 수치</text>\n<polyline class=\"a\" points=\"166,392 196,392\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"181.0\" cy=\"392.0\" r=\"9\"/><text class=\"bn\" x=\"181.0\" y=\"396.0\" text-anchor=\"middle\">8</text>\n<polyline class=\"a\" points=\"336,392 366,392\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"351.0\" cy=\"392.0\" r=\"9\"/><text class=\"bn\" x=\"351.0\" y=\"396.0\" text-anchor=\"middle\">9</text>\n<polyline class=\"a\" points=\"496,392 526,392\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"511.0\" cy=\"392.0\" r=\"9\"/><text class=\"bn\" x=\"511.0\" y=\"396.0\" text-anchor=\"middle\">10</text>\n<polyline class=\"a\" points=\"676,392 706,392\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"691.0\" cy=\"392.0\" r=\"9\"/><text class=\"bn\" x=\"691.0\" y=\"396.0\" text-anchor=\"middle\">11</text>\n<polyline class=\"a\" points=\"836,392 866,392\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"851.0\" cy=\"392.0\" r=\"9\"/><text class=\"bn\" x=\"851.0\" y=\"396.0\" text-anchor=\"middle\">12</text>\n<polyline class=\"a dash\" points=\"601,350 601,326 462,326 462,350\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"531\" cy=\"326\" r=\"9\"/><text class=\"bn\" x=\"531\" y=\"330\" text-anchor=\"middle\">13</text>\n<polyline class=\"a\" points=\"926,154 926,290 400,290 400,350\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"700\" cy=\"290\" r=\"9\"/><text class=\"bn\" x=\"700\" y=\"294\" text-anchor=\"middle\">14</text>\n<polyline class=\"a dash\" points=\"926,434 926,470 806,470 806,434\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"866\" cy=\"470\" r=\"9\"/><text class=\"bn\" x=\"866\" y=\"474\" text-anchor=\"middle\">15</text>\n<rect class=\"box ext\" x=\"366\" y=\"490\" width=\"130\" height=\"70\" rx=\"8\"/>\n<text class=\"t\" x=\"431.0\" y=\"512\" text-anchor=\"middle\">외부 검색</text>\n<text class=\"s\" x=\"431.0\" y=\"530\" text-anchor=\"middle\">Nova 그라운딩</text>\n<text class=\"s\" x=\"431.0\" y=\"545\" text-anchor=\"middle\">Tavily</text>\n<polyline class=\"a\" points=\"431,434 431,490\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"431.0\" cy=\"462.0\" r=\"9\"/><text class=\"bn\" x=\"431.0\" y=\"466.0\" text-anchor=\"middle\">16</text>\n<polyline class=\"a\" points=\"740,490 740,434\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"740\" cy=\"462\" r=\"9\"/><text class=\"bn\" x=\"740\" y=\"466\" text-anchor=\"middle\">17</text>\n<rect class=\"box key\" x=\"706\" y=\"490\" width=\"280\" height=\"70\" rx=\"8\"/>\n<text class=\"t\" x=\"846.0\" y=\"512\" text-anchor=\"middle\">Bedrock 모델 배치</text>\n<text class=\"s\" x=\"846.0\" y=\"530\" text-anchor=\"middle\">계획·종합 Sonnet · 정리 Haiku</text>\n<text class=\"s\" x=\"846.0\" y=\"545\" text-anchor=\"middle\">검색 전담 Nova (선택)</text>\n<rect class=\"box\" x=\"16\" y=\"490\" width=\"150\" height=\"70\" rx=\"8\"/>\n<text class=\"t\" x=\"91.0\" y=\"512\" text-anchor=\"middle\">DynamoDB</text>\n<text class=\"s\" x=\"91.0\" y=\"530\" text-anchor=\"middle\">질문 · 검색 · 판단 기록</text>\n<polyline class=\"a\" points=\"91,490 91,434\" marker-end=\"url(#ar)\"/>\n<circle class=\"bd\" cx=\"91.0\" cy=\"462.0\" r=\"9\"/><text class=\"bn\" x=\"91.0\" y=\"466.0\" text-anchor=\"middle\">18</text>\n</svg>\n<figcaption>위 줄은 자료가 들어와 정리되는 파이프라인이고 아래 줄은 질문 한 건을 처리하는 루프다. 두 줄은 Knowledge Bases에서 만나며, 발행일이 없는 자료는 파이프라인에서 걸러진다.</figcaption>\n</figure>\n<ol><li><span class=\"n\">1</span><div><b>수집원</b> 검색 API(Tavily, Nova 그라운딩), RSS, 담당자의 수동 업로드에서 들어온다.</div></li><li><span class=\"n\">2</span><div><b>원문 저장</b> 수집 Lambda가 일정마다 돌고, 이미 받은 URL은 건너뛴 뒤 S3 raw에 쓴다.</div></li><li><span class=\"n\">3</span><div><b>원문 보관</b> 받은 그대로 S3 raw에 쌓는다. 정제 규칙을 바꿔도 다시 처리할 수 있다.</div></li><li><span class=\"n\">4</span><div><b>정제 요청</b> 새 원문이 S3 raw에 오면 정제 Lambda가 호출된다. 정제 결과는 아래 저장 단계로 간다.</div></li><li><span class=\"n\">5</span><div><b>저장과 색인</b> 정제 결과(본문과 .metadata.json)를 S3 curated에 쓰고, Knowledge Bases가 동기화하며 청크로 나눠 임베딩해 OpenSearch에 넣는다.</div></li><li><span class=\"n\">6</span><div><b>격리</b> 발행일을 못 찾았거나 출처 유형이 불명이면 격리 큐로 보낸다. 근거로 쓰지 못한다.</div></li><li><span class=\"n\">7</span><div><b>복귀</b> 담당자가 발행일과 유형을 채우면 정제 단계로 돌아간다.</div></li><li><span class=\"n\">8</span><div><b>요청 전달</b> Step Functions가 질문과 타깃을 에이전트에 넘긴다.</div></li><li><span class=\"n\">9</span><div><b>질문 분해</b> 하위 질문 3~5개와 검색어를 만든다. 이 단계에서는 모델의 배경지식을 써도 된다.</div></li><li><span class=\"n\">10</span><div><b>검색 호출</b> 도구 두 개를 쓴다. 저장된 자료는 kb_search, 최신 자료는 web_search.</div></li><li><span class=\"n\">11</span><div><b>충분하면 종합</b> 주장 문장마다 출처 id를 붙이고, 출처가 없는 문장에는 모델 배경지식 표시를 단다.</div></li><li><span class=\"n\">12</span><div><b>검증</b> 스키마, 출처 URL 존재, 발행일 최신성, 입력에 없는 수치를 코드로 확인한다.</div></li><li><span class=\"n\">13</span><div><b>부족하면 재검색</b> 충분성 검사는 출처 수, 발행일, 신뢰도, 비어 있는 하위 질문을 코드 규칙으로 센다. 부족하면 하위 질문을 바꿔 다시 검색하고, 상한 3회에서 멈춰 부족한 부분을 결과에 적는다.</div></li><li><span class=\"n\">14</span><div><b>저장된 자료 조회</b> kb_search가 메타데이터 필터(발행일, 신뢰도, 상태)를 걸어 OpenSearch에서 찾는다.</div></li><li><span class=\"n\">15</span><div><b>반려 시 수정</b> 검증을 못 넘으면 사유와 함께 종합 단계로 돌려보낸다.</div></li><li><span class=\"n\">16</span><div><b>웹 검색</b> Gateway를 거쳐 외부 검색을 호출한다. 결과는 바로 근거로 쓰지 않고, 수집 파이프라인으로도 보내 저장·검증할 수 있다.</div></li><li><span class=\"n\">17</span><div><b>모델 호출</b> 단계마다 정해 둔 모델을 쓴다. 아래 박스가 기본 배치다.</div></li><li><span class=\"n\">18</span><div><b>기록</b> 질문, 검색어, 선택한 출처, 충분성 판단을 DynamoDB에 남긴다.</div></li></ol>\n<h3>만들어 가는 순서</h3>\n<p class=\"note\">앞 단계가 끝나야 다음 단계가 의미를 가집니다. 특히 3단계(메타데이터)가 부실하면 4단계 이후의 검색 품질이 모두 흔들립니다.</p>\n<div class=\"tw\"><table><thead><tr><th>단계</th><th>하는 일</th><th>연결하는 것</th><th>산출물</th><th>끝났다고 볼 기준</th></tr></thead><tbody><tr><td>0 범위와 규칙</td><td>역할, 입력(질문, 타깃), 출력 스키마, 금지 규칙(출처 없는 수치 금지)을 한 장으로 확정</td><td>시스템 프롬프트 초안, 스킬(SKILL.md)</td><td>에이전트 명세서 1장</td><td>입력 5개와 출력 스키마 검토를 상품개발부와 마침</td></tr><tr><td>1 자료원 정의</td><td>어디까지를 근거로 쓸지 유형별로 정한다. 공시·규제, 정부 통계, 언론, 리서치, 경쟁사 상품 페이지, 블로그</td><td>허용 도메인 목록, 유형별 기본 신뢰도</td><td>자료원 표(유형, 신뢰도, 사용 조건)</td><td>유형 6개 이상, 신뢰도 기준 합의, 블로그는 보조 근거로만</td></tr><tr><td>2 수집 연결</td><td>검색 API와 RSS, 수동 업로드를 일정에 따라 받아 원문을 쌓는다</td><td>EventBridge, Lambda, S3 raw, Secrets Manager(API 키)</td><td>수집 Lambda, 원문 버킷</td><td>같은 URL 중복 0, 수집 실패는 재시도 후 기록</td></tr><tr><td>3 정제와 메타데이터</td><td>본문을 뽑고 발행일, 유형, 주제, 신뢰도를 붙인다. 못 붙이면 격리</td><td>Lambda, 분류용 Haiku, SQS 격리 큐</td><td>정제 Lambda, 메타데이터 규칙표</td><td>필수 필드 누락 문서는 색인 0건, 격리 사유 기록</td></tr><tr><td>4 지식 저장소</td><td>정제 문서를 청크로 나눠 색인하고 메타데이터 필터로 찾게 한다</td><td>Knowledge Bases, OpenSearch Serverless, 임베딩 모델</td><td>색인 구성, 동기화 일정</td><td>골든 질문 30개로 재현율 확인, 오래된 출처가 상위에 안 나옴</td></tr><tr><td>5 에이전트 루프</td><td>질문 분해, 검색, 충분성 검사, 종합을 한 루프로 묶는다</td><td>AgentCore Runtime, Gateway(도구), Bedrock 모델</td><td>에이전트 코드와 도구 정의</td><td>재검색 상한 3회, 도구는 Gateway를 통해서만 호출</td></tr><tr><td>6 검증기</td><td>결과를 코드로 확인한다. 스키마, URL 존재, 발행일 18개월, 입력에 없는 수치, 배경지식 표시</td><td>Lambda(검증기), Step Functions 회수 경로</td><td>검증 Lambda, 반려 사유 목록</td><td>검증기 단위 테스트 통과, 반려 시 사유가 에이전트에 전달됨</td></tr><tr><td>7 기록과 관측</td><td>질문, 검색어, 선택 출처, 판단, 토큰과 지연을 남긴다</td><td>DynamoDB, CloudWatch, AgentCore 관측</td><td>실행 이력 테이블, 대시보드</td><td>실행 하나를 기록만으로 재현해 볼 수 있음</td></tr><tr><td>8 평가와 운영</td><td>골든 질문 세트로 모델과 프롬프트 변경의 효과를 매번 비교한다</td><td>평가 세트, 모델 비교 하네스(이번 실험 방식)</td><td>회귀 테스트, 갱신 주기, 검수 큐</td><td>변경마다 점수 비교, 자료 갱신 주기와 담당자 지정</td></tr></tbody></table></div>\n<h3>메타데이터 설계</h3>\n<p class=\"note\">S3의 문서마다 <code>문서이름.metadata.json</code> 사이드카 파일을 둡니다. 지원 타입은 문자열, 숫자, 불리언, 문자열 목록이고, CSV로 넣으면 값이 모두 문자열로 저장됩니다. 그래서 범위로 걸러야 하는 발행 연월과 신뢰도는 JSON 사이드카의 숫자형으로 둡니다. 청크당 속성 개수에는 한도가 있어 위 12개가 한도 안인지 W1에 확인해야 합니다.</p>\n<div class=\"tw\"><table><thead><tr><th>필드</th><th>타입</th><th>값</th><th>쓰임</th></tr></thead><tbody><tr><td>doc_id</td><td>STRING</td><td>본문 해시 기반 ID</td><td>중복 제거와 근거 인용의 기준</td></tr><tr><td>url</td><td>STRING</td><td>원문 주소</td><td>없으면 격리</td></tr><tr><td>title</td><td>STRING</td><td>제목</td><td></td></tr><tr><td>publisher</td><td>STRING</td><td>발행 기관 또는 매체</td><td>출처 유형 판정에 사용</td></tr><tr><td>source_type</td><td>STRING</td><td>공시·규제 / 정부통계 / 언론 / 리서치 / 경쟁사상품 / 블로그</td><td>유형마다 기본 신뢰도</td></tr><tr><td>reliability</td><td>NUMBER</td><td>0~1 신뢰도</td><td>기본값은 유형에서, 담당자가 조정 가능</td></tr><tr><td>published</td><td>NUMBER</td><td>발행 연월(예: 202610)</td><td>범위 필터용으로 숫자로 저장. 확인 못 하면 격리</td></tr><tr><td>collected</td><td>NUMBER</td><td>수집 연월일</td><td>수집 시점 추적</td></tr><tr><td>topics</td><td>STRING_LIST</td><td>주제 태그(현재 택소노미: invest, benefit, digital, group, promo, regulation 등)</td><td>질문별 검색 범위 좁히기</td></tr><tr><td>language</td><td>STRING</td><td>ko, en 등</td><td></td></tr><tr><td>status</td><td>STRING</td><td>active / quarantine / retired</td><td>검색은 active만</td></tr><tr><td>usage</td><td>STRING</td><td>인용만 / 요약 가능 / 사내 한정</td><td>저작권·이용 조건 관리</td></tr></tbody></table></div>\n<p class=\"note\">질문할 때 걸 기본 필터는 <code>status = active</code>, <code>published</code>가 오늘 기준 18개월 이내, <code>reliability</code> 0.5 이상입니다. 문서가 오래돼도 메타데이터는 그대로이므로, 만료 처리는 매일 도는 점검 작업이 status를 retired로 바꾸고 다시 동기화하는 방식으로 합니다. 비교 연산자 지원 범위는 문서에서 확인하지 못해서 W1에 확인이 필요합니다.</p>\n<h3>문서의 상태 변화</h3>\n<figure>\n<svg viewBox=\"0 0 1000 240\" role=\"img\" aria-label=\"문서 상태 전이. 수집됨에서 정제됨으로 가고, 메타데이터가 부족하면 격리되었다가 수동 확인 후 복귀하며, 검증을 통과하면 색인됨이 되고, 발행 18개월이 지나면 만료된다.\">\n<defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"currentColor\"/></marker></defs>\n<rect class=\"box\" x=\"20\" y=\"50\" width=\"160\" height=\"60\" rx=\"8\"/>\n<text class=\"t\" x=\"100.0\" y=\"72\" text-anchor=\"middle\">수집됨</text>\n<text class=\"s\" x=\"100.0\" y=\"90\" text-anchor=\"middle\">S3 raw</text>\n<rect class=\"box key\" x=\"270\" y=\"50\" width=\"160\" height=\"60\" rx=\"8\"/>\n<text class=\"t\" x=\"350.0\" y=\"72\" text-anchor=\"middle\">정제됨</text>\n<text class=\"s\" x=\"350.0\" y=\"90\" text-anchor=\"middle\">S3 curated · 메타데이터 완비</text>\n<rect class=\"box key\" x=\"520\" y=\"50\" width=\"160\" height=\"60\" rx=\"8\"/>\n<text class=\"t\" x=\"600.0\" y=\"72\" text-anchor=\"middle\">색인됨</text>\n<text class=\"s\" x=\"600.0\" y=\"90\" text-anchor=\"middle\">검색 대상 (active)</text>\n<rect class=\"box ext\" x=\"770\" y=\"50\" width=\"160\" height=\"60\" rx=\"8\"/>\n<text class=\"t\" x=\"850.0\" y=\"72\" text-anchor=\"middle\">만료</text>\n<text class=\"s\" x=\"850.0\" y=\"90\" text-anchor=\"middle\">발행 18개월 초과 (retired)</text>\n<rect class=\"box ext\" x=\"270\" y=\"160\" width=\"160\" height=\"60\" rx=\"8\"/>\n<text class=\"t\" x=\"350.0\" y=\"182\" text-anchor=\"middle\">격리</text>\n<text class=\"s\" x=\"350.0\" y=\"200\" text-anchor=\"middle\">발행일 없음 · 근거 불명</text>\n<polyline class=\"a\" points=\"180,80 270,80\" marker-end=\"url(#ar)\"/>\n<text class=\"s\" x=\"225\" y=\"70\" text-anchor=\"middle\">정제 Lambda</text>\n<polyline class=\"a\" points=\"430,80 520,80\" marker-end=\"url(#ar)\"/>\n<text class=\"s\" x=\"475\" y=\"70\" text-anchor=\"middle\">검증 통과 · 동기화</text>\n<polyline class=\"a\" points=\"680,80 770,80\" marker-end=\"url(#ar)\"/>\n<text class=\"s\" x=\"725\" y=\"70\" text-anchor=\"middle\">일 1회 점검</text>\n<polyline class=\"a dash\" points=\"330,110 330,160\" marker-end=\"url(#ar)\"/>\n<text class=\"s\" x=\"300\" y=\"138\" text-anchor=\"middle\">규칙 위반</text>\n<polyline class=\"a dash\" points=\"390,160 390,110\" marker-end=\"url(#ar)\"/>\n<text class=\"s\" x=\"432\" y=\"138\" text-anchor=\"middle\">수동 확인</text>\n</svg>\n<figcaption>문서는 정제 단계에서 메타데이터가 완비되면 색인되고, 규칙을 어기면 격리되며, 발행 18개월이 지나면 검색 대상에서 빠진다.</figcaption>\n</figure>\n<h3>이 에이전트에서 정해야 할 것</h3>\n<div class=\"adec\">\n<div><b>검색을 둘로 나눈 이유</b>저장된 자료(kb_search)는 출처와 날짜를 우리가 통제하고, 웹 검색은 최신성을 얻습니다. 웹 검색 결과는 바로 근거로 쓰지 않고 검증을 거쳐 저장할 수 있게 둡니다.</div>\n<div><b>모델 배치</b>이번 실험 결과로는 계획과 종합에 Sonnet, 분류·정제에 Haiku가 기본입니다. 검색 전담으로 Nova 웹 그라운딩을 붙이는 안은 US 리전 제약 때문에 W1에 가능 여부를 확인합니다.</div>\n<div><b>모델 배경지식 규칙</b>질문 분해와 검색어 생성에는 씁니다. 결과 문장에 쓰려면 출처 id가 있어야 하고, 없으면 모델 배경지식이라고 표시합니다. 이 표시가 없는 문장을 검증기가 반려합니다.</div>\n<div><b>사람이 개입하는 곳</b>격리 큐의 수동 확인, 자료원 신뢰도 기준 합의, 골든 질문 세트 작성 세 곳입니다. 이 셋은 코드로 대체하지 않는 편이 안전합니다.</div>\n</div>\n"};
S.tools=function(){return '<h2>이번 리허설에서 사용한 것</h2>'+tbl(['도구','용도','결과'],[['하위 에이전트 3개(웹 검색·문서 열람)','공개 통계 수집, 시판 카드 34종 수집, 가계 소비·카드 이용 통계 추가 수집','통계 14건·카드 34종을 URL·원문 문장과 함께 기록(열어보지 못한 원문·검색요약만 있는 값은 제외 또는 표기)'],['Node 스크립트(분류체계·골든셋 평가·보정·PoC 비교)','분류체계 v1~v5 지표, 골든셋 러너, 공개 통계 보정, 고정 토론 대 블랙보드 비교','taxonomy.js, eval/run_eval.js, calib/calibrate.js, poc/compare_collab.js (모두 재실행 가능)'],['웹 검색','국내 카드 시장 트렌드·경쟁사 공개 자료 수집','출처 9건을 근거 시그널과 경쟁 유형에 반영'],['아티팩트 설계 가이드','UI/문서 페이지 설계 규칙 적용','라이트/다크 테마, 반응형, 토큰 기반 스타일'],['로컬 Node 실행','엔진 자동 테스트, 빌드, 렌더러 점검','결함 3건 수정'],['작업 목록','진행 상태 관리','5개 작업 완료']])+
'<h2>실제 프로젝트에서 검토할 스킬·도구(미적용 후보)</h2>'+tbl(['후보','쓰임','판단'],[['심층 조사 스킬(하위 에이전트 병렬 조사)','시장조사 에이전트 고도화, 출처 수집 자동화','W4~W5 PoC 후보'],['문서 생성 스킬(DOCX/PPT/PDF)','기획서·최종 보고서·중간보고 자료 내보내기','W9 내보내기 기능에 활용'],['브라우저 자동화(녹화 기능 포함)','데모 영상용 화면 녹화·시연 자동화','W2·W7 영상 제작 지원'],['프론트엔드 디자인 스킬','UI 품질 가이드','UI 개편 시 적용'],['MCP/커넥터(사내 문서·지식 저장소)','고객 메타데이터·사내 자료 연계','고객 정책 확인 후 결정'],['AWS 문서 조회용 도구','Bedrock 구성 검증','SA 업무 보조, 도입 전 신뢰 출처 확인']])+'<p class="note">후보는 이번 세션에서 검증하지 않았습니다. 도입 시 PoC 결과와 함께 이 표를 갱신합니다.</p>'};

var TABS=[['overview','개요'],['team','팀·역할'],['plan','12주 계획'],['decisions','의사결정'],['arch','구조도'],['tech','기술 설계'],['quality','품질 레버'],['edge','엣지 기획'],['dev2','2차 개발 결과'],['aws','AWS 구조'],['agents','에이전트·기능'],['client','고객 접점'],['ops','운영·Bedrock'],['demo','데모 대본'],['log','리허설 로그'],['tools','스킬·도구 기록']];
var secs=document.getElementById('secs'),tabs=document.getElementById('tabs');
TABS.forEach(function(t){var s=document.createElement('section');s.id='s-'+t[0];s.innerHTML=S[t[0]]();secs.appendChild(s)});
function show(k){TABS.forEach(function(t){document.getElementById('s-'+t[0]).className=t[0]===k?'on':''});tabs.querySelectorAll('button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.k===k)});try{window.scrollTo(0,0)}catch(e){}}
tabs.innerHTML=TABS.map(function(t,i){return '<button type="button" role="tab" data-k="'+t[0]+'" aria-selected="'+(i===0)+'">'+t[1]+'</button>'}).join('');
