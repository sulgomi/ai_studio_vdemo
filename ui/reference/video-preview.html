<style>
/* layout: centered column — format tabs, the live stage, transport controls. Single dark look (video player). */
:root { color-scheme: dark; --page: #0b0b0d; --panel: #18181c; --line: #2c2c33; --text: #ececea; --muted: #9a9aa2; --accent: #C8FF3D;
  --sp-panel: #18181c; --sp-line: #2c2c33; --sp-accent: #C8FF3D; }
body { margin: 0; background: var(--page); color: var(--text); font-family: 'IBM Plex Sans KR', system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; text-wrap: balance; }
.tabs { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.tabs button { font: 600 14px inherit; font-family: inherit; min-height: 44px; padding: 0 14px; border: 0; background: var(--panel); color: var(--text); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: #0e0e10; }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.meta { margin: 0; font: 12px 'Space Mono', monospace; color: var(--muted); letter-spacing: .06em; }
.note { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); max-width: 70ch; }
/* boards.css — styles for board-renderer.js. All classes are prefixed pb- to avoid collisions. */

.pb-stage { display: flex; flex-direction: column; gap: 24px; padding: 8px 0 40px; }
.pb-row { display: flex; flex-direction: column; gap: 24px; }
.pb-rowtitle { margin: 24px 0 0; font: 700 22px/1.2 system-ui, sans-serif; color: inherit; }
.pb-frame { margin: 0; overflow: hidden; position: relative; }
.pb-frame > figcaption { font: 600 13px/20px system-ui, sans-serif; opacity: .7; margin-bottom: 8px; }
.pb-fit { position: relative; box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 12px 32px -18px rgba(0,0,0,.35); border-radius: 6px; overflow: hidden; }
.pb-board { position: relative; width: 100%; height: 100%; box-sizing: border-box; overflow: hidden; color: var(--ink); }
.pb-board * { box-sizing: border-box; }
.pb-eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }

/* ---------- card ---------- */
.pb-cardwrap { position: relative; display: inline-block; }
.pb-card { position: relative; overflow: hidden; border-radius: calc(var(--u) * 20); isolation: isolate;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.75), inset 0 -1px 0 rgba(0,0,0,.06), 0 40px 60px -30px rgba(40,25,80,.45), 0 16px 28px -14px rgba(40,25,80,.25); }
.pb-card.is-dark { box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 40px 60px -30px rgba(0,0,0,.8); }
.pb-card--clear { backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3);
  border: 1px solid rgba(255,255,255,.78); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 40px 60px -30px rgba(40,20,80,.4); }
.pb-edge { position: absolute; inset: 0; border-radius: calc(var(--u) * 20); transform: translate(calc(var(--u)*6), calc(var(--u)*4)); }
.pb-layer { position: absolute; inset: 0; pointer-events: none; }
.pb-noise { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pb-coil { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pb-chip { position: absolute; left: calc(var(--u)*26); top: calc(var(--u)*30); width: calc(var(--u)*48); height: calc(var(--u)*38);
  border-radius: calc(var(--u)*8); background: var(--chip); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18);
  background-image: linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)), linear-gradient(rgba(0,0,0,.22),rgba(0,0,0,.22)), linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.22)), linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,.22)), var(--chip);
  background-size: 100% 1px, 100% 1px, 1px 100%, 1px 100%, 100% 100%;
  background-position: 0 32%, 0 66%, 33% 0, 66% 0, 0 0; background-repeat: no-repeat; }
.pb-nfc-wrap { position: absolute; right: calc(var(--u)*26); top: calc(var(--u)*36); width: calc(var(--u)*26); height: calc(var(--u)*26); }
.pb-nfc { width: 100%; height: 100%; display: block; }
.pb-logo { position: absolute; left: calc(var(--u)*22); bottom: calc(var(--u)*24); color: var(--logo); font-weight: 900;

.pb-logo.is-vert { writing-mode: vertical-rl; transform: rotate(180deg); font-size: calc(var(--u)*62); }
.pb-logo.is-glow { text-shadow: 0 0 calc(var(--u)*18) color-mix(in srgb, var(--logo) 40%, transparent); }
.pb-type { position: absolute; right: calc(var(--u)*24); bottom: calc(var(--u)*28); font-size: calc(var(--u)*12); font-weight: 700; letter-spacing: .12em; color: var(--muted); }
.pb-back { position: absolute; inset: 0; padding: calc(var(--u)*28) calc(var(--u)*26); display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,.28); }
.pb-card.is-dark .pb-back { background: transparent; }

.pb-lbl { position: absolute; bottom: 34px; font-size: 11px; letter-spacing: .14em; opacity: .7; }

/* ---------- story board ---------- */
.pb-story { display: grid; grid-template-columns: 420px minmax(0,1fr); background: var(--ground); }

.pb-marker { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: var(--ground);

.pb-who { margin-top: auto; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; padding: 18px 20px; border-radius: 14px; background: #fff; border: 1.5px solid var(--ink); }

.pb-who small { display: block; font-size: 11px; letter-spacing: .12em; opacity: .7; margin-bottom: 4px; }
.pb-who b { font-size: 15px; font-weight: 500; }
.pb-moods { display: flex; gap: 6px; flex-shrink: 0; }
.pb-moods span { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; }

/* ---------- horizontal card (85.6 × 54mm), positions from the H-Spec board: 30u safe margin ---------- */
.pb-card.is-h .pb-logo { left: calc(var(--u)*30); top: calc(var(--u)*26); bottom: auto; font-size: calc(var(--u)*36); line-height: 1; letter-spacing: -.02em; }
.pb-card.is-h .pb-chip { left: calc(var(--u)*40); top: calc(var(--u)*108); width: calc(var(--u)*56); height: calc(var(--u)*44); border-radius: calc(var(--u)*9); }
.pb-card.is-h .pb-nfc-wrap { left: calc(var(--u)*112); right: auto; top: calc(var(--u)*116); width: calc(var(--u)*28); height: calc(var(--u)*28); }
.pb-card.is-h .pb-type { right: calc(var(--u)*30); bottom: calc(var(--u)*26); }
.pb-backh { position: absolute; inset: 0; }

.pb-stripe { position: absolute; left: 0; right: 0; top: calc(var(--u)*26); height: calc(var(--u)*46); background: #23262E; }
.pb-card.is-dark .pb-stripe { background: #050506; }
.pb-sign-h { position: absolute; left: calc(var(--u)*30); top: calc(var(--u)*92); width: calc(var(--u)*280); height: calc(var(--u)*38); }
.pb-cvc { position: absolute; left: calc(var(--u)*324); top: calc(var(--u)*92); width: calc(var(--u)*122); height: calc(var(--u)*38); border-radius: calc(var(--u)*6);
  display: flex; align-items: center; justify-content: center; gap: calc(var(--u)*8); box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); background: rgba(255,255,255,.55); }
.pb-card.is-dark .pb-cvc { background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.15); }
.pb-cvc small { font-size: calc(var(--u)*10); letter-spacing: .1em; opacity: .75; } .pb-cvc b { font-size: calc(var(--u)*15); }
.pb-num1 { position: absolute; left: calc(var(--u)*30); top: calc(var(--u)*158); font-size: calc(var(--u)*22); font-weight: 700; letter-spacing: .06em; white-space: nowrap; }
.pb-meta-h { position: absolute; left: calc(var(--u)*30); top: calc(var(--u)*200); gap: calc(var(--u)*36); }
.pb-meta-h b { font-size: calc(var(--u)*14); letter-spacing: .08em; }
.pb-foot-h { position: absolute; left: calc(var(--u)*30); bottom: calc(var(--u)*22); }
.pb-brand-s { position: absolute; right: calc(var(--u)*30); bottom: calc(var(--u)*19); font-size: calc(var(--u)*16); color: var(--logo); }

.pb-wire.is-h .pb-wf .n { left: 50px; right: auto; top: 52px; }

<script>
/**
 * board-renderer.js — card_boards JSON → 7 design boards (concept, 3 variants, 3 design points).
 *
 * No build step, no dependencies. Works in plain HTML (ES module) or wrapped in a React component:
 *   import { renderBoards, fontHref } from './board-renderer.js';
 *   const view = renderBoards(data, document.getElementById('boards'));
 *   view.update(nextData);      // after an update_card_boards patch
 *
 * Safety: every string from the model is HTML-escaped; colors must match #RRGGBB or fall back.
 * The model never supplies markup or CSS.
 */

// ------------------------------------------------------------------ utils
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
const HEX = /^#[0-9a-f]{6}$/i;
const hex = (v, fallback) => (HEX.test(String(v || '')) ? v : fallback);
let uid = 0;
const nid = (p) => `${p}${++uid}`;

function lum(h) {
  const c = [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255)
    .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
const isDark = (h) => lum(h) < 0.2;
function mix(a, b, t) {
  const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const rgba = (h, a) => `rgba(${[1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(',')},${a})`;

const FONT_STACK = {
  display: (f) => `'${f}', 'Black Han Sans', 'Archivo Black', sans-serif`,
  body: (f) => `'${f}', 'Noto Sans KR', system-ui, sans-serif`,
  mono: (f) => `'${f}', 'JetBrains Mono', ui-monospace, monospace`,
};
const FONT_ALLOW = ['Unbounded', 'Archivo Black', 'Syne', 'DM Serif Display', 'Black Han Sans', 'IBM Plex Sans KR',
  'Noto Sans KR', 'Gothic A1', 'Nanum Gothic', 'Space Mono', 'JetBrains Mono', 'IBM Plex Mono'];

/** Google Fonts stylesheet URL for the board's typography (add as <link rel="stylesheet">). */
function fontHref(data) {
  const t = data.typography || {};
  const fams = [...new Set([t.display, t.body, t.mono].filter((f) => FONT_ALLOW.includes(f)))];
  const q = fams.map((f) => `family=${encodeURIComponent(f).replace(/%20/g, '+')}:wght@400;500;700${/Unbounded|Syne/.test(f) ? ';900' : ''}`);
  return `https://fonts.googleapis.com/css2?${q.join('&')}&display=swap`;
}

// ------------------------------------------------------------------ theme from palette
function theme(data) {
  const pal = (data.palette || []).map((p) => ({ ...p, hex: hex(p.hex, '#888888') }));
  const by = (role) => pal.find((p) => p.role === role);
  const ink = by('ink')?.hex || '#0E0E10';
  const ground = by('ground')?.hex || '#F2F1EC';
  const accent = by('accent')?.hex || '#C8FF3D';
  const supports = pal.filter((p) => p.role === 'support').map((p) => p.hex);
  const named = Object.fromEntries(pal.map((p) => [p.name, p.hex]));
  const t = data.typography || {};
  return {
    pal, ink, ground, accent, supports: supports.length ? supports : [mix(accent, ground, 0.5)],
    color: (name, fb) => named[name] || fb,
    fDisplay: FONT_STACK.display(FONT_ALLOW.includes(t.display) ? t.display : 'Unbounded'),
    fBody: FONT_STACK.body(FONT_ALLOW.includes(t.body) ? t.body : 'IBM Plex Sans KR'),
    fMono: FONT_STACK.mono(FONT_ALLOW.includes(t.mono) ? t.mono : 'Space Mono'),
    vertical: (data.layout?.orientation || 'vertical') === 'vertical',
  };
}

// ------------------------------------------------------------------ materials
const CHIPS = {
  silver: 'linear-gradient(140deg,#f3f4f6 0%,#b9bdc4 40%,#eceef1 60%,#a3a8b0 100%)',
  gold: 'linear-gradient(140deg,#f6e3b4 0%,#c9a24e 45%,#f3dc9c 60%,#b38a3a 100%)',
  graphite: 'linear-gradient(140deg,#6b6d72 0%,#2e2f33 45%,#5a5c61 60%,#26272a 100%)',
};
const METAL = {
  black: 'linear-gradient(160deg,#1f1f22 0%,#151517 50%,#101012 100%)',
  silver: 'linear-gradient(150deg,#f1f2f4 0%,#c3c7cd 35%,#eef0f2 52%,#9fa4ab 100%)',
  gold: 'linear-gradient(150deg,#f6e7c1 0%,#cfae66 38%,#f3e0ae 55%,#a8843a 100%)',
};

/** Resolve a variant's material into paint layers + the colors that sit on top of it. */
function material(v, T) {
  const m = v.material || {};
  const preset = ['holo', 'clear', 'metal', 'matte', 'gradient'].includes(m.preset) ? m.preset : 'matte';
  const out = { preset, layers: [], base: '', onDark: false, chip: CHIPS[m.chip] || CHIPS.silver, edge: null, glow: false, backdrop: null };
  if (preset === 'holo') {
    const tint = T.color(m.tint, null);
    out.base = 'linear-gradient(125deg,#e8e2ff 0%,#c4f3ff 18%,#ffd9f0 38%,#fff3c2 55%,#cffff0 72%,#ddd2ff 88%,#ffe0f5 100%)';
    out.layers = [
      'repeating-linear-gradient(115deg,rgba(255,255,255,0) 0,rgba(255,255,255,.6) 2px,rgba(255,255,255,0) 5px)|overlay',
      'conic-gradient(from 210deg at 70% 35%,rgba(255,120,200,.25),rgba(120,220,255,.25),rgba(200,255,120,.22),rgba(180,140,255,.25),rgba(255,120,200,.25))|soft-light',
      'linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.75) 44%,rgba(255,255,255,0) 56%)|normal',
    ];
    if (tint) out.layers.push(`linear-gradient(${rgba(tint, 0.22)},${rgba(tint, 0.22)})|soft-light`);
    out.text = T.ink;
  } else if (preset === 'clear') {
    const tint = T.color(m.tint, T.supports[0]);
    out.base = `linear-gradient(${rgba(tint, 0.10)},${rgba(tint, 0.10)}),rgba(255,255,255,.22)`;
    out.layers = ['linear-gradient(110deg,rgba(255,255,255,0) 25%,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 52%)|normal'];
    out.clear = true;
    out.coil = m.coil !== false;
    out.chip = CHIPS[m.chip] || CHIPS.gold;
    out.text = T.ink;
    out.backdrop = tint;
  } else if (preset === 'metal') {
    const base = METAL[m.base] ? m.base : 'black';
    out.base = METAL[base];
    out.noise = true;
    out.onDark = base === 'black';
    out.text = out.onDark ? '#d6d6d2' : T.ink;
    out.chip = CHIPS[m.chip] || (out.onDark ? CHIPS.graphite : CHIPS.silver);
    out.edge = T.color(m.edge, null);
    out.layers = out.onDark
      ? ['linear-gradient(110deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.07) 45%,rgba(255,255,255,0) 58%)|normal']
      : ['repeating-linear-gradient(0deg,rgba(255,255,255,.22) 0 1px,rgba(0,0,0,.05) 1px 2px)|normal',
        'linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.45) 44%,rgba(255,255,255,0) 56%)|normal'];
    out.noise = out.onDark;
  } else if (preset === 'matte') {
    const c = T.color(m.tint, T.supports[0]);
    out.base = `linear-gradient(160deg,${mix(c, '#ffffff', 0.08)} 0%,${c} 55%,${mix(c, '#000000', 0.08)} 100%)`;
    out.noise = true;
    out.onDark = isDark(c);
    out.text = out.onDark ? '#ededea' : T.ink;
    out.chip = CHIPS[m.chip] || (out.onDark ? CHIPS.graphite : CHIPS.silver);
  } else {
    const stops = (m.stops || []).map((n) => T.color(n, null)).filter(Boolean);
    const s = stops.length >= 2 ? stops : [T.supports[0], T.accent];
    out.base = `linear-gradient(150deg,${s.map((c, i) => `${c} ${Math.round((i / (s.length - 1)) * 100)}%`).join(',')})`;
    out.layers = ['linear-gradient(105deg,rgba(255,255,255,0) 32%,rgba(255,255,255,.35) 45%,rgba(255,255,255,0) 58%)|normal'];
    const avg = s.reduce((a, c) => a + lum(c), 0) / s.length;
    out.onDark = avg < 0.2;
    out.text = out.onDark ? '#f2f1ec' : T.ink;
    out.chip = CHIPS[m.chip] || CHIPS.silver;
    out.labelEnd = lum(s[s.length - 1]) < 0.3 ? '#f2f1ec' : T.ink; // bottom-right sits on the last stop
  }
  out.logo = T.color(m.logo_color, out.text);
  out.glow = out.onDark && lum(out.logo) > 0.5;
  out.muted = out.labelEnd || (out.onDark ? '#8a8a88' : T.ink);
  return out;
}

const noiseSVG = (opacity) => {
  const id = nid('pbn');
  return `<svg class="pb-noise" aria-hidden="true" style="opacity:${opacity}"><filter id="${id}"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .55  0 0 0 0 .55  0 0 0 .45 0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#${id})"></rect></svg>`;
};
const contactlessSVG = (c) => `<svg class="pb-nfc" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 8.5a5 5 0 0 1 0 7"></path><path d="M11.5 6a8.5 8.5 0 0 1 0 12"></path><path d="M15 3.5a12 12 0 0 1 0 17"></path></svg>`;

function coilSVG(w, h) {
  const r = (i) => `<rect x="${14 + i * 5}" y="${14 + i * 5}" width="${w - 28 - i * 10}" height="${h - 28 - i * 10}" rx="${12 - i * 2}" stroke="#B9783F" stroke-opacity=".72" stroke-width="1.2"></rect>`;
  return `<svg class="pb-coil" viewBox="0 0 ${w} ${h}" fill="none" aria-hidden="true">${r(0)}${r(1)}${r(2)}<path d="M24 60H50" stroke="#B9783F" stroke-opacity=".8" stroke-width="1.2"></path></svg>`;
}

const typeLabel = (data) => ({ check: 'CHECK', credit: 'CREDIT', prepaid: 'PREPAID', membership: 'MEMBER' }[data.brand?.card_type] || 'CARD');

/** One card face. size = short-side px. */
function cardHTML(data, v, side, size, T) {
  const M = material(v, T);
  const vert = T.vertical;
  const u = size / 300;
  const W = vert ? 300 : 476, H = vert ? 476 : 300;
  const layers = M.layers.map((l) => { const [bg, mode] = l.split('|'); return `<i class="pb-layer" style="background:${bg};mix-blend-mode:${mode}"></i>`; }).join('');
  const brand = esc(data.brand?.name || 'BRAND');
  const style = [`width:${W * u}px`, `height:${H * u}px`, `background:${M.base}`, `color:${M.text}`, `--logo:${M.logo}`, `--muted:${M.muted}`, `--chip:${M.chip}`,
    `font-family:${T.fMono}`].join(';');
  let inner = '';
  const cv = M.clear && vert; // clear cards inset elements inside the antenna coil (vertical layout)
  if (side === 'front') {
    inner = `${M.coil ? coilSVG(W, H) : ''}
      <i class="pb-chip" style="${cv ? 'left:calc(var(--u)*44);top:calc(var(--u)*42)' : ''}"></i>
      <span class="pb-nfc-wrap" style="${cv ? 'right:calc(var(--u)*44);top:calc(var(--u)*48)' : ''}">${contactlessSVG(M.onDark ? '#8a8a88' : M.text)}</span>
      <span class="pb-logo ${vert ? 'is-vert' : ''} ${M.glow ? 'is-glow' : ''}" style="font-family:${T.fDisplay}${cv ? ';left:calc(var(--u)*40);bottom:calc(var(--u)*40)' : ''}">${brand}</span>
      <span class="pb-type" style="${cv ? 'right:calc(var(--u)*42);bottom:calc(var(--u)*44)' : ''}">${typeLabel(data)}</span>`;
  } else if (!vert) {
    // horizontal back follows card convention: magnetic stripe, signature + CVC, number on one line
    inner = `<div class="pb-backh ${M.clear ? 'is-clear' : ''}">
      <i class="pb-stripe"></i><i class="pb-sign pb-sign-h"></i>
      <div class="pb-cvc"><small>CVC</small><b>•••</b></div>
      <div class="pb-num1">0427 1017 2026 000${(data.variants || []).indexOf(v) + 1}</div>
      <div class="pb-meta pb-meta-h"><div><small>NAME</small><b>YOUR NAME</b></div><div><small>VALID THRU</small><b>MM/YY</b></div></div>
      <div class="pb-foot pb-foot-h" style="font-family:${T.fBody}">분실신고는 ${brand} 앱에서 · ${esc(data.brand?.issuer_placeholder || '[ISSUER]')}</div>
      <b class="pb-brand-s" style="font-family:${T.fDisplay}">${brand}</b>
    </div>`;
  } else {
    inner = `<div class="pb-back ${M.clear ? 'is-clear' : ''}">
      <div class="pb-back-top"><b style="font-family:${T.fDisplay}">${brand}</b><span>${typeLabel(data)}</span></div>
      <div class="pb-back-info">
        <div class="pb-num">0427 1017<br>2026 000${(data.variants || []).indexOf(v) + 1}</div>
        <div class="pb-meta"><div><small>VALID THRU</small><b>MM/YY</b></div><div><small>CVC</small><b>•••</b></div></div>
        <div class="pb-name">YOUR NAME</div>
        <i class="pb-sign"></i>
      </div>
      <div class="pb-foot" style="font-family:${T.fBody}">분실신고는 ${brand} 앱에서 · ${esc(data.brand?.issuer_placeholder || '[ISSUER]')}</div>
    </div>`;
  }
  const edge = M.edge ? `<i class="pb-edge" style="background:${M.edge}"></i>` : '';
  return `<div class="pb-cardwrap" style="--u:${u}px">${edge}<div class="pb-card pb-card--${M.preset} ${M.onDark ? 'is-dark' : ''} ${vert ? '' : 'is-h'}" style="${style}">${layers}${M.noise ? noiseSVG(0.4) : ''}${inner}</div></div>`;
}

// ------------------------------------------------------------------ scenes behind cards
function scene(v, T) {
  const M = material(v, T);
  if (M.clear) {
    const [a, b] = [T.color(v.material?.tint, T.supports[0]), T.accent];
    return { bg: mix(a, '#ffffff', 0.72), dark: false, blobs: [[a, 420, 120, 170], [b, 230, 430, 70], [T.supports[1] || T.ink, 300, 600, 470]] };
  }
  if (M.onDark) return { bg: 'radial-gradient(80% 70% at 40% 35%,#2a2a2e 0%,#141416 60%,#0a0a0b 100%)', dark: true, blobs: [] };
  return { bg: `radial-gradient(90% 80% at 50% 30%,${mix(T.ground, '#ffffff', 0.5)} 0%,${T.ground} 70%,${mix(T.ground, '#000000', 0.08)} 100%)`, dark: false, blobs: [] };
}
const blobsHTML = (blobs) => blobs.map(([c, s, x, y], i) => `<i class="pb-blob" style="background:${c};width:${s}px;height:${i === 2 ? s * 0.4 : s}px;left:${x}px;top:${y}px;border-radius:${i === 2 ? '999px' : '50%'};${i === 2 ? 'transform:rotate(-12deg)' : ''}"></i>`).join('');

// ------------------------------------------------------------------ boards
function conceptBoard(data, T, version) {
  const c = data.concept || {};
  const kw = (c.keywords || []).map((k, i, a) => `<span class="pb-chipword ${i === a.length - 1 ? 'is-hl' : ''}">${esc(k)}</span>`).join('');
  const sw = T.pal.map((p) => `<div class="pb-sw"><i style="background:${p.role === 'metal' ? `linear-gradient(160deg,${mix(p.hex, '#ffffff', 0.6)} 0%,${p.hex} 45%,${mix(p.hex, '#ffffff', 0.4)} 60%,${mix(p.hex, '#000000', 0.2)} 100%)` : p.hex}"></i><b>${esc(p.name)}</b><code>${esc(p.hex)}</code></div>`).join('');
  const mats = (data.variants || []).map((v) => `<div class="pb-mat">${cardHTML(data, v, 'front', T.vertical ? 120 : 90, T).replace('pb-cardwrap', 'pb-cardwrap pb-mat-card')}<b>${esc(v.name)}</b><span>${esc(v.code)}</span></div>`).join('');
  const t = data.typography || {};
  const ben = (data.benefits || []).slice(0, 3);
  const benefits = ben.length ? `<section class="pb-sec pb-span12 pb-benefits"><h4>06 — BENEFITS</h4><div class="pb-benrow">${ben.map((b) => `<div><small>${esc(b.category)}</small><b>${esc(b.headline)}</b><span>${esc(b.condition)}</span></div>`).join('')}</div></section>` : '';
  const vert = T.vertical;
  return `<div class="pb-board pb-concept" style="font-family:${T.fBody};--ink:${T.ink};--ground:${T.ground};--accent:${T.accent};height:${ben.length ? 1160 : 1000}px">
    <header class="pb-span12 pb-head">
      <div><div class="pb-eyebrow" style="font-family:${T.fMono}">DESIGN BOARD · NEW ${esc(typeLabel(data))} CARD · v${version}</div>
      <h1 style="font-family:${T.fDisplay}">${esc(data.brand?.name)}<span class="pb-dot">.</span></h1></div>

    <section class="pb-sec pb-span8"><h4 style="font-family:${T.fMono}">02 — PALETTE</h4><div class="pb-swatches" style="font-family:${T.fMono}">${sw}</div></section>
    <section class="pb-sec pb-span5"><h4 style="font-family:${T.fMono}">03 — MATERIALS</h4><div class="pb-mats">${mats}</div></section>
    <section class="pb-sec pb-span3"><h4 style="font-family:${T.fMono}">04 — TYPE</h4>
      <div class="pb-spec"><div style="font-family:${T.fDisplay};font-size:44px;font-weight:900">Aa</div><small><b>${esc(t.display)}</b> · 로고·헤드라인</small></div>
      <div class="pb-spec"><div style="font-weight:700;font-size:34px">가나다</div><small><b>${esc(t.body)}</b> · 본문·안내</small></div>
      <div class="pb-spec"><div style="font-family:${T.fMono};font-size:24px">0427 2026</div><small><b>${esc(t.mono)}</b> · 카드번호·숫자</small></div></section>
    <section class="pb-sec pb-span4"><h4 style="font-family:${T.fMono}">05 — LAYOUT (${vert ? '54 × 85.6mm, 세로' : '85.6 × 54mm, 가로'})</h4>
      <div class="pb-wire ${vert ? '' : 'is-h'}"><div class="pb-wf"><i class="c"></i><i class="n" style="font-family:${T.fMono}">NFC</i><b style="font-family:${T.fDisplay}" class="${vert ? 'v' : ''}">${esc(data.brand?.name)}</b><i class="t" style="font-family:${T.fMono}">${typeLabel(data)}</i></div><small>FRONT · 칩 + 로고만</small></div>
      <div class="pb-wire ${vert ? '' : 'is-h'}"><div class="pb-wf pb-wb"><i></i><i></i><i></i><i class="s"></i></div><small>BACK · 번호·이름·CVC</small></div><p class="pb-note">${esc(data.layout?.orientation_reason || '')}</p></section>

function variantBoard(data, v, i, T) {
  const S = scene(v, T);
  const front = cardHTML(data, v, 'front', 300, T);
  const back = cardHTML(data, v, 'back', 300, T);
  const vert = T.vertical;
  return `<div class="pb-board pb-variant ${S.dark ? 'is-dark' : ''}" style="background:${S.bg};font-family:${T.fBody};--ink:${T.ink};--accent:${T.accent}">
    ${blobsHTML(S.blobs)}
    <div class="pb-vhead"><div class="pb-eyebrow" style="font-family:${T.fMono}">${esc(data.brand?.name)} ${esc(typeLabel(data))} · 0${i + 1}</div><div class="pb-vcode" style="font-family:${T.fDisplay}">${esc(v.code)}</div></div>
    <div class="pb-floor ${vert ? '' : 'is-h'}"></div>
    <div class="pb-front3d ${vert ? '' : 'is-h'}">${front}</div>
    <div class="pb-backflat ${vert ? '' : 'is-h'}">${back}</div>
    <div class="pb-lbl" style="left:${vert ? 280 : 274}px;font-family:${T.fMono}">FRONT</div><div class="pb-lbl" style="left:${vert ? 765 : 794}px;font-family:${T.fMono}">BACK</div>
  </div>`;
}

// Exact spot each anchor points at, in card units (vertical card 300×476, horizontal 476×300).
const TARGETS_V = { chip: [50, 49], contactless: [263, 49], logo: [52, 330], material: [205, 215], edge: [299, 300], front: [150, 150], back: [150, 440], type_label: [262, 446] };
const TARGETS_H = { chip: [68, 130], contactless: [126, 130], logo: [72, 44], material: [330, 160], edge: [475, 150], front: [250, 90], back: [238, 280], type_label: [418, 268] };

/**
 * Numbered callouts with straight leader lines.
 * Vertical card: numbers in the left/right margins, every line horizontal.
 * Horizontal card: numbers above/below the card, every line vertical.
 * All lines are parallel, so they can never cross. A number sits exactly in line with its spot;
 * if that row is taken it moves to the opposite margin, and only if both are taken does the spot
 * itself slide along to the nearest free row (anchors are areas, so a small slide is fine).
 */
function callouts(points, vert, cx, cy, scale, dark) {
  const A = vert ? TARGETS_V : TARGETS_H;
  const cardW = (vert ? 300 : 476) * scale, cardH = (vert ? 476 : 300) * scale;
  const GAP = 36;                                   // min distance between numbers in one margin
  const LO = 20, HI = vert ? 700 : 400;             // numbers stay inside the 420×720 panel
  const sides = vert ? ['left', 'right'] : ['top', 'bottom'];
  const taken = { [sides[0]]: [], [sides[1]]: [] };
  const free = (side, pos) => pos >= LO && pos <= HI && taken[side].every((p) => Math.abs(p - pos) >= GAP);
  const seen = {};
  const items = points.map((p, idx) => {
    const t = A[p.anchor] || A.front;
    const dup = (seen[p.anchor] = (seen[p.anchor] || 0) + 1) - 1;   // a repeated anchor starts one row further along
    const along = (vert ? cy + t[1] * scale : cx + t[0] * scale) + dup * GAP;
    const across = vert ? cx + t[0] * scale : cy + t[1] * scale;
    const pref = vert ? (t[0] < 150 ? 0 : 1) : (t[1] < 150 ? 0 : 1);
    let side = sides[pref], pos = along;
    if (!free(side, pos)) {
      // opposite margin only if no line on the near side runs on (almost) the same row, so lines never overlap
      if (free(sides[1 - pref], pos) && taken[side].every((q) => Math.abs(q - pos) >= 12)) side = sides[1 - pref];
      else {
        for (let d = 2; d < 400; d += 2) {
          if (free(side, along + d)) { pos = along + d; break; }
          if (free(side, along - d)) { pos = along - d; break; }
        }
      }
    }
    taken[side].push(pos);
    const first = side === sides[0];
    const m = { n: idx + 1, side };
    if (vert) { m.mx = first ? cx - 30 : cx + cardW + 30; m.my = pos; m.tx = across; m.ty = pos; }
    else { m.mx = pos; m.my = first ? cy - 44 : cy + cardH + 44; m.tx = pos; m.ty = across; }
    return m;
  });
  const stroke = dark ? 'var(--accent)' : 'var(--ink)';
  const lines = items.map((m) => {
    const x0 = vert ? (m.side === 'left' ? m.mx + 15 : m.mx - 15) : m.mx;
    const y0 = vert ? m.my : (m.side === 'top' ? m.my + 15 : m.my - 15);
    return `<line x1="${x0.toFixed(1)}" y1="${y0.toFixed(1)}" x2="${m.tx.toFixed(1)}" y2="${m.ty.toFixed(1)}" stroke="${stroke}" stroke-width="1.5"></line>`
      + `<circle cx="${m.tx.toFixed(1)}" cy="${m.ty.toFixed(1)}" r="4.5" fill="${stroke}" stroke="#fff" stroke-width="2"></circle>`;
  }).join('');
  const svg = `<svg class="pb-callouts" viewBox="0 0 420 720" aria-hidden="true">${lines}</svg>`;
  const nums = items.map((m) => `<span class="pb-marker" style="left:${Math.round(m.mx - 15)}px;top:${Math.round(m.my - 15)}px">${m.n}</span>`).join('');
  return svg + nums;
}

function storyBoard(data, v, i, T) {
  const S = scene(v, T);
  const s = v.story || {};
  const vert = T.vertical;
  // vertical: 60px side margins for callouts; horizontal: wide card, callouts above/below
  const size = vert ? 300 : 250, scale = size / 300;
  const cx = Math.round((420 - (vert ? 300 : 476) * scale) / 2);
  const cy = Math.round((720 - (vert ? 476 : 300) * scale) / 2);
  const markers = callouts(s.points || [], vert, cx, cy, scale, S.dark);
  const pts = (s.points || []).map((p, k) => `<div class="pb-pt"><h5><span style="font-family:${T.fMono}">0${k + 1}</span>${esc(p.title)}</h5><p>${esc(p.body)}</p></div>`).join('');
  const moods = (s.mood || []).map((m, k) => `<span style="background:${[T.supports[0], T.accent, T.supports[1] || T.supports[0]][k] || T.accent};color:${isDark([T.supports[0], T.accent, T.supports[1] || T.supports[0]][k] || T.accent) ? '#fff' : T.ink}">${esc(m)}</span>`).join('');
  const dark = S.dark;

/** Full HTML for all 7 boards. Each frame has data-board="concept|variant-CODE|story-CODE". */
function boardsToHTML(data, opts = {}) {
  const T = theme(data);
  const version = Number.isFinite(opts.version) ? opts.version : 1;
  const vs = (data.variants || []).slice(0, 3);
  const frame = (id, title, w, h, inner) => `<figure class="pb-frame" data-board="${esc(id)}" data-w="${w}" data-h="${h}"><figcaption>${esc(title)}</figcaption><div class="pb-fit" style="width:${w}px;height:${h}px">${inner}</div></figure>`;
  const concept = frame('concept', '디자인 보드', 1440, (data.benefits || []).length ? 1160 : 1000, conceptBoard(data, T, version));
  const variants = vs.map((v, i) => frame(`variant-${v.code}`, `시안 0${i + 1} · ${v.name}`, 1100, 720, variantBoard(data, v, i, T))).join('');
  const stories = vs.map((v, i) => frame(`story-${v.code}`, `0${i + 1} 디자인 포인트`, 1100, 720, storyBoard(data, v, i, T))).join('');

}

/** Scale every fixed-size board to its column width. */
function fitFrames(root) {
  root.querySelectorAll('.pb-frame').forEach((f) => {
    const w = +f.dataset.w, h = +f.dataset.h;
    const box = f.querySelector('.pb-fit');
    const avail = f.clientWidth || w;
    const k = Math.min(1, avail / w);
    box.style.transform = `scale(${k})`;
    box.style.transformOrigin = 'top left';
    f.style.height = `${h * k + 28}px`;
  });
}

function renderBoards(data, el, opts = {}) {
  let current = data;
  const draw = () => { el.innerHTML = boardsToHTML(current, opts); fitFrames(el); };
  draw();
  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(() => fitFrames(el)) : null;
  ro?.observe(el);
  return {
    update(next, nextOpts = {}) { current = next; Object.assign(opts, nextOpts); draw(); },
    destroy() { ro?.disconnect(); el.innerHTML = ''; },
  };
}
