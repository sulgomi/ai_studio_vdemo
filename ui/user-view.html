<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상품기획 AI 사용자 뷰</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%231f6b60%27/%3E%3Crect x=%277%27 y=%2711%27 width=%2718%27 height=%2712%27 rx=%272%27 fill=%27none%27 stroke=%27white%27 stroke-width=%272%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--surface:#fffefb;--surface2:#efece5;--line:#e3dfd6;--ink:#1d2421;--mute:#69716c;--accent:#1f6b60;--accent-soft:#dcebe6;--warn:#8a5200;--warn-soft:#fbecd2;--bad:#a8283a;--bad-soft:#f9dfe3;--ok:#17734a;--ok-soft:#dbf0e4;--user:#1f6b60;--user-ink:#fff;--shadow:0 1px 2px rgba(60,50,30,.05),0 8px 24px -12px rgba(60,50,30,.14);--font:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;--ease:cubic-bezier(.2,.8,.2,1);--log-bg:#171c1a;--log-ink:#c9d3ce}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13171a;--surface:#1a2024;--surface2:#222a2f;--line:#2f383e;--ink:#e9ece8;--mute:#9aa5a0;--accent:#6fcdb9;--accent-soft:#1c3a34;--warn:#f0b65c;--warn-soft:#3a2c13;--bad:#ff8798;--bad-soft:#41191f;--ok:#62d497;--ok-soft:#143324;--user:#2a7a6d;--shadow:0 8px 24px -12px rgba(0,0,0,.6);--log-bg:#0d1110}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--font);font-feature-settings:"tnum";-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
a{color:var(--accent)}
h1,h2,h3{text-wrap:balance;letter-spacing:-.02em}p,li{text-wrap:pretty}
button{font-family:var(--font);transition:background-color .2s var(--ease),color .2s var(--ease),transform .15s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease);cursor:pointer}
button:active{transform:translateY(1px) scale(.985)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-999px;top:8px;background:var(--accent);color:#fff;padding:8px 12px;border-radius:6px;z-index:50}.skip:focus{left:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- 셸: 기록 | 채팅 | 리포트 ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr) 0;height:100dvh;transition:grid-template-columns .35s var(--ease)}
.app.has-report{grid-template-columns:268px minmax(0,1fr) minmax(336px,38.4%)}.app.has-report.rep-wide{grid-template-columns:268px minmax(0,1fr) minmax(460px,56%)}
.side{background:var(--surface2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0}
.side header{padding:18px 16px 10px}
.side h1{font-size:14px;margin:0 0 2px;font-weight:700}
.side .sub{font-size:12px;color:var(--mute)}
.newchat{margin:6px 12px 8px;padding:10px 12px;border-radius:10px;border:1px dashed var(--line);background:transparent;color:var(--ink);font-weight:600;font-size:13px;text-align:left}
.newchat:hover{background:var(--surface);border-style:solid}
.hist{list-style:none;margin:0;padding:4px 8px;overflow:auto;flex:1;min-height:0}
.hist li button{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;color:var(--ink);font-size:13px}
.hist li button:hover{background:var(--surface)}
.hist li button[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow)}
.hist .t{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.hist .m{display:block;font-size:11.5px;color:var(--mute);font-family:var(--mono)}
.hist .empty{padding:10px;color:var(--mute);font-size:12.5px}
.side footer{padding:10px 14px 14px;border-top:1px solid var(--line);font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.side footer nav{display:flex;flex-wrap:wrap;gap:4px 12px}
details.uchk{font-size:12.5px}details.uchk summary{cursor:pointer;font-weight:600}
.check{margin:6px 0 0;padding:0;list-style:none}.check li{margin:4px 0}.check label{cursor:pointer;display:flex;gap:6px;align-items:flex-start}

.chat{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.chat-top{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px)}
.chat-top h2{font-size:14px;margin:0;font-weight:700;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}.chat-top .badge{white-space:nowrap}.app.has-report .chat-top .badge{display:none}.iconbtn{white-space:nowrap}
.badge{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:4px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.bad{background:var(--bad-soft);color:var(--bad)}.badge.acc{background:var(--accent-soft);color:var(--accent)}
.chat-top .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
.iconbtn:hover{background:var(--surface2)}
.menu-btn{display:none}
.rail{display:flex;gap:0;padding:0 20px;background:var(--surface)}
.rail div{flex:1;min-width:0;font-size:11.5px;color:var(--mute);border-top:3px solid var(--line);padding:6px 4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .3s var(--ease),color .3s}
.rail div.on{border-top-color:var(--accent);color:var(--accent);font-weight:700}.rail div.done{border-top-color:var(--ok);color:var(--ok)}
.feed{flex:1;min-height:0;overflow:auto;padding:24px 20px 12px;scroll-behavior:smooth}
.feed-in{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.welcome{margin:8vh auto 0;max-width:560px;text-align:center}
.welcome h2{font-size:22px;margin:0 0 6px}.welcome p{color:var(--mute);margin:0 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chipbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font-size:13px}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}

.msg{display:flex;gap:10px;animation:rise .4s var(--ease) both;min-width:0}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.msg.user{justify-content:flex-end}
.msg .av{flex:none;width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:600 11px var(--mono)}
.msg .av.orch{background:var(--ink);color:var(--bg)}
.msg .body{min-width:0;max-width:calc(100% - 42px)}
.msg .who{font-size:12px;color:var(--mute);margin-bottom:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.msg .who b{color:var(--ink);font-weight:700}
.msg .who .model{font:500 11px var(--mono);padding:1px 6px;border-radius:4px;background:var(--surface2);color:var(--mute)}
.bubble{background:var(--surface);border-radius:4px 16px 16px 16px;padding:12px 16px;box-shadow:var(--shadow);overflow-wrap:anywhere}
.bubble p{margin:0 0 6px}.bubble p:last-child{margin:0}.bubble ul{margin:6px 0;padding-left:18px}
.msg.user .bubble{background:var(--user);color:var(--user-ink);border-radius:16px 16px 4px 16px;max-width:560px}
.typing{display:inline-flex;gap:4px;padding:12px 16px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.log{background:var(--log-bg);color:var(--log-ink);border-radius:10px;font:12px/1.7 var(--mono);padding:10px 14px;overflow:auto;max-height:240px;margin:0 0 0 42px;animation:rise .3s var(--ease) both}
.log .ln{white-space:pre-wrap;word-break:break-word}
.log .ts{color:#6f7d77;margin-right:8px}.log .ag{color:#7dd3c0;margin-right:8px}.log .ag.code{color:#e0b86a}.log .ag.gate{color:#e08a96}.log .ag.human{color:#9db8ff}
.log .ok{color:#7ad49b}
details.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
details.more>summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--accent)}
.detail{margin-top:10px}

.confirm{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin-left:42px;animation:rise .4s var(--ease) both}
.confirm h3{margin:0 0 4px;font-size:14px;color:var(--accent)}.confirm p{margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px}
button.primary:hover{filter:brightness(1.08);box-shadow:0 6px 16px -8px var(--accent)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
button.ghost:hover{background:var(--surface2)}
.final{border-radius:4px 16px 16px 16px;background:var(--ink);color:var(--bg);padding:16px 18px}
.final h3{margin:0 0 6px;font-size:16px}.final ul{margin:6px 0 12px;padding-left:18px}
.final button.primary{background:var(--bg);color:var(--ink)}.final button.ghost{color:var(--bg);border-color:color-mix(in srgb,var(--bg) 40%,transparent)}.final button.ghost:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}

.composer{padding:10px 20px 16px;background:linear-gradient(transparent,var(--bg) 24%)}
.composer-in{max-width:820px;margin:0 auto}
.opts{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:8px;font-size:12.5px;color:var(--mute)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mute);font:600 12.5px var(--font);padding:5px 10px;border-radius:8px}
.seg button:hover{color:var(--ink)}.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
select{font:inherit;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:4px 8px}
.box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:8px 8px 8px 14px;border:1px solid var(--line)}
.box:focus-within{border-color:var(--accent)}
.box textarea{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:14px/1.6 var(--font);resize:none;max-height:140px;min-height:24px;padding:6px 0}
.hidden{display:none!important}

/* 단계 상세(채팅 안) */
.stagehead{display:none}
.sub{color:var(--mute);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mini{border-radius:10px;padding:12px;background:var(--surface2);min-width:0}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:3px 0}.bar i{display:block;height:100%;background:var(--accent)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;margin:2px;background:var(--surface2);border:1px solid var(--line)}
.chip.empty{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.chip.crowd{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-size:11.5px;font-weight:600;border-bottom:1px solid var(--ink)}
.tw{overflow-x:auto}
.big{font-family:var(--mono);font-weight:500;letter-spacing:-.04em;font-size:28px}
.note{font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--warn-soft);color:var(--warn);margin:8px 0}
.quote{border-left:3px solid var(--line);padding:2px 10px;margin:6px 0}
.svgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.svgs figure{margin:0}.svgs img{width:100%;height:auto;border-radius:12px;display:block}.svgs figcaption{font-size:12px;color:var(--mute);margin-top:4px}
.sw{display:inline-block;width:20px;height:20px;border-radius:5px;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
video{width:100%;max-width:560px;border-radius:10px;background:#000}
.doc{background:var(--surface2);border-radius:10px;padding:12px 16px;max-height:420px;overflow:auto}
.doc h1{font-size:17px}.doc h2{font-size:15px;margin-top:14px}.doc blockquote{margin:6px 0;padding:4px 12px;border-left:3px solid var(--accent);color:var(--mute)}
.bubble h3{font-size:13.5px;margin:14px 0 6px}


/* ---------- 에이전트 연결도 · 시작 카드 ---------- */
.welcome.cards{max-width:1000px;text-align:left;margin-top:5vh}
.welcome.cards h2,.welcome.cards>p{text-align:center}
.agrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.acard{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;font:inherit;cursor:pointer;transition:border-color .2s,transform .2s,box-shadow .2s}
.acard:hover,.acard:focus-visible{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 10px 24px -16px rgba(0,0,0,.45)}
.acard .top{display:flex;align-items:center;gap:8px}.acard .no{font:700 12px var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:2px 7px}
.acard b{font-size:15px}.acard .role{font-size:13px;color:var(--mute);line-height:1.5}.acard .model{margin-left:auto;font-size:11px;color:var(--mute)}
.acard.feat{grid-column:1/-1;background:var(--accent-soft);border-color:var(--accent)}.acard.feat .no{background:var(--accent);color:var(--surface)}
.acard.opt{border-style:dashed}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:var(--mute);font:600 12.5px var(--font);padding:5px 12px;border-radius:8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.netbox{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.netbox svg{flex:0 0 auto;width:100%;height:min(60vh,560px);background:linear-gradient(180deg,var(--surface),var(--surface2))}
.netlegend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 16px;font-size:12px;color:var(--mute);border-top:1px solid var(--line)}
.netstatus{flex:1 1 auto;min-height:110px;overflow:auto;padding:12px 18px 14px;border-top:2px solid var(--accent);background:var(--accent-soft);display:flex;flex-direction:column;gap:8px}
.ns-tag{align-self:flex-start;font:700 12px var(--font);padding:3px 10px;border-radius:999px;background:var(--accent);color:var(--surface);letter-spacing:.02em}
.ns-tag.wait{background:var(--warn);color:#fff}.ns-tag.done{background:var(--ok)}.ns-tag.idle{background:var(--mute)}
.ns-tag.run::before{content:"";display:inline-block;width:7px;height:7px;margin-right:6px;border-radius:50%;background:currentColor;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.ns-now{font-size:19px;font-weight:800;line-height:1.25;letter-spacing:-.02em;color:var(--ink)}
.ns-msg{font-size:14.5px;font-weight:500;line-height:1.55;color:var(--ink)}
.ns-steps{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 12px}
.ns-steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.ns-steps .dot{flex:none;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font:700 11px var(--font);background:var(--surface);border:1.5px solid var(--line);color:var(--mute)}
.ns-steps li.run{color:var(--ink);font-weight:700}.ns-steps li.run .dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.ns-steps li.done{color:var(--accent)}.ns-steps li.done .dot{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.nd rect{fill:var(--surface);stroke:var(--line);stroke-width:1.6;filter:drop-shadow(0 2px 3px rgba(0,0,0,.08))}.nd text{fill:var(--ink);font:600 15px var(--font);text-anchor:middle}.grp{fill:var(--accent-soft);fill-opacity:.55;stroke:var(--line);stroke-dasharray:4 4}.grplab{fill:var(--mute);font:600 12px var(--font);text-anchor:middle}
.nd.run rect{stroke:var(--accent);stroke-width:3;fill:var(--accent-soft);animation:pulse 1.4s ease-in-out infinite}
.nd.done rect{stroke:var(--accent)}.nd.sm text{font-size:14px}
.nd.orch rect{fill:var(--ink);stroke:var(--ink)}.nd.orch text{fill:var(--surface)}
.detail table td:first-child,.detail table th:first-child{white-space:nowrap}
.sumbox{display:flex;flex-direction:column;gap:6px}.sumh{font-weight:800;font-size:15px;line-height:1.4}.sumsec{font-size:13.5px;line-height:1.5}
.sumul{margin:2px 0 0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:4px}.sumul li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.5}.sumul li::before{content:"";position:absolute;left:3px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent,#1f6b60)}
.kwgroup{margin:10px 0}.kwt{font-weight:800;font-size:13px;margin-bottom:6px}.kwgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.kw{border:1px solid var(--line,#d9d7cf);border-radius:12px;padding:10px;background:var(--surface,#fbfaf6);display:flex;flex-direction:column;gap:3px}.kwk{font-weight:800;font-size:14px;line-height:1.35}.kws{font-size:13px;line-height:1.5}.kwf{font-size:12.5px;font-weight:700;color:var(--accent,#1f6b60)}
.trgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:6px 0}.trgrid .mini{display:flex;flex-direction:column;gap:6px}
.cvpgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin:8px 0}
.cvp{display:flex;flex-direction:column;gap:6px}.cvp.win{outline:2px solid var(--accent,#1f6b60)}
.cvph{display:flex;gap:6px;align-items:center}.cvpn{font-weight:800;font-size:16px;line-height:1.3}
.cvpd{margin:6px 0;display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13px}.cvpd dt{color:var(--mute,#5f6068);font-weight:600}.cvpd dd{margin:0;min-width:0}
.amap{display:flex;flex-direction:column;gap:8px}.arow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:start}.anm{font-weight:700;font-size:13px;padding-top:6px}.achips{display:flex;flex-wrap:wrap;gap:6px}.achips .acell{flex:1 1 200px;margin:0}.acell{border:1px solid var(--line,#d9d7cf);border-radius:8px;padding:6px 8px;margin:3px 0;font-size:12.5px;background:#fff}.acell.pick{border-color:#0e8f80;background:#e4f3f0}.acell.mine{border:2px solid #14141a;background:#d6ff3f}
.cvpm{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;border-top:1px dashed var(--line,#d9d7cf);padding-top:6px}
.sbhead{margin:14px 0 6px}.sbflow{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:10px;padding:4px 2px 10px}
.sbsc{border:1px solid var(--line,#d9d7cf);border-radius:12px;padding:10px;background:var(--surface,#fbfaf6);display:flex;flex-direction:column;gap:6px}
.sbn{display:flex;align-items:center;gap:8px}.sbn span{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent,#1f6b60);color:#fff;font:800 12px sans-serif}.sbn em{font-style:normal;font-size:12px;color:var(--mute,#5f6068)}

.ec{stroke:var(--accent);stroke-width:3;fill:none;stroke-dasharray:8 5;animation:flow 1s linear infinite}

보너스가 쌓이는'은 챌린지 달성 시에만 지급되고 한도가 있는데 무조건 쌓이는 것처럼 읽힌다. (c) 보너스는 ETF로 전환되므로 가치가 변동하며, 이름에는 이 점이 드러나지 않는다. 투자 성과를 약속하는 문구는 아니지만 오인 소지는 있다. 제공된 메트릭상 topReject가 inertia라서 이름이 과장 기대를 만들면 해지·불만으로 이어질 위험도 있다.","suggestion":"한 줄 약속을 '모임 챌린지를 달성하면 보너스 포인트가 모임 풀에 더해지고, 풀은 각자 지분으로 ETF 소수점 매수에 쓰이는 카드'로 바꾼다. 가입 화면에 '포인트 기반 보너스이며 ETF 가치는 변동되고 원금 보장이 아님', '챌린지 달성 시에만, 월 한도 내 지급'을 한 문장으로 병기한다. 이름은 유지해도 되지만 광고 전반에 '굴려서 불린다'는 수익 뉘앙스의 카피는 쓰지 않는다. 최종 상표·네이밍 적정성은 준법 확인을 거친다."},{"item":"2. 광고 표현 위험(단정·과장·오인)","status":"fix","finding":"적립률(외식 1.2%, 온라인 0.8%)과 카테고리 한도(capPerCat 3)가 있는데, 풀 합산이 '추가 혜택'처럼 보이면 총 적립률이 높아 보이는 오인이 생긴다. 실제로는 개인 적립의 일부를 풀로 옮기는 것('일부 합산', 개인 적립은 별도 유지)이라 모임 합산 비율이 불명확하다. 일부 비율이 얼마인지 mechanics에 없고, '일부'가 개인 적립을 줄이는지 아닌지도 모호하다. 또 '친구와 함께하면 더 번다'식 표현은 수익 단정으로 읽힐 수 있다.","suggestion":"풀 합산 비율을 수치로 확정하고(이 문서에서는 값을 추정하지 않음, 상품팀 확정 필요) 광고에는 '개인 적립 중 OO%가 풀로 이동(개인 적립 별도 유지 여부 명시)', '챌린지 보너스는 조건 충족 시 한도 내 지급'을 같은 크기 글씨로 표기한다. '더 번다', '불어난다', '수익' 같은 단정·수익 암시 표현은 제외하고 '적립', '보너스 포인트'로 통일한다. 표시광고 심의는 준법 사전심의 대상으로 올린다."},{"item":"3. 부가서비스 변경 제한·혜택 지급 조건 고지","status":"needs_human","finding":"챌린지 조건('모임 전원 투자 계좌 자동이체 유지')과 보너스 한도가 '가입 화면에 명시'로만 되어 있다. 이 조건들을 연회비·부가서비스 약관상 어떻게 취급하는지(변경 시 고지 기간, 변경 제한 범위, 중도 변경 시 기 적립분 처리)는 이 입력으로는 판단할 수 없다. 특히 한 명이 자동이체를 해지하면 나머지 전원이 보너스를 못 받는 설계라 불이익이 타인 행위에서 비롯되는 점, 조건 변경 시 기존 모임 처리 방식이 비어 있다.","suggestion":"법무·준법에서 부가서비스 변경 제한 규정의 적용 여부와 고지 방식을 확인한다. 설계 측면에서는 (a) 챌린지 조건을 약관·상품설명서 문구와 동일하게 두고, (b) 조건 변경 시 사전 고지 기간과 기 달성 진행분 인정 규칙을 정하고, (c) '전원 달성' 대신 '달성 인원 비례 지급' 또는 이탈자 제외 후 재계산 규칙을 검토한다."},{"item":"4. 그룹사(증권) 연계 시 개인정보 결합·제3자 제공 동의","status":"needs_human","finding":"links에 증권(sec)이 있고, 챌린지는 모임 구성원 각자의 투자 계좌 자동이체 유지 여부를 확인해야 하며, 풀 구성과 개인 지분을 앱에서 서로 보이게 한다. 이 과정에서 (a) 카드사와 증권사 간 정보 이용·제공, (b) 모임원 간 타인의 이체 이행 여부·지분 정보 노출, (c) 초대 과정에서 타인 연락처 이용이 발생할 수 있다. 어떤 정보가 누구에게 보이는지가 입력에 정의되어 있지 않다.","suggestion":"법무·준법·개인정보 담당이 결합·제공 근거와 동의 구조(항목별 분리 동의, 선택 동의 거부 시 불이익 없음)를 확인한다. 설계상 최소 노출 원칙으로 모임원에게는 '챌린지 달성 여부'만 보이고 개인 지분 금액·계좌 정보·이체 금액은 비공개로 하는 방안을 우선 검토한다. 동의하지 않은 모임원이 있을 때의 처리(해당 인원 제외)도 정한다."},{"item":"5. 투자 연계 상품의 투자권유·손실 오인","status":"needs_human","finding":"포인트로 ETF를 매수하는 구조라 손실 가능성이 있는데 mechanics에 손실 고지가 없다. 또 '모임 합의로 ETF 선택'은 종목 선택 과정에서 카드사나 앱이 특정 ETF를 추천·노출하면 투자권유로 해석될 여지가 있고, 모임이 함께 운용하는 모습이 공동 투자나 일종의 집합 운용으로 비칠 수 있는지도 이 입력만으로 판단할 수 없다. 카드 앱이 중개하는지 증권사 앱에서 실행되는지, 포인트→주식 전환 주체도 정의가 없다. 포인트 가치와 원금 개념이 다르므로 '손실 시 포인트가 줄어든다'는 오인도 가능하다.","suggestion":"법무·준법에서 투자권유·투자중개·집합투자 해당 여부를 확인한다. 설계 측면에서는 (a) 카드 화면에서 종목 추천·순위·수익률 비교를 하지 않고 증권사가 제공하는 종목 목록만 노출, (b) 매수 직전 '투자 대상은 가치가 변동하며 손실이 발생할 수 있음, 포인트 적립은 예금자보호 대상이 아님'을 필수 고지, (c) 개인별 소유가 증권사 계좌에 귀속된다는 점과 모임 해산·탈퇴 시 처리 방식을 약관과 화면에 명시한다."},{"item":"6. 체리피킹·역선택 대비","status":"fix","finding":"제공된 값 기준으로 정적 손익은 7.95인데 채택 고객 기준은 5.4로 낮아지고, 체리피커는 채택자의 0.21(21%)이며 손익은 2.47, 휴면 위험형은 채택자의 0.15(15%)에 손익 0.5로 거의 이익이 없다. 일반형 7.41과 충성형 8.33이 이익을 지탱한다. 채택자의 약 36%(0.21+0.15)가 낮은 이익 유형이다. 구조적 취약점이 있다. (a) 2~5명 모임을 지인·가족·본인 다계정으로 만들어 풀 보너스만 챙기는 '모임 파밍'이 가능하다. (b) 챌린지 조건이 자동이체 유지라서, 달성 후 즉시 해지하는 식의 단기 이용이 방어되지 않는다. (c) 보너스 한도는 있으나 모임 수 상한(1인당 참여 모임 수)이 명시되지 않았다. 이 문서는 채택률·손익을 새로 추정하지 않으며 위 수치는 입력값 인용이다.","suggestion":"(a) 1인 1모임으로 제한하고 모임 구성원은 카드 발급 후 일정 기간(예: 개월 수는 상품팀 확정) 경과 고객으로 제한한다. (b) 보너스는 챌린지 3회 이상 연속 달성 후 지급하거나 보너스 지급 후 일정 기간 자동이체 유지를 요건으로 한다(조건은 약관 고지 필수). (c) 월 보너스 한도와 모임당 총 한도를 모두 설정한다. (d) 동일 기기·동일 주소·가족 관계 등 이상 패턴 모니터링 규칙은 준법·리스크 부서와 정한다. (e) 휴면 위험형 15%에 대해서는 챌린지가 활동 유도 장치가 되는지 소규모 실험으로 확인한다."}],"name_mechanism_consistent":false,"overall":"이름과 약속은 투자 수익을 연상시켜 실제 구조(적립 포인트 일부와 한도 내 보너스를 개인 지분으로 ETF에 소수점 매수)보다 강하게 읽히므로 문구 수정이 필요하고, 부가서비스 고지·개인정보 결합·투자권유 해당 여부는 사람(법무·준법)의 확인이 필요하며 모임 파밍을 막는 한도와 요건도 보강해야 한다."},"voices":[{"type":"일반형","quote":"친구들이랑 외식하고 온라인 쇼핑하는 만큼 모임 풀에 쌓이고 ETF를 같이 산다니 재미있어 보여요. 다만 연회비 1.5만원에 적립률이 외식 1.2%, 온라인 0.8%라 모임이 유지돼야 쓸모가 있겠네요.","would_adopt":true,"main_concern":"모임원 2~5명을 꾸려야 하고, 한 명이 빠지면 챌린지 달성이 흔들릴 수 있다는 점","exploit_or_risk":""},{"type":"체리피커","quote":"외식이랑 온라인만 이 카드로 긁고 나머지는 다른 카드로 돌릴게요. 챌린지 보너스 한도와 조건이 가입 화면에 명시된다니 그 선에서 딱 맞춰 챙기겠습니다.","would_adopt":true,"main_concern":"월 챌린지 조건과 보너스 한도가 얼마나 빡빡한지, 연회비 1.5만원 대비 이득이 나는지","exploit_or_risk":"보너스 한도 안에서만 소비를 몰고 나머지 소비는 타 카드로 돌리는 방식으로 쓸 수 있습니다. 챌린지 조건이 모임 전원의 투자 계좌 자동이체 유지라서, 지인끼리 2~5명 모임을 만들어 챌린지 달성 시점에만 자동이체를 맞추고 보너스를 받은 뒤 해지하거나 모임을 갈아타는 식의 우회가 가능합니다. 개인 적립은 별도로 유지되니 개인 적립 혜택만 챙기고 1년 내 해지하는 패턴도 예상됩니다. 운영 측에서는 챌린지 달성 후 자동이체 즉시 해지, 모임 반복 생성·해산, 소수점 ETF 매수 후 빠른 매도 여부를 점검해야 할 위험 지점입니다. 제공 통계상 체리피커는 채택자의 21%이고 건당 손익은 2.47만원입니다."},{"type":"충성형","quote":"쓰던 카드에 익숙해서 바꾸기 귀찮은데, 친구들이 다 같이 옮기자고 하면 소비를 몰아줄 수는 있어요. 포인트가 주식으로 쌓이고 내 지분을 앱에서 확인할 수 있다는 점은 마음에 들어요.","would_adopt":true,"main_concern":"기존 카드를 포기할 만큼 적립률(외식 1.2%, 온라인 0.8%)이 매력적인지, 모임 합의 과정이 번거롭지 않은지","exploit_or_risk":""},{"type":"휴면위험형","quote":"카드는 만들 수 있지만 평소 소비의 30% 정도만 쓸 것 같아요. 모임 챌린지를 챙겨야 한다는 게 부담이라 몇 달 지나면 서랍에 넣어둘 것 같아요.","would_adopt":false,"main_concern":"챌린지와 모임 관리가 귀찮아 사용 빈도가 떨어지고 연회비 1.5만원이 아깝게 느껴질 수 있다는 점","exploit_or_risk":""}],"brand":{"names":[{"name":"함께쌓기 카드","rationale":"포인트 일부를 모임 풀로 옮겨 각자 지분으로 쌓는 실제 구조를 그대로 말하며, 수익·불림을 연상시키는 표현이 없고 기존 카드명과 겹치지 않음"},{"name":"모아나눔 카드","rationale":"모임이 포인트를 모으고 지분을 각자 확인하는 흐름을 담았으나 '나눔'이 기부나 혜택 분배로 읽힐 수 있어 오인 소지가 있음"},{"name":"챌린지메이트 카드","rationale":"모임 챌린지 달성이 핵심 동기임을 드러내지만 보너스가 크다는 인상을 줄 수 있어 안내 문구 보강이 필요함"}],"recommended":"함께쌓기 카드","design":{"motif":"벽돌처럼 한 칸씩 쌓이는 블록 2~5개가 함께 하나의 탑을 이루는 모습. 각 블록은 구성원 한 명의 지분이며, 개인 적립에서 풀로 옮겨지는 화살표를 작게 곁들임","palette":["#1F3A5F","#3FA796","#F2C94C","#F5F7FA"],"tone":"차분하고 신뢰감 있는 친구 사이의 톤. 수익이나 성과를 부풀리지 않고 '내 몫을 함께 모은다'는 과정과 투명한 지분 확인을 강조"},"storyboard":[{"scene":1,"visual":"친구 셋이 카페에서 각자 폰 앱으로 이번 달 적립 포인트 중 일부를 모임 풀로 옮기는 장면. 화면에 '옮긴 만큼 내 적립에서 차감' 표시. 모임 초대는 앱 내 초대 링크로 이루어짐(초대형 상품 사례 P2는 약한 근거이므로 초대 방식은 시안 단계에서 검증)","copy":"내 적립 포인트 일부를, 모임과 함께 쌓아요."},{"scene":2,"visual":"모임원 모두 전월 실적 조건과 자동이체 조건을 채워 챌린지 달성 알림이 뜨고, 한도 내 보너스 포인트가 풀에 더해지는 장면. 앱에 각자 지분이 나뉘어 표시됨","copy":"모두 함께 채우면 한도 안에서 보너스가 더해지고, 내 지분은 앱에서 확인해요. 풀 합산은 추가 혜택이 아니에요."},{"scene":3,"visual":"모임이 고른 ETF를 소수점으로 매수하는 화면과 하단 고정 고지 문구. 광고 심의 대상이 될 수 있으므로(P3, 약한 근거) 심의 기준 원문 확인 전까지 문구는 구조 설명과 고지에 한정","copy":"쌓은 포인트는 모임이 고른 ETF 소수점 매수에 쓰여요. 투자 상품은 원금 손실이 발생할 수 있으며 카드 혜택은 투자 수익을 보장하지 않습니다."}],"channels":["발급사 모바일 앱 내 모임 초대·챌린지 화면 (카드 구조상 모임 2~5명 초대가 핵심 경로. 구조에서 도출한 판단이며 시장 성과 근거는 없음)","연계 증권 계좌 앱 내 안내 영역 (투자 계좌 자동이체 조건과 맞닿은 구조상의 판단)","모임통장류 인터넷은행의 초대 기능 홍보 방식 참고(P2, 약한 근거, 제목 수준): 초대 기능 중심 안내를 시험 후보로만 두고 채택 여부는 검증 후 정함","2030 대상 SNS·커뮤니티 채널은 근거 없음(P1 확인 못 함)이라 선택하지 않음"],"kpi":["모임 구성 완료율: 발급 회원 중 2~5명 모임을 만든 회원 비율 (목표 수치는 근거 확보 후 설정)","챌린지 달성 모임 비율: 구성원 전원이 전월 실적 조건과 자동이체 조건을 유지한 모임의 비율","고지 이해도와 광고 심의 적합성: 풀 합산에 추가 혜택이 없다는 점과 원금 손실 가능 고지의 이해도, 문의·민원 건수, 광고 사전 점검 통과 여부"],"needs_research":["2030 투자 입문자가 금융 카드 정보를 얻는 채널별 이용 현황 (P1 확인 못 함)","모임통장 등 초대형 금융상품 홍보 사례의 본문 내용과 성과 지표 (P2는 제목 수준)","ETF·투자 연계 상품 광고 심의 기준의 협회·금융당국 원문 (P3는 기사 제목 수준)","무신사 카드(T3), 증권사 연계 PLCC(T1)의 실제 혜택과 홍보 방식 원문 확인"]},"designs":{"A":{"title":"한 칸씩 쌓는 블록 탑"},"B":{"title":"함께·쌓기 타이포"},"C":{"title":"탁자에 둘러앉은 친구들"}},"designRec":"A","marketing":{"core":"친구와 모임을 만들어 챌린지를 채우면, 내 적립 포인트 일부와 조건 충족 시 한도 내 보너스 포인트가 각자 몫으로 ETF 소수점 매수에 쓰입니다.","lifecycle":[{"stage":"획득","goal":"카드 구조(개인 적립 일부를 풀로 이동, 조건 충족 시 한도 내 보너스)를 정확히 이해한 상태에서 발급을 신청하게 한다. 발급 건수보다 모임 구성 가능성이 높은 고객을 우선하고, 모집비가 드는 불특정 다수 노출보다 증권 계좌 이용 고객처럼 브랜드와 관계가 있는 고객을 먼저 겨냥한다."},{"stage":"온보딩","goal":"발급 후 90일 동안 간편결제 등록, 첫 결제, 투자 계좌 자동이체 연결, 모임 구성을 순서대로 완료하게 한다."},{"stage":"사용","goal":"전월 실적 30만원 조건과 자동이체 유지를 모임 단위로 달성하게 하여, 외식·온라인 이용이 정기적으로 이어지게 한다."},{"stage":"유지","goal":"휴면 진입과 모임 이탈을 선제적으로 감지해 대응하고, 보너스 지급 후에도 이용이 이어지는지 3개월·6개월 시점으로 확인한다."}]},"doc_head":"# 2030 투자입문자 대상 신규 신용카드 상품 런칭 기획안\n\n> **\"내 적립 포인트 일부를, 모임과 함께 쌓아요.\"**\n>\n> **신규 카드 가칭: [ 함께쌓기 카드 ]**\n>\n> *(Hero 이미지: 디자인 추천안 A. 짙은 남색 바탕에 구성원 한 명씩의 지분 블록이 한 탑으로 쌓이는 모습)*\n\n![함께쌓기 카드 디자인 추천안 A](assets/design_A.svg)\n\n---\n\n## 1. 요약\n\n함께쌓기 카드를 2030 투자입문자 대상 신규 신용카드 후보로 올리고, 법무·준법 검토와 고객사 데이터 수령 단계로 넘길 것을 제안합니다. 팀장님께 결정을 요청드리는 사항은 네 가지입니다. 첫째, 개인 적립에서 모임 풀로 옮기는 비율을 '절반 이내' 범위에서 상품팀이 확정하는 것. 둘째, 디자인은 A안(한 칸씩 쌓는 블록 탑)으로 진행하는 것. 셋째, 가드레일에서 사람 확인이 필요하다고 나온 부가서비스 고지, 증권사 연계 개인정보 결합, 투자권유 해당 여부를 법무·준법팀에 정식 의뢰하는 것. 넷째, BEP와 자사 포트폴리오 분석에 필요한 고객사 데이터를 요청하는 것입니다.\n\n기획 의도는 투자 리워드와 포인트의 주식 전환을 묶은 신용카드가 시판 카드 34종 중 한 종도 없다는 데서 출발합니다. 2030 투자입문자의 니즈 1순위가 투자(니즈 점수 0.95)인데, 이 영역을 다룬 카드는 비어 있습니다.\n\n핵심 타깃은 2030 투자입문자입니다. 연령대가 겹치는 사회초년생(25-29)은 같은 컨셉으로 넓힐 수 있는 2차 대상으로 둡니다.\n\n상품 컨셉은 다음과 같습니다. 본인 인증을 마친 발급 회원 2~5명이 모임을 만들고, 각자 외식·온라인 적립 포인트 중 일부를 모임 풀로 옮깁니다. 모임 전원이 전월 실적 30만원 이상과 투자 계좌 자동이체 유지를 채우면 월 한도 안에서 보너스 포인트가 풀에 더해지고, 풀은 모임이 고른 ETF 소수점 매수에 쓰입니다. 지분은 각자 몫으로 기록되며 투자 수익은 약속하지 않습니다.\n\n기대 효과는 디지털 트윈 시뮬레이션 수치로만 말씀드릴 수 있습니다. 페르소나 1,760명 기준 2030 투자입문자 채택 의향은 39.6%이고, 정적 손익은 7.95, 채택 고객 기준 손익은 5.55입니다. 모두 가정 기반 시뮬레이션이며 실제 전환율·손익이 아닙니다. 발급 목표, 취급고, ROI는 고객사 데이터가 있어야 계산할 수 있어 이번 보고에는 넣지 않았습니다(섹션 4 참고).\n\n## 2. 시장 조사와 기획 배경\n\n### 거시 트렌드\n\n투자와 이어진 카드와 소액 투자 서비스는 이미 시장에 나와 있습니다. 미래에셋 현대카드처럼 주식투자 전용 PLCC가 출시되었고(T1, 신뢰도 0.6), 미래에셋·삼성증권·토스증권이 소액·소수점 해외주식 거래 서비스로 경쟁하고 있습니다(T2, 신뢰도 0.55). 두 신호 모두 기사 제목 위주로 확인해 출시 시점과 세부 혜택은 검증하지 못했습니다. 수요가 있다는 점은 확인되지만 단순 적립만으로는 기존 상품과 구분하기 어렵다는 것이 이 신호들에서 얻은 시사점입니다.\n\n2030을 겨냥한 플랫폼 제휴 전용 카드도 늘고 있습니다. 삼성카드가 2026년 4월 무신사 전용 카드를 내놓았다는 보도가 있으나(T3, 신뢰도 0.7) 구체 혜택과 흥행 수치는 확인하지 못했습니다. 결제 접점이 토스·카카오페이 같은 간편결제 앱으로 옮겨 가는 흐름(T5)도 있지만 카드고릴라와 블로그형 출처 위주라 신뢰도를 0.4로 낮게 두었습니다.\n\n카드사의 마케팅·부가혜택 비용 부담과 수수료 인하 압력(T4, 신뢰도 0.4)은 고혜택 구조를 오래 유지하기 어렵다는 신호입니다. 일부 기사는 과거 자료일 수 있어 최신 여부를 따로 확인해야 합니다. 이 신호 때문에 혜택 재원과 약관상 변경 가능성을 처음부터 설계에 넣었습니다.\n\n소비자 니즈 분석에서 2030 투자입문자의 우선순위는 투자(0.95), 디지털(0.7), 단순함(0.7), 절약(0.6), 소속감(0.6) 순입니다. 월 소비는 외식 30만원, 온라인 25만원 순으로 커서 이 두 영역의 적립이 투자 재원 역할을 합니다. 여행·해외 특화(0.4), 고정비 절감(0.3), 보장·안전 부가서비스(0.3)는 포기해도 되는 항목으로 나왔습니다.\n\n### 경쟁사 동향\n\n시판 카드 34종의 혜택 태그를 직접 집계했습니다. 청구할인형이 15종, 해외결제·환전이 14종, 외식·카페가 12종, 편의점·마트가 11종으로 이미 붐비는 영역이고, 단순 정률, 무실적, 한도 없음 구조도 여러 발급사가 채택해 모방이 쉽습니다.\n\n비어 있는 영역은 투자 리워드(invest_reward)와 포인트의 주식 전환(point_to_stock)으로 둘 다 0종입니다. 모임 합산(group_pooling)과 소셜(social)도 0종이고, 챌린지형은 처음(ANNIVERSE) 1종뿐입니다. 함께쌓기 카드는 이 빈 영역을 조합했고, 34종 대비 새로움 0.82, 최근접 카드인 처음(ANNIVERSE)과의 유사도 0.17로 측정되었습니다.\n\n투자입문자 타깃과 구조가 가장 겹치는 기존 카드는 ZERO Edition3(할인형), 현대카드 M, LOCA LIKIT 1.2입니다. 세 카드 모두 investor를 타깃으로 표기했지만 투자 리워드 태그는 없습니다. 다만 투자 리워드 구조는 증권사·플랫폼 제휴만 확보되면 경쟁사가 따라 할 수 있고, 제휴 독점 여부는 이 데이터로 판단할 수 없습니다.\n\n### 자사 포트폴리오 분석\n\n고객사 라인업과 회원 데이터가 없어 카니발라이제이션 분석은 아직 할 수 없습니다. 필요한 입력과 대체 근거, 계산 방법은 섹션 4에 정리했습니다.\n\n## 3. 신상품 컨셉과 가치 제안\n\n### 3-1. 디자인 컨셉 3가지 후보안\n\nA안을 추천합니다. 블록 하나가 구성원 한 명의 지분이고 점선 빈 칸이 챌린지를 채워야 올라가는 자리라서, 포인트를 옮겨 각자 몫으로 쌓는 구조와 달성 조건을 따로 설명하지 않아도 전달됩니다. 브랜드 1차 모티프와 팔레트를 그대로 이어받아 앱 화면과 안내물로 넓히기도 쉽습니다. 세 안 모두 비율 856x540, 텍스트 대비 7.58 이상, 금칙어와 외부 리소스 없음을 코드로 검증했습니다.\n\n**[후보 A"};

function mdToHtml(md){
  var out=[],lines=md.split("\n"),inList=false;
  lines.forEach(function(raw){
    var l=raw.replace(/\s+$/,"");
    if(/^!\[/.test(l))return;
    var t=esc(l).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>");
    if(/^- /.test(l)){if(!inList){out.push("<ul>");inList=true;}out.push("<li>"+t.slice(2)+"</li>");return;}
    if(inList){out.push("</ul>");inList=false;}
    if(/^### /.test(l))out.push("<h3>"+t.slice(4)+"</h3>");
    else if(/^## /.test(l))out.push("<h2>"+t.slice(3)+"</h2>");
    else if(/^# /.test(l))out.push("<h1>"+t.slice(2)+"</h1>");
    else if(/^&gt; ?/.test(t))out.push("<blockquote>"+t.replace(/^&gt; ?/,"")+"</blockquote>");
    else if(/^---$/.test(l))out.push("<hr>");
    else if(l)out.push("<p>"+t+"</p>");
  });
  if(inList)out.push("</ul>");
  return out.join("");
}

  if(c.id==="all"){setMode("e2e");req=D.request;state.title=c.name;}
  else{var ix=sampleIndex(c.id);setMode("single");if(ix>=0)sel.value=String(ix);req=ix>=0?window.SAMPLES[ix].chat.request:"";state.title=c.name;}
  $("title").textContent=state.title;
  var m=addAgent(ORCH,/*[script]*/"<b>"+esc(c.name)+"</b>을(를) 선택했습니다. "+(c.id==="all"?"요청을 보내면 단계가 순서대로 진행되고, 지금 어느 단계인지 오른쪽 실행 흐름에서 볼 수 있습니다.":"이 단계가 하는 일: "+esc(c.role)+" 요청을 보내면 이 단계만 실행합니다.")+(req?'<div class="chips" style="justify-content:flex-start;margin-top:10px"><button type="button" class="chipbtn" data-start="1">'+esc(req)+'</button></div>':""));
  var b=m.querySelector("[data-start]");if(b)b.onclick=function(){handle(req);};
  $("q").focus();
}
function welcome(){
  var w=el("div",{class:"welcome cards"},'<h2>무엇을 도와드릴까요?</h2><p>전체 기획을 처음부터 끝까지 진행하거나, 필요한 단계 하나만 골라 실행할 수 있습니다.</p>');
  var g=el("div",{class:"agrid"});
  AGENT_CARDS.forEach(function(c){
    var b=el("button",{type:"button",class:"acard"+(c.feat?" feat":"")+(c.opt?" opt":"")},'<div class="top"><b>'+esc(c.name)+'</b></div><div class="role">'+esc(c.role)+'</div>');
    b.onclick=function(){pickCard(c);};g.appendChild(b);
  });
  w.appendChild(g);stream.appendChild(w);
}
var origHandle=handle;handle=function(t){var w=stream.querySelector(".welcome");if(w)w.remove();return origHandle(t);};
$("newchat").onclick=function(){reset();welcome();drawHist();$("side").classList.remove("open");};
$("menu").onclick=function(){$("side").classList.toggle("open");};

/* ---------- 케이스 선택 ---------- */
function setCase(k,keep){
  if(!CASES[k])return;
  CUR=k;D=CASES[k];L=D.labels;$("casebadge").textContent=U("badge");$("casesel").value=k;
  $("q").placeholder="예: "+D.request;
  if(!keep){reset();welcome();}
}
["genz","genz2"].forEach(function(k){if(!CASES[k]){var go=$("casesel").querySelector('option[value="'+k+'"]');if(go)go.remove();}});
$("casesel").onchange=function(){if(state.running){$("casesel").value=CUR;return;}setCase($("casesel").value);};

/* ---------- 점검표 ---------- */
var UK="cardstudio.userview.checks";
var UCHECKS=["요청 한 줄로 6단계 결과가 대화로 차례로 보인다","각 단계 말풍선에 무엇을 했는지 한 줄이 있다","오른쪽 실행 흐름에서 지금 어느 단계가 돌고 있는지 보인다","채택 의향·수익 옆에 가상 고객 시뮬레이션 고지가 있다","시장기회발굴 직후와 시장성 검증 직후에 구체적인 확인 질문이 나온다","질문을 고르거나 직접 적으면 관련 단계를 다시 확인하고 보강 자료와 함께 답한다","끝나면 채팅에 최종 요약이 뜨고 “리포트로 보기”가 있다","리포트에 확인 질문과 보강 자료가 담긴다","왼쪽에 지난 대화 기록이 쌓이고 다시 열린다","케이스에서 GenZ 특화를 고르면 같은 6단계가 GenZ 분석으로 재생된다"];
var saved={};try{saved=JSON.parse(localStorage.getItem(UK)||"{}")||{};}catch(e){saved={};}
var ul=$("uchecks");
UCHECKS.forEach(function(t,i){var id="U-0"+(i+1),li=el("li"),lb=el("label"),cb=el("input",{type:"checkbox"});cb.checked=!!saved[id];cb.onchange=function(){saved[id]=cb.checked;try{localStorage.setItem(UK,JSON.stringify(saved));}catch(e){}};lb.appendChild(cb);lb.appendChild(el("span",{text:id+" "+t}));li.appendChild(lb);ul.appendChild(li);});
setRail(-1);drawHist();welcome();
window.__uv={state:state};
if(/[?&]debug=1/.test(location.search))window.__dbg={run:run,setCase:setCase,report:function(){return buildIntegratedReport();},D:function(){return D;},state:state};
})();
</script>
