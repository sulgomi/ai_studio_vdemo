ont-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#9fb3ff" font-weight="700" text-anchor="start">#06</text><text x="70" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#fff" font-weight="500" text-anchor="start">가드레일이 수정이 필요하다고 판정하면 컨셉으로 되돌아가 실제로 고칩니다</text></svg>