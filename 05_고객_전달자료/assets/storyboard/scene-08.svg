ic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#1f9d6b" font-weight="400" text-anchor="start">18개월 이내 ✓</text><rect x="568" y="416" width="100" height="28" rx="6" fill="#fff" stroke="#c9d1e3" stroke-width="1"/><text x="618" y="435" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#1f2a44" font-weight="600" text-anchor="middle">HTML 저장</text><rect x="678" y="416" width="70" height="28" rx="6" fill="#fff" stroke="#c9d1e3" stroke-width="1"/><text x="713" y="435" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#1f2a44" font-weight="600" text-anchor="middle">인쇄</text><rect x="0" y="484" width="960" height="56" fill="#1f2a44"/><text x="24" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#9fb3ff" font-weight="700" text-anchor="start">#08</text><text x="70" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#fff" font-weight="500" text-anchor="start">결과는 7개 섹션 기획서로 정리되고, 문장마다 근거 출처를 따라갈 수 있습니다</text></svg>