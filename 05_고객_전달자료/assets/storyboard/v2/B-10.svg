<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a93a8"/></marker></defs><rect width="960" height="540" fill="#f6f7fb"/><rect x="20" y="16" width="920" height="460" rx="10" fill="#fff" stroke="#c9d1e3" stroke-width="1"/><rect x="20" y="16" width="920" height="28" rx="10" fill="#eef2fb"/><circle cx="40" cy="30" r="5" fill="#e46a6a"/><circle cx="56" cy="30" r="5" fill="#e8b84a"/><circle cx="72" cy="30" r="5" fill="#5cbf7a"/><text x="100" y="35" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#8a93a8" font-weight="400" text-anchor="start">개별 에이전트 활용 · 에이전트 협의</text><rect x="848" y="22" width="84" height="16" rx="8" fill="#fff3e0" stroke="#d9822b" stroke-width="1"/><text x="890" y="34" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="10" fill="#d9822b" font-weight="600" text-anchor="middle">데모 모드</text><rect x="32" y="56" width="896" height="400" rx="8" fill="#fff" stroke="#c9d1e3" stroke-width="1"/><text x="60" y="88" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#1f2a44" font-weight="700" text-anchor="start">타 전문 영역이 필요하면 에이전트를 함께 호출해 협의</text><rect x="60" y="108" width="840" height="52" rx="8" fill="#f3f7ff" stroke="#3b6ef5" stroke-width="1"/><text x="76" y="130" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#3b6ef5" font-weight="700" text-anchor="start">오케스트레이터</text><text x="76" y="150" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#1f2a44" font-weight="400" text-anchor="start">공백이 곧 수요는 아님 → 04 소비자(니즈), 02 트렌드(결제 습관)를 함께 호출</text><rect x="60" y="190" width="240" height="52" rx="8" fill="#eef2fb" stroke="#3b6ef5" stroke-width="1.5"/><text x="180.0" y="212" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">03 경쟁사</text><text x="180.0" y="231" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="400" text-anchor="middle">실적조건 완화 0종 / 34종</text><rect x="360" y="190" width="240" height="52" rx="8" fill="#eef2fb" stroke="#3b6ef5" stroke-width="1.5"/><text x="480.0" y="212" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">04 소비자</text><text x="480.0" y="231" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="400" text-anchor="middle">디지털·절약 니즈</text><rect x="660" y="190" width="240" height="52" rx="8" fill="#eef2fb" stroke="#3b6ef5" stroke-width="1.5"/><text x="780.0" y="212" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">02 트렌드</text><text x="780.0" y="231" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="400" text-anchor="middle">간편결제 일평균 1조464억원</text><line x1="300" y1="216" x2="360" y2="216" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><line x1="360" y1="226" x2="300" y2="226" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><line x1="600" y1="216" x2="660" y2="216" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><line x1="660" y1="226" x2="600" y2="226" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><rect x="110" y="254" width="90" height="22" rx="11" fill="#fff" stroke="#d9822b" stroke-width="1"/><text x="155.0" y="269" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#d9822b" font-weight="600" text-anchor="middle">혜택 공백</text><rect x="410" y="254" width="130" height="22" rx="11" fill="#fff" stroke="#1f9d6b" stroke-width="1"/><text x="475.0" y="269" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#1f9d6b" font-weight="600" text-anchor="middle">니즈와 맞닿음</text><rect x="700" y="254" width="150" height="22" rx="11" fill="#fff" stroke="#3b6ef5" stroke-width="1"/><text x="775.0" y="269" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#3b6ef5" font-weight="600" text-anchor="middle">결제 접점이 앱으로</text><rect x="60" y="296" width="840" height="90" rx="8" fill="#eef2fb" stroke="#c9d1e3" stroke-width="1"/><text x="80" y="322" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#8a93a8" font-weight="700" text-anchor="start">종합 의견 (의사결정 지원)</text><text x="80" y="348" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" fill="#1f2a44" font-weight="600" text-anchor="start">공백 혜택과 디지털·절약 니즈는 부합하나, 간편결제 습관과</text><text x="80" y="370" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" fill="#1f2a44" font-weight="600" text-anchor="start">혜택 불신이 발급 동기를 약화시킬 가능성</text><rect x="60" y="398" width="840" height="40" rx="8" fill="#fff" stroke="#1f9d6b" stroke-width="1"/><text x="80" y="423" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#1f9d6b" font-weight="600" text-anchor="start">최종 판단은 사람이 수행, 에이전트는 근거와 쟁점을 정리</text><rect x="0" y="484" width="960" height="56" fill="#1f2a44"/><text x="24" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#9fb3ff" font-weight="700" text-anchor="start">#10</text><text x="70" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#fff" font-weight="500" text-anchor="start">필요하면 다른 전문가 에이전트를 함께 불러 의견을 모아 드립니다</text></svg>