<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a93a8"/></marker></defs><rect width="960" height="540" fill="#f6f7fb"/><rect x="20" y="16" width="920" height="460" rx="10" fill="#fff" stroke="#c9d1e3" stroke-width="1"/><rect x="20" y="16" width="920" height="28" rx="10" fill="#eef2fb"/><circle cx="40" cy="30" r="5" fill="#e46a6a"/><circle cx="56" cy="30" r="5" fill="#e8b84a"/><circle cx="72" cy="30" r="5" fill="#5cbf7a"/><text x="100" y="35" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#8a93a8" font-weight="400" text-anchor="start">사용자 뷰 · 에이전트 협의</text><rect x="848" y="22" width="84" height="16" rx="8" fill="#fff3e0" stroke="#d9822b" stroke-width="1"/><text x="890" y="34" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="10" fill="#d9822b" font-weight="600" text-anchor="middle">데모 모드</text><rect x="32" y="56" width="896" height="400" rx="8" fill="#fff" stroke="#c9d1e3" stroke-width="1"/><text x="60" y="88" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#1f2a44" font-weight="700" text-anchor="start">에이전트 간 협의 · 컨셉 보완</text><rect x="60" y="120" width="200" height="52" rx="8" fill="#eef2fb" stroke="#3b6ef5" stroke-width="1.5"/><text x="160.0" y="142" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">06 컨셉</text><text x="160.0" y="161" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="400" text-anchor="middle">3안 중 같이굴려요 승자</text><rect x="380" y="120" width="200" height="52" rx="8" fill="#eef2fb" stroke="#3b6ef5" stroke-width="1.5"/><text x="480.0" y="142" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">07 시장성 검증</text><text x="480.0" y="161" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="400" text-anchor="middle">가상 고객 1,760명</text><rect x="700" y="120" width="200" height="52" rx="8" fill="#fff" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="5 3"/><text x="800.0" y="142" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">08 가드레일 (선택)</text><text x="800.0" y="161" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="400" text-anchor="middle">재무·준법 의견</text><line x1="260" y1="136" x2="380" y2="136" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><line x1="380" y1="156" x2="260" y2="156" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><line x1="580" y1="146" x2="700" y2="146" stroke="#8a93a8" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="200" width="250" height="30" rx="15" fill="#fff" stroke="#3b6ef5" stroke-width="1"/><text x="185.0" y="220" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#3b6ef5" font-weight="600" text-anchor="middle">컨셉 3안과 코드 평가 결과 전달</text><rect x="330" y="200" width="250" height="30" rx="15" fill="#fff" stroke="#1f9d6b" stroke-width="1"/><text x="455.0" y="220" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#1f9d6b" font-weight="600" text-anchor="middle">경쟁사 모방 시 28.1%, 체리피커 반응 전달</text><rect x="620" y="200" width="280" height="30" rx="15" fill="#fff" stroke="#8a93a8" stroke-width="1"/><text x="760.0" y="220" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="600" text-anchor="middle">이름이 투자 수익을 연상시킨다는 의견</text><rect x="60" y="258" width="840" height="80" rx="8" fill="#eef2fb" stroke="#c9d1e3" stroke-width="1"/><text x="80" y="284" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#8a93a8" font-weight="700" text-anchor="start">협의 쟁점</text><text x="80" y="310" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#1f2a44" font-weight="400" text-anchor="start">‘같이굴려요’ 이름이 실제 구조(모임 합산 적립)보다 강한 인상. 필요 시에만 가드레일이 의견 추가</text><rect x="60" y="352" width="840" height="90" rx="8" fill="#fff" stroke="#1f9d6b" stroke-width="1"/><rect x="80" y="372" width="170" height="44" rx="8" fill="#fff" stroke="#d64545" stroke-width="1"/><text x="165" y="400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#d64545" font-weight="700" text-anchor="middle">같이굴려요 카드</text><line x1="250" y1="394" x2="330" y2="394" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><text x="290" y="386" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="10" fill="#3b6ef5" font-weight="600" text-anchor="middle">컨셉 재작업</text><rect x="340" y="372" width="170" height="44" rx="8" fill="#fff" stroke="#1f9d6b" stroke-width="2"/><text x="425" y="400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f9d6b" font-weight="700" text-anchor="middle">함께쌓기 카드</text><text x="540" y="392" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="600" text-anchor="start">협의 결과로 이름이 바뀜</text><text x="540" y="414" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#8a93a8" font-weight="400" text-anchor="start">변경 이력은 기획서 부록에 남음</text><rect x="0" y="484" width="960" height="56" fill="#1f2a44"/><text x="24" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#9fb3ff" font-weight="700" text-anchor="start">#06</text><text x="70" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#fff" font-weight="500" text-anchor="start">에이전트 간 결과 교환으로 컨셉 보완, 가드레일은 필요 시에만 추가</text></svg>