0" rx="8" fill="#f4fbf7" stroke="#1f9d6b" stroke-width="2"/><text x="605" y="286" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#1f2a44" font-weight="700" text-anchor="middle">41.2%</text><rect x="60" y="352" width="840" height="90" rx="8" fill="#eef2fb" stroke="#c9d1e3" stroke-width="1"/><text x="80" y="378" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="start">남은 항목은 숨기지 않고 담당 부서 확인으로 넘깁니다</text><text x="80" y="402" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#8a93a8" font-weight="400" text-anchor="start">환급은 연 1회로 정리. 문구 보완, 체리피킹 비중(재무 결정), 부가서비스 변경 고지·개인정보는 사람 확인</text><text x="80" y="426" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#d64545" font-weight="600" text-anchor="start">채택 의향은 가상 고객 시뮬레이션(가정 기반) 값</text><rect x="0" y="484" width="960" height="56" fill="#1f2a44"/><text x="24" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="16" fill="#9fb3ff" font-weight="700" text-anchor="start">#06</text><text x="70" y="518" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="15" fill="#fff" font-weight="500" text-anchor="start">협의 결과가 이름·규칙에 반영, 미해결 항목은 공개</text></svg>