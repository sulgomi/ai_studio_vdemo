<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540"><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8a93a8"/></marker></defs><rect width="960" height="540" fill="#f6f7fb"/><rect x="20" y="16" width="920" height="460" rx="10" fill="#fff" stroke="#c9d1e3" stroke-width="1"/><rect x="20" y="16" width="920" height="28" rx="10" fill="#eef2fb"/><circle cx="40" cy="30" r="5" fill="#e46a6a"/><circle cx="56" cy="30" r="5" fill="#e8b84a"/><circle cx="72" cy="30" r="5" fill="#5cbf7a"/><text x="100" y="35" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#8a93a8" font-weight="400" text-anchor="start">클로징</text><rect x="848" y="22" width="84" height="16" rx="8" fill="#fff3e0" stroke="#d9822b" stroke-width="1"/><text x="890" y="34" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="10" fill="#d9822b" font-weight="600" text-anchor="middle">데모 모드</text><text x="480.0" y="110" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="20" fill="#1f2a44" font-weight="700" text-anchor="middle">데모에서 보신 것</text><rect x="80" y="140" width="250" height="230" rx="8" fill="#fff" stroke="#3b6ef5" stroke-width="2"/><text x="205" y="170" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" fill="#3b6ef5" font-weight="700" text-anchor="middle">실제 AI가 만든 것</text><text x="104" y="204" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#1f2a44" font-weight="400" text-anchor="start">· 시장조사 결과와 출처</text><text x="104" y="236" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#1f2a44" font-weight="400" text-anchor="start">· 컨셉 3안</text><text x="104" y="268" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" fill="#1f2a