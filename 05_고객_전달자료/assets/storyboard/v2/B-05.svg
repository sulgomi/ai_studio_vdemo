 KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">07 시장성 검증</text><text x="480.0" y="161" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="400" text-anchor="middle">채택 의향 38.3%</text><rect x="700" y="120" width="200" height="52" rx="8" fill="#fff" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="5 3"/><text x="800.0" y="142" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" fill="#1f2a44" font-weight="700" text-anchor="middle">08 가드레일 (선택)</text><text x="800.0" y="161" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="400" text-anchor="middle">재무·준법 의견</text><line x1="260" y1="136" x2="380" y2="136" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><line x1="380" y1="156" x2="260" y2="156" stroke="#3b6ef5" stroke-width="1.5" marker-end="url(#ah)"/><line x1="580" y1="146" x2="700" y2="146" stroke="#8a93a8" stroke-width="1.5" marker-end="url(#ah)"/><rect x="60" y="200" width="250" height="30" rx="15" fill="#fff" stroke="#3b6ef5" stroke-width="1"/><text x="185.0" y="220" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#3b6ef5" font-weight="600" text-anchor="middle">컨셉 3안과 코드 평가 전달</text><rect x="330" y="200" width="250" height="30" rx="15" fill="#fff" stroke="#1f9d6b" stroke-width="1"/><text x="455.0" y="220" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#1f9d6b" font-weight="600" text-anchor="middle">체리피커 채택자 45.0% 전달</text><rect x="620" y="200" width="280" height="30" rx="15" fill="#fff" stroke="#8a93a8" stroke-width="1"/><text x="760.0" y="220" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="11" fill="#8a93a8" font-weight="600" text-anchor="middle">이름이 AI 개인화처럼 읽힌다는 의견</text><rect x="60" y="258" width="